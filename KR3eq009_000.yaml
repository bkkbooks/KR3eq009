front:
  text: 序余友王君孟英少年失怙其尊人彌留之際執孟英手而囑曰人生天地之間必期有用於世汝識斯言吾無憾矣孟英泣拜而銘諸心腹然自顧家貧性介不能為利達之人將何以為世用耶聞先哲有不為良相則為良醫之語因自顏其室曰潛齋而鋭志於軒岐之學潛心研究遂抉其微年未冠遊長山即納交於余每見其治病之奇若有天授而視疾之暇恆手一編不輟也繼瞻其齋頭一聯云讀書明理好學虛心可見志苦力學蘊之胸中者淵深莫測乃能窮理書性出之指下者神妙難言二十年來活人無錯豈非以用世之才運其濟世之術而可垂諸後世者哉今就余耳目所及之妙法仿丁長孺刻仲淳案之例録而付梓名曰回春録然見聞有限遺美極多世之君子必有如莊斂之華岫云其人者更為之遠搜博採以廣其傳而余粳秕在前有榮施矣道光二十三年癸卯冬十二月愚弟周鑅拜題
