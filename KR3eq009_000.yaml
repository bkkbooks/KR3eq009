body:
  text: 一內科感冒一何叟年近八旬冬月傷風有面赤氣逆煩躁不安之象孟英曰此喻氏所謂傷風亦有戴陽證也不可藐視以東洋人參細辛炙甘草熟附片白朮白芍茯苓乾薑五味胡桃肉細茶蔥白一劑而瘳孟英曰此真陽素擾痰飲內動衛陽不固風邪外入有根蒂欲拔之虞誤投表散一汗亡陽故以真武四逆諸法回陽鎮飲攘外安內以為劑也不可輕試於人致干操刃之辜慎之慎之江小香病勢危篤浼人迎孟英診之脈虛弦而小數頭痛偏於左後子夜熱躁肢冷欲嘔口乾不欲飲不飢不欲食舌謇言澀溺黃而頻曰體屬素虛此由患感時邪過投溫散陰津陽氣皆傷後來進補而勢反日劇者滋膩妨其中運剛烈動其內風以致醫者僉云表之不應補亦無功竟成無藥可治之證雖然不過難治耳未可遽棄也與秋石水拌制高麗參蓯蓉首烏生白芍牡蠣楝實鹽水炒橘紅桑椹石斛蒺藜茯苓煎湯吞飯丸肉桂心五分一劑躁平嘔止各恙皆減連投數服粥食漸安乃去首烏楝實加砂仁末拌炒熟地菊花枸杞半月而瘳周子朝患惡寒頭痛發熱酷似傷寒而兼心下痛脹孟英脈之右部沉滑苔黃不渴溲如蘇木汁先以蔥豉湯加山梔黃連杏仁貝母蔞仁橘皮為方服後微汗而不惡寒反惡熱雖湯飲略溫即氣逆欲死孟英曰客邪解矣清其痰熱可也豫知母花粉杏仁貝母旋復滑石石斛橘皮枇杷葉茅根蘆根地栗海虴等藥果吐膠痰甚多而納食漸復惟動則欲喘於肅上之中佐以滋下為善後而瘥寓意草謂傷風亦有戴陽證此為高年而言然有似是而非者黃鼎如母年登大耋季冬感冒痰嗽氣逆額汗顴紅胸痞不飢神情躁擾孟英診脈左弦疾而促右滑數而溢苔色滿布系冬溫挾痰阻肺治節不伸肝陽鼓舞直升昔羅謙甫有治痰火類孤陽之案與此頗相似也以小陷胸湯加薤白旋覆赭石花粉海虴鳧茈竹瀝為大劑投之痰活便通數日而瘥繼有陳舜廷之父年逾花甲患痰嗽氣逆惟飲薑湯則胸次舒暢醫者以為真屬虛寒矣連投溫補之劑馴致咽痛不食苔色灰刺便祕無溺求孟英診之脈至雙弦按之索然略有胃氣曰渴喜薑湯者不過為痰阻清陽之證據耳豈可妄指為寒而迭投剛烈之劑哉胃陰已竭藥不能為矣丙申春蜀人石符生將赴鄧云崖司馬之招經杭抱病僑於張柳吟之舊館亦為寓側陳六順治困居仃之主人知之即告以柳吟僕病之事石聞之悚然亟遣人延孟英診焉脈沉而澀滯模糊不分至數肢涼畏冷涎沫上湧二便澀少神氣不爽曰此途次感風濕之邪失於解散已從熱化加以溫補致氣機愈形窒塞邪熱漫無出路必致爍液成痰逆行而上但與舒展氣機則痰行熱降諸恙自瘳矣以黃連黃芩枳實橘皮梔子淡豉桔梗杏仁貝母鬱金通草紫菀竹茹蘆蔔汁等藥三服而起調理匝旬遂愈余某年三十餘發熱數日醫投涼解之法遂嘔吐自汗肢冷神疲亟延孟英診之脈微弱曰內傷也豈可視同伏暑而一概治之徑不詳辨其證耶與黃耆建中湯去飴加龍骨生薑茯苓橘皮投劑即安續加人參白術逾旬而愈何新之亦儒醫也患感旬日胡士揚診謂勢欲內陷舉家惶惶渠表弟沈悅亭亦工岐黃而心折於孟英因拉孟英視之厄忒苔膩便祕痰多心下拒按持其脈右手洪大滑數與小陷胸湯加沙參菖蒲貝母紫菀薤白竹茹杏仁旋復枇杷葉之類數劑而安繼以甘涼二旬後得大解而瘥石芷卿患感張某連投柴葛之藥熱果漸退而復熱之後更孔甚乃延孟英診焉先以梔子豆豉黃芩黃連等藥清解其升浮之熱俟邪歸於腑脈來弦滑而實徑用承氣湯下之時其尊人北涯赴甌無人敢主其可服否另招他醫決之以為太峻且腹不堅滿妄攻慮變舉家聞之搖惑暮夜復懇再診孟英辨論洋洋堅主前議服後果下黑矢次日大熱大汗大渴引飲孟英曰此腑垢行而經熱顯矣豫竹葉石膏湯兩劑繼以育陰充津調理而康範廉居患恙旬日後病劇金粟香薦孟英視之大解已行熱退未淨氣逆不飢厄忒自汗脈形虛大舌紫無苔為上焦熱戀下部陰虧之象與西洋參旋覆竹茹枇杷葉石斛柿蒂牡蠣龜板刀豆牛膝之劑兩服即舌潤知飢厄汗皆罷乃去刀豆旋覆柿蒂加熟地胡桃肉當歸投之而愈範廉居之室人患恙苔膩口酸耳鳴不寐不飢神憊脘痛頭搖脈至虛弦按之澀弱以當歸白芍枸杞木瓜楝實半夏石斛茯神竹茹蘭葉白豆蔻為養營調氣和胃柔肝之法數啜而瘳範廉居令嬡患感壯熱殿屎二便皆閉苔黃大渴脹悶難堪脈來弦滑數實系腑實證也投桃核承氣湯加蛇萊蔔二劑而痊廉居尊人穎禾曰甚矣服藥之不可不慎也三人之證醫者皆謂可危而治之日劇君悉以一二劑起之抑何神歟因憶四十二歲時患痁古瘧疾胡魁元先用首烏太早遂致客邪留戀纏綿百日大為所困嗣後不敢服藥今四十年矣風溫沈裕昆妻偶發脘痛範某豫逍遙法痛頗止而發熱咽痛邀顧聽泉診視之知感溫邪豫清散法痛已止而熱不退七日後目閉鼻塞耳聾肢搐不言語不飲食顧疑險證願質之孟英而沈之兩郎皆從王瘦石學醫因請決於師瘦石亦謂孟英識超我當為汝致之時已薄暮乃飛刺追邀比孟英親視其外候如是而左手診畢即縮去隨以右手出之遽曰非神昏也繼挖牙關察其苔色白滑詢知大解未行曰病是風溫然不逆傳膻中而順傳胃腑證無可恐聽泉學問勝我知證有疑竇而虛心下問豈非胸襟過人處但溫邪傳胃世所常有而此證如此駭人乃素有痰飲盤踞胃中外邪入之得以憑藉苔色之不形黃燥者亦此故耳不可誤認夫溫為熱邪脈象既形弦滑以數但令痰飲一降苔必轉黃此殆云遮霧隱之時須具溫太真燃犀之照庶不為病所欺昔人於溫證僅言逆傳不言順傳後世遂誤執傷寒在足經溫熱在手經不知經絡貫串豈容界限喻氏嘉言謂傷寒亦傳手經但足經先受之耳吾謂溫熱亦傳足經但手經先受之耳一隅三反既有其逆豈無其順蓋自肺之心包病機漸進而內陷故曰逆自肺之胃腑病機欲出而下行故曰順今邪雖順傳欲出未能所謂胃病則九竅不和與逆傳神昏之犀角地黃湯證大相徑庭郭雲臺云胃實不和投滾痰而非峻可謂治斯疾之真詮遂書小陷胸合蠲飲六神湯加枳實厚朴以蘆蔔煮水煎藥和入竹瀝一杯送下礞石滾痰丸四錢沈嫌藥峻似有難色孟英曰既患駭人之病必服駭人之藥藥不瞑眩厥疾勿瘳盍再質之瘦石聽泉乎沈頷之王顧閲方僉以為是且云如畏劑重陸續徐投可也翌日孟英與聽泉會診脈症不甚減詢知昨藥分數次而服孟英曰是因勢分力緩之故也今可釋疑急進病必轉機聽泉深然之黎明果解出膠韌痰穢數升各恙即減略吐言語稍啜稀粥苔轉黃燥藥改輕清漸以向安嗣與育陰柔肝而愈程燮庭乃郎芷香今春病溫而精關不固旬日後陡然莖縮寒顫自問不支人皆謂其為虛瘧欲投參附孟英曰非瘧也平日體豐多濕厚味釀痰是以苔膩不渴善噫易吐而吸受風溫即以痰濕為山險乘其陰虛陽擾流入厥陰甚易豈容再投溫補以劫液錮邪而速其痙厥耶伊家以六代單傳父母深憂之堅求良治孟英曰吾雖洞識其證而病情轇轕縱有妙劑難許速功治法稍乖亦防延誤雖主人篤信我有堅持恐病不即瘳必招物議中途歧惑有過誰歸倘信吾言當邀顧聽泉會診匡余之不逮即以杜人之妄議程深然之於是王顧熟籌午後進肅清肺胃方以解客邪蠲痰濕而斡旋樞機早晨投涼腎舒肝法以靖浮越搜隧絡而守關鍵病果遞減奈善生嗔怒易招外感不甘淡泊反復多次每復發必莖縮寒顫甚至齒縫見紫血瓣指甲有微紅色溺短而渾黑極臭孟英曰幸上焦已清中樞已運亟宜填補腎陰清除肝熱以西洋參二冬二地蓯蓉花粉知母黃柏黃連川楝石斛白芍石英牡蠣龜板鱉甲阿膠雞子黃之類相迭為方大劑連投二十餘帖各恙漸退繼以此藥熬膏晨服午進繆氏資生方各品不炒皆生曬研末竹瀝為丸枇杷葉湯送下服至入秋始得康健孟英曰古人丸藥皆用蜜最屬無謂宜各因其證而變通之此其一法也韓組林年近古稀孟冬患肢厥頭腫譫語遺尿包某作虛風類中進以溫補勢益劇孟英脈之左弦數右滑溢乃痰熱內阻風溫外侵豫羚羊角貝母竹茹梔子連翹白薇桑葉菊花花粉丹皮旋覆以蘆蔔湯煎服而愈錢聞遠仲郎患感湯某進桂朴薑柴等藥而痰血頻咯神瞀耳聾譫語便溏不飢大渴苔黑溲少徹夜無眠範應樞顧聽泉疊進輕清黑苔漸退舌絳無津外證依然不能措手孟英診之脈皆細數乃真陰素虧營液受爍不必以便溏不食而畏滋膩也授以西洋參生地二至丸二冬龜板燕窩竹茹貝母銀花藕汁梨汁葳蕤百合等藥二劑咯血漸至痰出甚多漸進稀糜夜能稍寐五劑熱退瀉止渴始減脈漸和旬日後解燥屎而痊王炳華之子患感葉某用溫散藥而氣逆礙臥四明老醫王秉衡作腎虛不能納氣治連服大劑溫補喘嗽益劇面浮跗腫抬肩自汗大渴脅痛乞治於孟英已半月不交睫矣診其脈右部弦大而強舌根黑苔如煤者兩條面黧形瘦幸而大解溏瀉得能消受許多誤藥徑豫旋復代赭石黃連枳實栝蔞蘇子杏仁萊蔔汁紫菀生石膏六大劑始能就枕而大渴不止脘腹反形痞脹按之堅痛乃去旋復代赭石少加白芥子半夏薤白兼令日啖北梨數十枚服旬日胸腹皆舒苔色盡退唯嗽未已改用西洋參杏仁貝母蘆根知母冬瓜子枇杷葉花粉柿霜竹瀝十許劑嗽止而跗腫渴瀉亦皆霍然矣凡啖梨三百餘斤聞者莫不詫異俞博泉令郎患感即兼腹痛而脹胡某投以溫散二便不行昏譫大渴舌苔黑刺孟英以犀角連翹楝實薄荷黃連花粉元參大黃服之便下神清為乃去犀角加丹皮二帖苔化熱退惟少腹梗脹不甚知飢改投山梔黃連楝實蒺藜延胡橘核蓯蓉花粉制軍諸藥連解黑矢漸以向安正欲養陰之際而惑於旁言另招金某服大劑溫補藥以圖元氣驟復不知餘燼內燔營受灼而血上溢液被爍而肌消消猶謂吐血宜補形瘦為虛竟竭力補死而後已周光遠令堂患溫邪痰嗽脘悶汗多孟英投石膏竹菰知母花粉旋覆貝母蔞仁紫菀等藥三十劑而愈陳赤堂令正患感面赤不眠煩躁譫語口甘渴膩溲澀而痛顧聽泉多劑清解未應孟英切其脈左弦洪而數右滑而溢胸次痞結大解未行肝陽上浮肺氣不降痰熱阻痹邪乃逗留與小陷胸湯合溫膽湯雪羹加旋復薤白投之胸結漸開乃去半夏薤白而送服當歸龍薈丸譫語止且能眠參以通幽湯下其黑矢三次後始進養陰和胃而痊春溫余侄森伯患發熱面赤渴而微汗孟英視之曰春溫也乘其初犯邪尚在肺是以右寸之脈洪大宜令其下行由腑而出則可霍然投知母花粉冬瓜子桑葉枇杷葉黃芩葦莖梔子等藥果大便連泄極熱之水二次而脈靜身涼知飢啜粥遂痊設他人治之初感總用汗藥勢必釀成大證濮樹堂室懷妊五月患春溫口渴善嘔壯熱無汗旬日後始浼孟英視之見其煩躁譫語苔黃不燥曰痰熱阻氣也病不傳營血藥禁用試令按其胸次果然堅痛而大解仍行法當開上用小陷胸湯加石菖蒲枳實杏仁貝母竹茹郁金梔子連翹等藥蘆蔔湯煎服服二劑神情即安四帖後心下豁然然心腹如烙嘔吐不納改投大劑甘寒加烏梅頻啜漸康秋間得子亦無恙姚令輿室素患喘嗽而病春溫醫知其本元久虧投以溫補痙厥神昏耳聾譫語面青舌絳痰喘不眠皆束手矣延孟英診之脈猶弦滑曰證雖危險生機未絶遽爾輕棄毋乃太忍與犀角羚羊角元參沙參知母花粉石膏以清熱息風救陰生液佐蓯蓉石英鱉甲金鈴旋覆貝母竹瀝以潛陽鎮逆通絡蠲痰三劑而平繼去犀角羚羊角石膏加生地黃服旬日而愈仲秋令輿病竟誤服溫補數日而殞豈非命耶許芷卿亦精於醫偶患外感即服清散之藥而證不減或疑其非春溫也邀孟英質之診脈遲澀二便皆行筋掣不眠畏寒能食喉舌皆赤豫大劑清營藥數服而瘥逮夏兩腿患疥外科治之久而不愈孟英謂因其平昔善飲蘊熱深沉瘍科藥亟宜概屏令以雪羹湯送服當歸龍薈丸果得漸瘳陳建周令郎患春溫初起即神氣躁亂驚懼不眠兩脈甚數孟英謂溫邪直入營分也與神犀丹佐紫雪兩劑而瘥夏間吳守旃暨高若舟令郎胡秋紉四令嬡患溫初起即肢瘈妄言神情瞀亂孟英皆用此法尋即霍然孟英曰世人每執汗解之法為初感之治孰知病無定體藥貴得宜無如具眼人稀以致夭枉載道歸諸天數豈盡然哉王皺石廣文令弟患春溫始則譫語發狂連服清解大劑遂昏沉不語肢冷如冰目閉不開遺溺不飲醫皆束手孟英診其脈弦大而緩滑黃膩之苔滿布穢氣直噴投承氣湯加銀花石斛黃芩竹茹元參石菖蒲下膠黑矢甚多而神識稍清略進湯飲次日去芒硝大黃加海虴蘆蔔黃連石膏服二劑而戰解肢和苔退進粥不勞餘力而愈繼有張鏡江邀孟英治葉某又錢希敏之妹丈李某孟英咸一下而瘳惟吳守旃之室暨鄭又僑皆下至十餘次始痊今年時疫盛行醫多失手孟英隨機應變治法無窮救活獨多不勝縷載翁嘉順亦染溫病初發熱即舌赤而渴脈數且澀孟英曰非善證也蓋陰虛有素值此憂勞哀痛之餘五志內燔溫邪外迫不必由衛及氣自氣而營急豫清營繼投涼血病不稍減且家無主藥之人旁議譁然幸其舊工人陳七頗有膽識力懇手援孟英曰我心腸最熱奈病來頗惡治雖合法勢必轉重若初起不先覷破果已殆矣吾若畏難推諉恐他手雖識其證亦無如此大劑車薪杯水何益於事吾且肩勞任怨殫心盡力以圖之病果日重昏瞀耳聾自利紅水目赤妄言孟英惟以晉三犀角地黃湯加銀花石膏知母石解梔子貝母花粉蘭草菖蒲竹瀝竹茹竹葉鳧茈海虴等出入互用至十餘劑舌上忽布穢濁垢苔口氣噴出臭難嚮邇手冷如冰頭面自汗咸謂絶矣孟英曰生機也陰虛而熱邪深入餘一以清營涼衛血之法服已逾旬始得營陰漸振推邪外出乃現此苔惟本元素弱不能戰解故顯肢冷而汗僅於頭面非陽虛欲脫也復豫甘寒頻灌越三日汗收熱退苔化肢溫此病自始迄終犀角共服三兩許未犯一毫相悖之藥且賴陳七恪誠始克起九死於一生繼以滋陰善後而康暑溫王子與病革始延孟英視之曰陰虛之質暑熱膠錮殆誤投補藥矣乃叔少洪云侄素孱弱醫投熟地等藥十餘劑耳孟英曰暑熱證必看邪到血分始可議用生地何初病即進熟地豈僅知稟賦之虛而未睹外來之疾耶昔賢治暑但申表散溫補之戒詎料今人於律外更犯滋膩之辜而一誤致此略無悔悟不啻如油入面如漆投膠將何法以挽回哉越日果卒夫小米舍人僅此一脈完姻未久遽爾珠沉殊為慘然潘紅茶方伯之孫翼廷館於許雙南家酷熱之時啜冷石花湯一碗遂至心下痞悶四肢漸冷上過肘膝脈伏自汗方某謂陽虛陰暑脫陷在即疏大劑薑附丁桂以回陽而雙南在蘇其三郎李書駭難主藥邀族人許芷卿診而決之芷卿雲此藥斷不可投第證極危急須逆孟英商之時已夜半孟英往視曰既受暑熱復為冷飲冰伏胸中大氣不能轉旋是以肢冷脈伏二便不行速取六一散一兩以淡鹽湯攪之澄去滓調下紫雪丹一錢翌日再診脈見胸舒溺行肢熱口乾舌絳暑象畢呈化而為瘧豫多劑白虎湯而愈丙午歲舉於鄉康康侯司馬之夫人久傷謀慮心火外浮面赤齒痛因啖西瓜遂脘悶不舒喜得熱按泄瀉不飢自覺舌厚數寸苔色灰膩孟英與厚朴滑石蔥白薤白枇杷葉橘皮薄荷旋覆省頭草一劑霍然許少卿室故醫陳啓東先生之從女也夏初患感何新之十進清解病不略減因邀診於孟英脈至弦洪豁大右手為尤大渴大汗能食妄言面赤足冷徹夜不瞑孟英曰證雖屬溫而真陰素虧久傷思慮心陽外越內風鴟張幸遇明手未投溫散尚可無恐與龍骨牡蠣犀角珍珠龜板鱉甲貝母竹瀝竹葉辰砂小麥元參丹參生地麥冬為大劑投之外以燒鐵淬醋令吸其氣牡蠣粉撲止其汗搗生附子貼湧泉穴甫服一劑所親薦胡某往視大斥王議為非而主透疹之法病家惑之即煎胡藥進焉病者神氣昏瞀忽見世父啓東扼其喉使藥不能下咽且囑云宜服王先生藥少卿聞之大駭專服王藥漸以向愈而陰不易復頻灌甘柔滋鎮月餘始能起榻季夏汛行惟情志不怡易生驚恐與麥冬參須熟地石英茯神龍眼甘草小麥大棗三甲等藥善其後秋杪歸寧微吸客邪寒熱如瘧孟英投以清解已得向安胡某聞之復於所親處云此證實由夏間治法不善以致邪氣留戀再服清涼必死無疑湯某復從而和之許氏即招湯某診治謂其陽氣傷殘沉寒久伏以理中湯加威靈仙桂枝半夏厚朴薑棗等藥病者頗疑藥太燥烈湯復膏吞拭舌説得天花亂墜病家惑之初服胃氣倍加繼而痰嗽不飢黃苔滿布肌消汛斷內熱汗多心悸不眠臥榻不起病者堅卻其藥然已進二十劑矣再邀何新之商之亦難措手仍囑其求診於孟英按脈弦細軟數篡竄患懸癰縱有神丹不可救藥矣何縉階令正素患肝厥仲夏患感沈樾亭按溫證法治之內風不致陡動而大便泄瀉脈細而弦渴飲痰多不飢不寐因邀孟英商之投白頭翁湯加三甲石斛茯苓竹茹而安隨以峻補善後而痊胡孟紳乃弟季權患黑癍苔穢脈渾氣粗面垢孟英即以涼膈散投之大解得行脘亦不悶癍皆透綻脈顯滑數而洪遂與大劑涼潤清肅之藥直俟其旬日外大解不瀉藥始緩授復又沉臥不醒人皆疑之孟英曰痰熱尚熾也仍授大劑數帖果頻吐膠痰纍日而眠食漸安是役也當兩病披猖之際舉家皇皇他醫或以前證為神不守舍議投溫補後證則以為必敗聞者無不危之賴季權之夫人獨具卓識任賢不二孟英始無掣肘之慮而鹹得收功也濮東明令孫女素稟陰虛時發夜熱少餐不寐仲夏患感發疹汛不當期而至孟英用犀角羚羊角知母貝母石膏生地梔子連翹花粉甘草竹葉蘆根等藥疹透神清唯鼻燥異常吸氣入喉辣痛難忍甚至肢冷復於方中加元參竹茹菊葉荷杆各患始減而心忡吐沫徹夜不瞑渴汗便黑改投西洋參生地麥冬小麥竹葉黃連珍珠百合貝母石斛牡蠣龜版蔗汁諸藥而愈季秋適姚益齋為室仲夏淫雨匝月泛濫為災季夏酷暑如焚人多熱病沈小園者患病于越醫者但知濕甚而不知化熱投以平胃散數帖壯熱昏狂證極危殆返杭日渠居停吳仲莊浼孟英視之脈滑實而數大渴溲赤稀水旁流與石膏大黃數下之而愈仲莊欲施藥濟人托孟英定一善法孟英曰余不敢以師心自用考古惟葉天士甘露消毒丹神犀丹二方為濕溫暑疫最妥之藥一治氣分一治營分規模已具即有兼證尚可通融司天在泉不必拘泥今歲奇荒明年恐有奇疫但甘露二字人必疑為大寒之藥消毒二字世人或作外證之方因易其名曰普濟解疫丹吳君與諸好善之家依方合送救活不知若干人也普濟解疫丹孟英自注云此治濕溫時疫之主方也按六元正紀五運分步每年春分後十三日交二運徵火旺天乃漸溫芒種後十日交二運宮土旺地乃漸濕溫濕蒸騰更加烈日之暑爍石流金人在氣交之中口鼻吸受其氣留而不去乃成溫熱暑疫之病則為發熱倦怠胸悶腹脹肢酸咽腫癍疹身黃頤腫口渴溺赤便祕吐瀉瘧痢淋濁瘡瘍等證但看病人舌苔淡白或厚苔或干黃者是暑濕熱疫之邪尚在氣分悉以此丹治之立效而薄滋味孟英自批家慈每於夏季茹素且云汝輩為醫者當知之余見瘟疫流行之歲無論貧富無可避之總由不知堅壁清野之故耳試看茹素者獨可不染豈非胃中清虛邪不能留乎旨哉斯言特謹識之遠酒色尤為闢疫之仙方智者識之醫家臨證能準此化裁自可十全為上上參喻嘉言張石頑葉天士沈堯封諸家神犀丹孟英自注云溫熱暑疫諸病邪不即解耗液傷營逆傳內陷痙厥昏狂譫語發癍等證但看病人舌色干光或紫絳或圓硬或黑胎皆以此丹救之若初病即覺神情煩躁而舌赤口乾者是溫暑直入營分酷熱之時陰虛之體及新産婦人患此最多急須用此多可挽回切勿拘泥日數誤投別藥以僨事也兼治痘瘄毒重夾帶紫癍危證暨痘瘄之後餘毒內熾口糜咽腐目赤神煩諸證上本葉氏參治驗陳蘊泉陡患昏譫夤夜乞診於孟英脈甚滑數苔色膩黃乃平素多痰兼吸暑熱與清解藥一劑化而為瘧脈亦較平或謂其體弱不宜涼藥須用人參渠家惶惑孟英堅持以為不可蓋暑脈頗類乎虛而痰阻於肺呼吸不調又與氣虛短促者相似平昔先虛有病必先去病況熱能傷氣清暑熱即所以顧元氣也何新之亦贊是議遂連投白虎加減而愈次年春因喪妾悲悼復感溫邪失於肅清病日以甚逮孟英自豫章歸診已不可救藥矣李德昌之母仲夏患感醫診為濕輒與燥劑大便反瀉遂疑高年氣陷改用補土馴至氣逆神昏汗多舌縮已辦後事始乞診於孟英脈洪數無倫右尺更甚與大劑犀角石膏黃芩黃連黃柏知母花粉梔子石斛竹葉蓮心元參生地之藥另以冷雪水調紫雪丹一晝夜舌即出齒而喉舌赤腐咽水甚痛乃去三黃黃連黃柏黃芩加銀花射干豆根並吹以錫類散三日後脈證漸和稀糜漸受改授甘涼緩劑旬日後得解堅黑矢而愈胡紉秋於酷熱時偶有不適醫用柴葛香薷藥散之反惡寒胸痞更醫用枳朴檳榔以瀉之勢日劇延孟英視之自汗不收肢背極冷奄奄一息脈微無神曰稟賦素虧陽氣欲脫此必誤認表證使然豫救逆湯加人參黃耆服之漸安繼以補氣生津調理匝月而痊壬寅夏某感受暑濕誤投溫散以致譫語神昏勢瀕於危而肛前囊後之間潰出腥膿瘡口深大瘍科以為懸癰也敷治罔效孟英診曰懸癰乃損怯症成之以漸今病來迅速腥穢異常是身中久蘊厚味濕熱之毒挾外受之暑邪無所宣泄下注而為此症切勿敷藥以遏其外走之勢但舌強而紫赤脈細而滑數客邪熾盛伏熱蘊隆陰分甚虧深虞津涸先豫清營之劑三投而神氣漸清次以涼潤陽明便暢而熱蠲膿淨改用甘柔滋養月餘潰處肌平善後參入參耆竟得康強如昔金曉耕發熱兩旬醫豫表散竟無汗泄嗣投溫補而大解泄瀉小水不行口乾肌削勢瀕於危胡紉秋薦孟英診之右寸獨見沉數曰暑熱錮於肺經耳豫白虎湯葦莖湯天水散加茯苓桔梗杏仁貝母為方服後頭面㾦疹遍發密無針縫明如水晶光人皆危之孟英曰此肺邪得泄也果肌潤熱退瀉止知飢又服甘涼濡潤二十餘劑㾦疹始愈亦僅見之證也濕溫癸卯春邵秋子令堂年近六旬患寒熱如瘧者久矣諸醫雜治罔效孟英視之曰此濕邪久蘊已從熱化誤投提補動其肝陽痰飲因而上逆與通降之法寒熱即減而包某謂瘧久陰虛理宜滋養病家聞之近是遂進首烏鱉甲等藥漸至脈伏胸痞厄忒自汗渴飲不食顴赤便泄包某束手疏生脈散以塞責舉家倣徨再求孟英診之曰此滋膩阻滯氣機清陽不司旋運痰飲閉滯隧絡非脫象也補藥不可再進以栝蔞薤白半夏湯合小陷胸湯加竹茹旋覆貝母杏仁紫菀枇杷葉投之厄止脈出大有轉機而鄭某謂病固屬痰須溫熱以宣通勿寒涼而凝遏病家又惑焉薑桂頻投既而唇腫咽痛不能進飲舌乾短硬難出語言復請孟英救療豫犀角地黃湯加元參知母銀花竺黃花粉膽星石菖蒲竹瀝之類此第三次生機也奈狂瀾莫障邪説橫行輒以涼藥不宜擅服久病必定元虛甘言悅耳遂至升散溫補各逞所能符咒乩方罔不遍試延至仲夏齶腐齦糜唇高數寸竟成燎原莫救仍懇孟英設法乃堅辭不能措手付局醫黃某敷治腫爛日甚而終季秋顧聽泉邀孟英視康康候副轉之恙切其脈滑數而右歇左促且肝部左關間有雀啄氣口右寸又兼解索望其面宛如熏黃頭汗自出呼吸粗促似不緊續坐臥無須臾之寧便溺澀滯渾赤極臭心下堅硬拒按形若覆碗觀其舌色邊紫苔黃殊不甚乾燥問其所苦曰口渴甜膩不欲飲食苟一閣眼即氣升欲喘煩躁不能自持胸中懊憹莫可言狀孟英曰此由濕熱誤補漫無出路充斥三焦氣機為其阻塞而不流行蔓延日久津液為之凝滯而成痰飲不啻人禽雜處苗莠同疇邪正混為一家醫見肢冷自汗不知病由壅閉而然欲以培正而邪氣方張得補反為樹幟豈非資寇兵而齎盜糧哉非其類者鋤而去之乃為吃緊之治聽泉曰良是也夏間起病聞自心悸少寐楊某以為虛而補之時尚出差辦事暑濕外侵受而不覺逮闈差未竣其病斯發而諸醫之藥總不外乎溫補一途以致愈補愈劇今擬溫膽法待君可否孟英曰脈證多怪皆屬於痰今胸痞如斯略無痰吐蓋由痰能阻氣氣不能運痰耳宜於溫膽湯中加薤白蔞仁通其胸中之陽又合以小陷胸湯此為治飲痞之聖法參以梔豉泄其久郁之熱以除懊憹佐以蘭草滌其陳腐之氣而醒脾胃聽泉深然之連投二劑各恙皆減脈亦略和而病者以為既系實證何妨一瀉而去之連服大黃丸二次承氣湯半帖孟英急止之曰畏虛進補固非欲速妄攻亦謬蓋濕蒸為熱灼液成痰病非一朝一夕而成治以上下分消為是不比熱邪傳腑可一瀉而愈也越日下部果漸腫孟英曰攻痞太速之戒古人不我欺也與聽泉商以前法加黃芩合瀉心湯意再配雪羹投之痰果漸吐痞亦日消而自腹至足以及莖囊腫勢日加孟英謂勢已如此難以遽消但從三消設法則自上而下病必無虞與聽泉商用河間桂芩甘露飲意而姚平泉孝廉力主崇土勝濕之法深以寒涼為不可用衆議仍投前日之藥孟英曰前藥原可服也嫌力不足耳次日痰中帶血甚多孟英曰濕熱熏蒸不已自氣及營矣與聽泉及王子能參軍商以知母黃柏犀角鱉甲白芍苡仁貝母石斛茅根麥冬滑石梔子藕汁童便投之而止越數日又吐且肢冷自汗心餒畏脫姚平泉謂氣不攝血當舉歸脾湯以統之舉家皇皇連請診脈者三次孟英曰脈來屢變陳芝江所以不能指實其病而楊阮諸人皆疑為大虛之候也然望聞問切不可獨憑於指下今溲如赭石湯渾赤有腳其為濕熱之病昭昭若揭初傷於氣分則津液受灼以為痰漸及於營則陰血不安而妄溢邪氣內盛豈非病實而真實類虛吾不受病之欺也堅守前議鎮靜不搖服二劑果止孟英曰血之復吐也由於氣分之邪以擾及之欲清氣道之邪必先去其邪所依附之痰蓋津液既為邪熱灼爍以成痰而痰反即為邪熱之山險也不妨峻攻其實而緩行其勢初進滾痰丸三錢得下泄氣一次副轉云四十日來未有之通暢也連投數日始解膠痰黑矢多遍而小溲亦漸清長苔色亦退寢食遂安惟下部之腫猶爾也馬香崖陸虛舟皆主實脾行水之法孟英曰諦參脈證並不在脾況善飢便燥口渴溺多吾方慮轉消證亟投甘潤之不遑惡可滲利傷陰補土劫液耶且脾虛下陷之腫與濕盛而腫之腫其膝之上下內外形勢必然相貫今膝之上下內外凹凸迥判毫不毗連蓋由濕熱所釀之痰飲既誤補而痞塞中焦復妄攻以流竄隧絡所謂不能一蕩而蠲勢必旁趨四射吾當以法取之會又咳痰帶血而精神食欲如常孟英曰無恐也此乃前次嚼三七太多兜澀留瘀最不宜用吐而去之極妙但須金水同治冀咳止而血絡不震動為要耳與甘露飲加藕汁童溺服之四劑而止咳嗽亦寧於是專治其下部之腫以固本丸加知母黃柏貝母花粉旋覆橘絡絲瓜絡羚羊角楝實蔥須豆卷薏苡竹瀝出入為劑二三帖間其高突腫硬之處即覺甚癢搔之水出如汗而作蔥氣六七日後兩腳反覺乾瘦燥痛莖囊亦隨之而消矣孟英曰此用潤藥消腫尚且干痛咽燥設從他議而投燥脾利水之法更當何如哉蓋寒濕則傷陽熱濕則傷陰血液皆陰也善後之法還宜滋養血液稍佐竹瀝以搜絡中未盡之痰使愈後不為他日之患更屬法中之法服之飲食中節便溺有權幸無消渴之虞而竟愈焉顧宗武偶患微寒發熱醫進溫散法熱雖退而不飢不大便復用平胃散數帖腹漸脹而偏於右尚疑其中氣之虛寒也遂與溫運燥補諸藥脹乃日增杳不進谷或謂恐屬癰瘍因招外科連某診之作脅疽治病如故嚴某謂脅疽部位不對腸癰證據不符作內疝治仿子和活人之法及當歸龍薈丸相間投亦無效乃延孟英視之脈極弦細而促舌絳小渴小溲赤少飲而不食者月餘矣證實脈虛堅持不治其家問曰此證究是何病乞為指示孟英曰據述病人素慎起居而薄滋味顯非停滯與癰疽之患良由暑濕內蘊勢欲外泄是以初起有微寒發熱之候誤與風寒藥熱雖暫退於表邪仍伏處乎中不飢不便肺胃失其下行再加辛燥溫補氣機更形窒滯邪伏永無出路津液潛消䐜脹日甚以氣血流行之臟腑為暑濕割踞之窠巢補之不可攻之不能病雖不在膏肓盧扁望而驚走逾旬徑歿顧竹如孝廉令嬡患感十餘日耳聾不語昏不識人客未入室而彼反先知醫以為祟凡犀角地黃牛黃清心丸復脈等湯遍服無效已拼擋後事矣所親濮根崖囑延診於孟英脈至滑數舌不能伸苔色黃膩遺溺便閉目不交睫者已四晝夜胸腹按之不柔豫白虎湯去粳米甘草加石菖蒲元參犀角鱉甲花粉杏仁竹葉竺黃竹瀝投一劑即譫語滔滔渠父母疑藥不對病孟英曰不語者欲其能語是轉機也再投之大渴而喜極熱之飲渠父母又疑涼藥非宜孟英姑應之曰再服一劑更方可也三投之痰果漸吐四劑後舌伸便下神識漸清乃去菖蒲石膏犀角鱉甲加生地石斛麥冬貝母數帖熱盡退而痰味甚咸又去杏仁貝母竺黃加西洋參牡蠣龜板蓯蓉服之痊愈逾年失怙繼遭祝融火災郁損情懷誤投溫補至戊申年殞邵魚竹給諫患感楊某作瘧治不應始迓孟英診之脈軟汗多熱不甚壯苔色厚膩嘔惡煩躁痰多腿痠顯是濕溫因謂其令郎子旊曰濕溫者濕蘊久而從時令之感以化熱也不可從表治更勿畏虛率補與宣解一劑各恙頗減奈衆楚交咻謂病由心力勞瘁而來況汗多防脫豈可不顧本原群醫附和遂服參歸熟地之藥病日以劇最後吳古年診之云此濕溫也何妄投補劑然已末從挽救交十四日而殞始悔不從王議翁嘉順之婦弟吳某勞傷之後發熱身黃自以為脫力也孟英診脈軟數是濕溫重症故初起即黃亟與清解大便漸溏小便甚赤濕熱已得下行其熱即減因家住毛家埠吝惜輿金遽爾輟藥七八日後復熱譫語耳聾抽痙遺溺再懇孟英視之濕熱之邪擾營矣投元參犀角菖蒲連翹竹茹竹葉銀花石膏以泄衛清營之法佐牛黃丸紫雪丹而瘳臀皮已塌亟令貼羊皮金不致成瘡而愈吳憲章年逾花甲患感醫知其為濕溫也投藥不應而仍能起榻理事石北涯拉孟英視之冀其勿至加劇及診脈左寸數疾余皆軟大穀食略減便溏溲少苔色膩黃舌尖獨黑孟英不肯與方人咸詫之因曰證原不重吾以脈象舌色察之是平昔曲運心機離火內亢坎水不制勢必自焚況兼濕溫之感乎果數日而殞黃純光年七十八歲患濕溫至旬余脈形歇代厄忒連朝諸醫望而畏之孟英診曰脈雖歇而弦搏有根是得乎天者厚雖屬高年猶為實象參以病深聲噦原非小故而二便窒澀苔膩而灰似屬腑氣未宣痰濕熱阻其氣化流行之道也清宣展布尚可圖焉何新之韙其議因與旋復竹茹梔子楝實枇杷葉杏仁吳萸黃連紫菀栝蔞雪羹為劑片通草一兩煎湯煮藥投匕即減數服而大吐膠痰連次更衣遂安粥食唯動則嗽逆漸露下虛之象與西洋參龜板牡蠣蓯蓉石斛牛膝冬蟲夏草紫石英茯苓當歸等藥各恙遞減繼加砂仁炒熟地而起湯西塍年逾花甲感證初起周身膚赤滿口苔黃頭痛腰痛便溏溲痛伊親家何新之診為險候囑延孟英診之脈見弦細而軟乃陰虛勞倦濕溫毒重之證清解之中須寓存陰以犀角羚羊角茯苓竹茹銀花連翹桑枝葦莖通草蘭葉為方煎以冬瓜湯服之遍身赤疹而左眼胞忽腫右臂痠疼不舉耳聾神不清爽亟以元參丹皮菊花梔子桑枝絲瓜絡石斛竹葉煎調神犀丹為劑偶邀瘍科視外患亦知病因濕熱連進木通等藥脈更細弱神益昏憊飲食不進溲澀愈痛新之以為難挽矣孟英曰急救陰液尚可轉機援以復脈湯去薑桂麻仁易西洋參加知母花粉竹葉蔗漿灌之一劑神蘇脈起再服苔退知飢三啜身涼溺暢六帖後膚蛻安眠目開舌潤或疑甘柔滑膩之藥何以能清濕熱孟英曰陰虛內熱之人蘊濕易於化火火能爍液濡布無權頻溉甘涼津回氣達徒知利濕陰氣先亡須脈症參詳法難執一也又服數劑後忽然肢腫遍發風塊瘙癢異常或又疑證之有變也孟英曰此陰津充而餘邪自尋出路也耳與輕清藥數帖果瘥金祿卿室沈裕昆之少女也患溫顧聽泉連進輕清涼解而病不減氣逆無寐咳吐黏痰舌絳咽乾耳聾譫語旬日外始延孟英診焉曰體瘦脈細數尺中更亂竟是陰氣先傷陽氣獨發所謂傷寒偏死下虛人譬之火患將臨既無池井缸貯又空縱竭心力曷能有濟再四研詰乃知發病前一日徒然帶下如崩是真液早經漏泄矣否則藥治未訛胡忽燎原益熾痙厥之變不須旋踵祿卿堅墾勉圖孟英以西洋參生地二冬二至元參犀角黃連雞子黃知母為方另用石斛龜板鱉甲各四兩左牡蠣一斤煮湯代水煎藥顧聽泉又加阿膠且云我儕用此育陰鎮陽充液熄風大劑焉能津枯風動痙厥陡生乎服二劑果不能減後惑旁言而禱簽藥附桂乾薑罔知顧忌徑至四肢拘攣而逝是誤藥速增其斃而增其慘也繼而裕昆患濕溫亦犯重暍而亡重暍謂熱性病的熱氣極盛翁嘉順之妹亦染病病勢極危因役於冥曹自以為不起孟英曰年壯陰充藥治不謬焉能死乎昔人云見理明者陽陰五行不能拘吾當以理勝數遂按法治之病乃日減且慎寒暄節飲食守禁忌調治二旬果然康健又其姑吳翁氏病溫初不服藥七日外始迓孟英診之曰此病邪雖不盛第頻吐涎沫不能出口須以手撩不飲不食不便不眠或多言不倦或久問不答是七情鬱結氣久不舒津液凝痰邪得依附治之中肯尚難即愈不藥而待病從何去遂於清解方中寓蠲痰流氣通胃舒肝之品交十四日而熱退又數日痰沫漸少又旬日大便始行粥食日加而愈此一治法直貫到底不但不犯一分溫燥升補之藥而滋膩入血之品亦皆避之尚須三十劑奏績若病家不篤信醫者不堅持旁人多議論則焉克有濟耶然非乃媳前車之鑑亦未必遽爾任賢不二也楊某患感旬日初則便溏醫豫溫散瀉止熱不退晝夜靜臥飲食不進孟英診脈遲緩浮取甚微目眵舌色光紅口不渴溲亦行胸腹無所苦語懶音低尋即睡去是暑濕內伏而有燥矢在胃機關為之不利也先與清營通胃藥兩劑熱退舌淡而脈症依然加以酒洗大黃省頭草即下堅黑燥矢甚多而睡減啜粥繼以涼潤旬日而痊海鹽任斐庭館於吳琴楚家季夏患感黃某聞其身熱而時有微寒也進以薑萸紫蘇大棗等藥數帖熱愈壯而二便不行更醫連進滲利之劑初服溲略通既而益閉居停以為憂始延孟英視焉證交十四日骨瘦如柴脈弦細而澀舌色光紫滿布白糜夜不成寐渴不多飲粒米不進少腹拒按勢將喘逆此雖屬下證而形脈如斯法難直授先令取大田螺一枚鮮車前草一握大蒜六瓣共抖爛加麝香少許罨敷臍下水分穴方以元參紫菀梔子知母花粉海虴荸薺蓯蓉牛膝天冬為劑加鮮地黃汁服之其夜小溲即行氣平略寐又兩劑大便始下熱退而漸進稀糜乃去雪羹梔子紫菀蓯蓉牛膝地黃汁加西洋參麥冬石斛乾生地竹茹銀花等藥又服十餘帖凡三解黑矢而苔色復於紅潤眠食漸安而起許芷卿患外寒須覆重衾內熱飲不解渴仍能安穀便溺皆行或以為虛寒或以為瘍患投以溫散即顯咽痛孟英脈之沉弦而緩作痰熱內伏投以犀角羚羊角元參丹皮白薇黑梔竹茹貝母旋復牛蒡之劑兩帖而寒渴咽痛皆減乃去犀角羚羊角牛蒡加二至丸知母花粉銀花解醬矢而瘳伏暑壬申八月範蔚然患感旬余諸醫束手乃弟麗門懇孟英治之見其氣促音微厄忒自汗飲水下咽隨即傾吐無餘曰伏暑在肺必由溫散以致劇也蓋肺氣受病治節不行一身之氣皆失其順降之機即水精四布亦賴清肅之權以主之氣既逆而上奔水亦泛而上溢矣但清其肺則諸恙自安乃閲前服諸方始則柴葛羌防以升提之火藉風威吐逆不已猶謂其胃中有寒也改用桂枝乾薑以溫燥之火上添油肺津欲絶自然氣促音微疑其陽虛將脫也徑豫人參當歸蛤蚧柿蒂丁香以補而納之愈補愈逆邪愈不出欲其愈也難矣亟屏前藥以瀉白散合清燥救肺湯數服而平莊半霞芝階中翰之三郎也闈舊稱試院為闈闈後是指參加鄉試之後後患感日作寒熱七八次神氣昏迷微癍隱隱醫者無策始延孟英視之曰此平昔飲酒積熱深蘊挾感而發理從清解必誤投溫補以致熱勢披猖若是詢之果三場皆服人參且攜棗子浸燒酒入闈初病尚不至此因連服羌防薑桂漸以滋甚孟英先豫白虎湯三劑癍化而寒熱漸已繼用大苦寒之藥泄其熱結所下黑矢皆作棗子氣旬日後豫甘潤滋濡之法兩月始得痊愈棲流所司藥陳芝田於仲夏患感諸醫投以溫散延至旬日神昏譫妄肢搐耳聾舌黑唇焦囊縮溺滴胸口隱隱微癍一望而知其危矣轉邀孟英診之脈細數而促曰陰虧熱熾液將涸矣遂用西洋參元參生地二冬知母黃柏楝實石斛白芍甘草梢銀花木通犀角石菖蒲大劑投之次日復診其家人云七八日來小溲不過涓滴昨服藥六七個時辰後解得小溲半杯孟英曰此即轉機也然陰氣枯竭甘涼濡潤不厭其多於前方再加龜板鱉甲百合花粉大鍋煎之頻灌勿歇如是者八日神氣始清諸恙悉退純用滋陰之藥調治匝月而瘳豫謂孟英學識過人熱腸獨具凡遇危險之候從不輕棄最肯出心任怨以圖之如此案八日後神氣始清若經別手縱使治法不錯而一二帖不甚起色必規避堅辭致病家惑亂謀及道旁雖不死於病亦必死於藥矣此在醫者之識老心堅又須病家之善於賢而任之專也談何易耶又聞孟英嘗云溫熱液涸神昏有投犀角地黃等藥至十餘劑始得神清液復者因溫熱案最夥不暇詳録姑識此以告司人之命者姚祿皆在金陵適遇大水繼而回杭途次酷熱患感顧某診為濕邪與桂枝葛根藥三帖病乃劇趙笛樓知其誤治連用清解因見藍癍不肯承手迓孟英視之脈細數而體瘦乃平昔陰虧熱邪藉風藥而披猖營液得溫燥而乾涸癍色既紺危險萬分勉投大劑石膏知母白薇梔子青蒿丹皮竹葉竹瀝童溲之藥調以神犀丹三服大解下如膠漆癍色漸退而昏狂遺溺大渴不已仍與前方調以紫雪數劑熱退神清而言出無倫猶如夢囈或慮其成癲孟英曰痰留包絡也與犀角菖蒲元參鱉甲花粉竹茹黃連生地木通甘草為方調以珍珠牛黃始得漸安改授存陰調理而愈關穎庵患寒熱醫者泥於今歲之司天在泉率投溫燥以致壯熱不休阮某用小柴胡湯和解治遂自汗神昏苔黑舌強肢掣不語唇繭齒焦張某謂癍疹不透擬進皂角刺荊蒡越醫指為格陽假熱欲以附子引火歸元許芷卿診知為伏暑而病家疑便溏不可服涼藥復延孟英診之曰陰虛之體熱邪失清最易劫液幸得溏瀉邪氣尚有出路此正宜乘此一線生機迎而導之切勿遲疑遂與芷卿商投王晉三犀角地黃湯加知母麥冬花粉西洋參元參貝母石斛之類大劑服八九日甫得轉機續豫甘涼充液六七劑忽大汗如雨者一夜人皆疑其虛脫孟英曰此陰氣復而邪氣解也切勿驚惶嗣後果漸安穀投以滋補而愈繼有陳菊人明府乃郎病較輕於此因畏犀角不敢服竟至不救豈不惜哉石誦羲夏杪患感多醫廣藥病勢日增延逾一月始請孟英診焉脈至右寸關滑數上溢左手弦數耳聾口苦熱甚於夜胸次迷悶頻吐黏沫啜飲咽喉阻塞便溏溺赤間有譫語曰此暑熱始終在肺並不傳經一劑白虎湯可愈者何以久延至此也乃尊北涯出前所服方見示孟英一一閲之惟初診顧聽泉用清解肺衛法為不謬耳其餘溫散升提滋陰涼血各有來歷皆弗心思原是好方惜未中病而北涯因其溏瀉見孟英君石膏以為治不敢與服次日復診自陳昨藥未投惟求另施妥法孟英曰我法最妥而君以為未妥者為石膏之性寒耳第藥以對病為妥此病舍此法別無再妥之方若必以模稜迎合為妥恐賢郎之病不妥矣北涯聞而感悟頗有姑且服之之意而病者偶索方一看見首列石膏即曰我胸中但覺一團冷氣湯水且須熱呷此藥安可投乎堅不肯服然素仰孟英手眼越日仍延過診且告之故孟英曰吾於是證正欲發明夫邪在肺經清肅之令不行津液凝滯結成涎沫盤踞胸中升降之機亦窒大氣僅能旁趨而轉旋是一團涎沫之中為氣機所不能流行之地其覺冷也不亦宜乎且余初診時即斷為不傳經之候所以尚有今日而能自覺胸中之冷若傳入心包則舌黑神昏才合吳古年之犀角地黃湯矣然雖不傳經延之逾月熱愈久而液愈涸藥愈亂而病愈深切勿以白虎為不妥急急投之為妙於是方有敢服之心矣而又有人云曾目擊所親某石膏甫下咽而命隨之況月餘之病耳聾泄瀉正氣已虧究宜慎用北涯聞之惶惑仍不敢投乃約翌日廣徵名士會商可否比孟英往診而群賢畢至且見北涯求神拜佛意亂心慌殊可憐憫欲與衆商榷恐轉生掣肘以誤其病遂不遑謙讓援筆立案云病既久延藥無小效主人之方寸亂矣豫三疏白虎而不用今仍赴召診視者欲求其病之愈也夫有是病則有是藥諸君不必各抒高見希原自用之愚古云鼻塞治心耳聾治肺肺移熱於大腸則為腸澼是皆白虎之專司何必拘少陽而疑虛寒哉放膽服之勿再因循致貽伊戚也座中顧聽泉見案即謂北涯曰孟英腸熱膽堅極堪依賴如猶不信我輩別無善法也顧友梅許芷卿趙笛樓亦皆謂是疏方以白虎加西洋參貝母花粉黃芩紫菀杏仁冬瓜仁枇杷葉竹葉竹茹竺黃而一劑甫投咽喉即利三服後各恙皆去糜粥漸安乃改甘潤生津調理而愈豫謂此案不僅治法可傳其闡發病情處識見直超古人之上劉廉方常州名士也在西湖受暑移榻於崔仲遷別駕處醫治垂危莊芝階舍人拉孟英往診之裸體昏狂舌黑大渴溺赤便祕脈數而芤與犀角地黃湯加減服之神識已清略能進粥次日復診頗知問答大有生機仍處甘涼法以贈之並囑伊格外謹慎而越日莊半霞詣孟英偕往診視見其目張睛瞪齒露唇焦氣喘汗出揚手躑足而不可救藥矣衆楚交咻謂是寒涼藥凝閉而然孟英曰病之宜涼宜熱汝輩不知也脈乃皮里之事汝等不見也吾亦不屑為之爭辨惟目瞪唇焦人所共睹則其死於何藥自有定論遂拂衣而出半霞再三請罪孟英曰俗人之見何足介懷是非日後自明於我心無慊焉第斯人斯病皆可惜也既而始知有人主熱藥以僨事豈非命耶僅二載而仲遷病孟英聞之曰殆矣蓋知其陰虛而受暑濕恐主藥者未必能悔悟於前車之鑑也後果聞其廣服溫補之劑以致真陰竭絶而死覆轍相尋迷而不醒可哀也矣姚雪蕉孝廉之太夫人年逾花甲患感兩月醫皆束手始延孟英診之身已不能轉側水飲難於下咽聲音不出便溺不通曰此熱邪逗留不去津液剝削殆盡計其受病之時正當酷暑豈即溫補是投但知其虛而不知其病耶閲前服諸方惟初手顧聽泉從吸受暑邪輕清開上立治為合法耳余方非不是起死回生之藥其如與病無涉何而阮某小柴方服之最多蓋醫者執此和解之法謂不犯汗吐下三者之險豈不穩當病家見其參胡並用謂補正祛邪具一舉兩全之美最為上策孰知和解足少陽傳經傷寒之劑不可以概和各經各氣之各病徒使參胡升提熱邪以上逆至一身之治節無以清肅下行而薑棗溫膩濕濁於中焦致運化之樞機失其灌溉之敷布氣機愈窒津液愈干和解之湯愈進而氣愈不和病愈不解今則雖有良法而咽喉僅容點滴氣結津枯至於此極英雄無用武之地矣雪蕉昆季力懇挽救乃疏甘涼清潤之方囑其不限時刻不計多寡頻以水匙挑入使其漸滲下喉而一日之間僅灌一小杯許其病勢危於此可想直灌至旬余氣機始漸流行藥可服小半劑矣人見轉機之難不無議論旁生賴孟英鎮靜不搖乃得日以向愈粥食漸加惟大解久不行或以為憂孟英曰無恐也水到渠成穀食安而津液充則自解矣若欲速妄攻則久不納穀之胃尚有何物以供其蕩滌哉至九月下旬始有欲解之勢孟英連與補氣益血之藥尚不能下於前方加蜣螂一對熱服即解凡不更衣者計及五十日矣聞者莫不驚異繼以平補善後而痊趙鐵珊乃郎子善康康侯之壻也因事抑鬱凜寒發熱湯某作血虛治進以歸芎丹參之類多劑不效乃移榻康寓延孟英診之脈澀而兼沉弦以數然舌無苔口亦不渴便溺如常納穀稍減惟左脅下及少腹自覺梗塞不舒按之亦無形迹時欲撫摩似乎稍適孟英曰此陰虛挾郁暑邪內伏夫鬱則氣機不宣伏暑無從走泄遽投血藥遂至引之深入血為邪踞更不流行其脅腹不舒乃其真諦也第病雖在血而治宜清氣為先氣得布宣熱象必露瘀滯得行則厥疾始瘳子善因目擊去年婦翁之恙頗極欽服連投清氣之藥熱果漸壯譫妄不眠口乾痰嗽孟英曰脈已轉為弦滑瘀血伏邪皆有欲出之機繼此當用涼藥清瘀為治但旁觀詫異事反掣肘囑邀顧聽泉質之顧亦云然遂同定犀角地黃湯加味而所親陳眉生許小琴暨乃兄子勉皆疑涼藥劑重縱是熱證豈無冰伏之虞顧為之再四開導總不聆解適病者鼻衄大流孟英笑曰真臟獲矣諸公之疑可否冰釋渠舅氏陳穀人鹺尹云證有疑似原難主藥鼻血如是病情已露毋庸再議徑煎而飲之次日衄復至苔色轉黑孟英曰三日不大便瘀熱未能下行也於前方加滑石桃仁木通海虴竹瀝石斛銀花知母花粉之類又二劑大便始行黑如膠漆三日間共下七十餘次而止乃去木通桃仁輩加西洋參麥冬以生液病者疲憊已極沉寐三晝夜人皆危之孟英曰聽之使其陰氣之來復最是好機醒後尚有微熱譫語藥仍前法又旬日始解一次黑燥大便而各恙悉退惟口尚渴與大劑甘涼以濡之又旬日大解甫得復行色始不黑乃用滋陰填補而康孫位中患感症見耳聾醫者泥於少陽小柴胡湯之例聾益甚孟英視之曰伏暑也與傷寒治法何涉改投清肺之藥聾減病安將進善後法矣忽一日耳復聾孟英診之莫測其故因詰食物云昨日曾吃藕粉一碗孟英曰是矣肆間藕粉罕真每以他粉攙混此必不啻誤服小柴胡湯一劑復投肅清肺胃藥尋愈録此以見其審證周詳所謂無微不入也上虞陳茂才患頭痛三日一發發則惡寒多藥不效飲食漸減或擬大劑薑附或議須投金石葛仲信囑其質於孟英察其脈弦重按則滑曰熱暑深入厥陰也溫補皆為戈戟與左金丸加川楝白芍山梔桑葉羚羊角丹皮菊花橘葉為劑兼吞當歸龍薈丸三服而減旬日即瘥顧奏云季秋患感醫作虛治補及旬日舌卷痙厥腰以下不能略動危在須臾所親石誦羲延孟英設死裡求生之策察脈虛促欲絶先灌紫雪一錢隨灌犀角地黃湯兩大劑服下後厥雖止而舌齶滿黑目赤如鳩仍用前湯三日間計服犀角兩許黑苔漸退神識乃清而厄忒頻作人猶疑其虛也孟英曰營熱雖解氣道未肅耳以犀角元參石斛連翹銀花竹茹知母花粉貝母竹葉為方服之次日即下黑膠矢甚多而厄忒止又三劑連解膠黑矢四次舌色始潤略進米飲腿能稍動而臀已磨穿矣豫甘涼育陰藥續解黑矢又五次便溺之色始正投以滋養日漸向安其弟翰云患左胯間腫硬而疼暮熱溺赤舌絳而渴孟英按脈細數徑用西洋參生地麥冬楝實知母花粉銀花連翹甘草黃柏等服旬余而愈許自堂令孫子社患感延至秋杪證交二十八日諸醫束手渠伯母鮑玉士夫人薦孟英診之左部數右手儼若魚翔痰嗽氣促自汗瘛瘲苔色灰厚渴無一息之停垂危若是而皓首之祖孀母少妻相依為命環乞拯救甚可憫也孟英曰據脈莫能下手吾且竭力勉圖第恐一齊衆楚信任不堅則絶無可望之機矣其母長跽而言曰唯君所命雖砒鴆勿疑也於是先以竹葉石膏湯加減至五劑氣平嗽減汗亦漸收苔色轉黑舌尖露絳改投元參生地犀角石膏知母花粉竹葉銀花等藥又五劑瘛瘲漸減舌絳漸退彼婦翁召羽士為之拜斗飛符噀水鼓樂喧闐病者即譫妄不安神昏如醉羽士反為嚇退夤夜速延孟英視之與紫雪錢余神即清爽仍用前方重加竹瀝服八劑始解黑如膠漆之大便而黑苔漸退右脈之至數始清惟煩渴不減令其恣啖北梨舌才不燥痰出亦多又六劑舌色乃淡溲出管痛熱邪得從下行矣凡十二日之間共服大劑寒涼已二十四帖計用犀角三兩有奇而險浪始平續以前法緩制服六劑又解黑矢五次手足始知為已有又五劑筋絡之振惕始定略能側臥囈語乃息漸進稀糜繼灌甘潤充其胃汁七八劑後渴止知飢脈皆和緩又浹旬穀食乃復又旬余便溲之色始正前後共下黑矢四十餘次苔色亦淨授滋填善後而康是役也凡同道暨許之族人戚友莫不以為秋冬之交用藥偏寒況病延已久敗象畢呈苟不即投峻補必致失手既聞鮑夫人云歸許氏二十餘年目擊多人無不死於溫補此等病曾見之此等藥蓋未嘗聞也孰知如此之證有如此之治求之古案亦未前聞傳諸後賢亦難追步蓋學識可造而腸熱膽堅非人力所能及此孟英所以為不世出之良醫也陳邠眉令郎孟秋患感醫與表散溫補病隨藥劇至八月初渠叔祖陳靄山延孟英視之目瞪神呆氣喘時作舌絳不語便瀉稀水肢搐而厥人皆以為必死矣察其脈弦而實數乃陰虧肝盛之質提表助其升逆溫補滯其樞機痰飲轇轕風陽肆橫禱神驅祟有何益哉與鱉甲龍骨牡蠣旋復赭石黃芩黃連楝實貝母葛蒲竹茹膽星犀角羚羊角等藥熄風鎮逆清熱蠲痰數帖即平龔念匏室故舍人汪小米之女也患秋感服溫散藥而日重渠叔母韓宜人請援於孟英脈見弦數軟滑苔黑肢瘈疏方用沙參元參知母花粉犀角羚羊角竹茹貝母梔子菖蒲等藥曰亟餌之否將厥矣時念匏冪於江南族人皆應試入場侍疾者多母黨伊叔少洪疑藥涼不敢豫服逮暮果欲厥矣衆皆皇皇幸彼女兄為故孝廉金訪叔之室頗具卓識急煎孟英方灌之遂得生機次日復診脈較和一路清涼漸以向愈李竹虛令郎初秋患感醫聞便溏而止之乃至目赤譫妄舌絳苔黃溲澀善嘔粒米不能下咽孟英先豫犀角石膏竹葉竹茹枇杷葉茅根知母花粉梔子以清之嘔止神清熱亦漸緩繼以承氣湯加減三下黑矢黃苔始退即能啜粥以右關尺遲緩有力故知有燥矢也續投甘涼調理而瘥許芷卿之太夫人秋間患感連服溫散轉為肢厥便祕面赤冷汗脈來一息一歇舉家惶惶慮即脫變孟英視其舌苔黃膩不渴按其胸悶而不舒且聞其嗅諸食物無不極臭斷為暑濕內伏挾痰阻肺肺主一身之氣氣壅不行法宜開降是虛脫之反面也設投補藥則內閉而外脫昧者猶以為投補遲疑而不及救孰知真實類虛不必以老年懷成見總須以對證為良藥果一劑而脈至不歇轉為弦滑再服汗止肢和便行進粥數帖而痊方用紫菀白前竹茹枳實旋復貝母杏仁栝蔞蔸鈴枇杷葉也姚小蘅太史令侄女初秋患寒熱而汛適至醫用正氣散二帖遂壯熱狂躁目赤譫語甚至欲刎欲縊勢不可制孟英按脈洪滑且數苔色干黃尖絳脘悶腹脹拒按畏明口渴氣逆痰多豫桃仁承氣湯加犀角石膏知母花粉竹瀝甘菊人謂熱雖熾而汛尚行何必大破其血而又加極寒之藥哉孟英曰叟勿過慮恐一二劑尚不足以濟事果服兩大劑始得大便而神清苔化目赤亦退改用甘寒以清之繼而又不更衣即脈滑苔黃而腹脹更與小承氣湯兩帖便行而各恙乃已數日後又如此仍投小承氣湯兩帖凡前後六投下劑才得波浪不興漸以清養而瘳季秋適江右上高令孫明府之子沛堂為室吳醞香孝廉三令嬡患感諸醫首以升散繼進溫補至三月下旬證交三十五日昏痙譫語六晝夜不交睫旬日不沾米飲許芷卿視之儼似養雲室證即拉孟英暨顧聽泉趙笛樓會診脈弦滑而微數齒不能開窺其舌縮苔垢孟英曰舌雖卷舌猶紅潤且二便不祕尚有一線生機未絶也揆其受病原不甚重只因謬治逾月誤藥釀成大證勢雖危險吾儕當竭力援之第勿再犯一味悖藥事或有濟醞香頗極信從孟英復詢其服侍婢媼曰病已逾月腰以下得毋有磨壞之虞乎皆曰無之惟數日前易其所遺略有血漬必月事之不愆也孟英頗疑之囑其再易之時留心細察疏方以犀角四錢石菖蒲兩錢貝母二兩整塊硃砂兩許竹瀝碗許佐以竹葉竺黃知母花粉元參旋覆絲瓜絡葦莖銀花鱉甲調下紫雪丹次日諸君復會渠母徐夫人即云王君明視隔垣小女腰下果已磨穿糜潰如柈婢媼粗忽竟未之知也昨藥服後證亦少減孟英仍主原方四服後夜始眠痙才息舌甫伸苔仍黑孟英於前方去鱉甲硃砂菖蒲加生地梔子數服後苔轉黃大便黑如膠漆且有痰色黏液蓋從前大解黃色似乎無甚大熱不知熱由補藥所釀滯於腸胃曲折之地而不能下行勢必熏蒸於上致有內陷入臟之逆也黑矢下而神氣漸清餘熱復從氣分而達痰嗽不爽右脈滑搏孟英主用竹葉石膏湯加減四劑漸安而外患痛楚徹夜呻吟雖敷以珠黃散滋以甘潤未能向愈孟英令以大蟾蜍治淨煮湯煎育陰充液之藥服之果痛止肌生眠食漸進汛事如期而瘳冬間適張舟甫之子為室或疑其病雖愈而過餌涼藥恐難受孕逮戊申夏已得子矣濮樹堂室病孟英甫為診愈而樹堂繼焉起即四肢厥逆脈伏惡寒發熱頭痛左為甚惟口渴因與蔥豉湯兩帖熱雖退脈仍伏四肢冷過肘膝大解頻行人皆疑為虛寒孟英曰此證儼似陰厥然獨渴飲溲赤真情已露豈可疑於一起即厥而必定其為寒乎徑投涼解熱果復發而肢冷脈伏如故幸病者堅信服藥不疑至第七日大便瀉出紅水溺則管痛嘔惡煩躁徹夜不瞑人更危之孟英曰熱邪既已下行可望轉機以白頭翁湯加銀花通草黃芩白芍竹茹滑石知母石斛山梔楝實羚羊角之類投三日紅水始止四肢漸和頗有昏瞀譫語用王氏犀角地黃湯一劑四肢熱而脈顯滑數苔轉灰黃大渴遺溺病人自述如臥烘箱上於昨方加入元參銀花竹葉生石膏知母貝母山梔石斛服一劑夜間即安寐而苔轉黑燥於昨方復加花粉服一劑熱退而頭面汗多懶言倦寐小溲欲解不通諸戚友咸以為危各舉所知而群醫僉云挽救不及病家皇皇孟英曰此證幸初起即余診視得盡力以為死裡求生之舉非比他人之病皆因誤治致危然不明言其險者恐病家惶惑而築室於道傍也今生機已得不過邪去而真陰未復但當恪守余法自然水到渠成切勿二三其德以致為山虧簣賴有一二知音竟從孟英議服西洋參生地蓯蓉麥冬楝實芍藥知母石斛一劑溺行索粥再服黑苔退三服而神清音朗舌潤津回唯有韌痰不能吐左偏頭痛微於原方加二至丸桑葉菊花貝母牡蠣又服五劑得解硬屎一次各恙始安眠食漸適而瘳孫某患感醫投溫散竟無汗泄延至十一日始請孟英視之業已神昏囊縮面赤舌絳目不識人口不出聲胸膈微癍便瀉而小溲不行者已三日矣醫皆束手或議大投溫補以冀轉機孟英急止之曰陰分素虧溫散劫津而熱邪愈熾則營衛不行豈可妄云漏底欲以溫燥竭其欲絶之陰乎曩浦上林先生治余先君王氏之父親之病云泄瀉為熱邪之出路求之不可得者胡可止也以西洋參生地麥冬丹皮連翹生芍藥石菖蒲鹽水炒黃連甘草稍百合茯苓貝母銀花紫菀為方一劑即周身微汗而癍退三劑始得小溲一杯而識人四劑乃得大汗而身熱退面赤去莖亦舒復解小溲二杯次日於方中減連翹菖蒲丹皮黃連加知母葳蕤竹葉投之舌始潤神始清知渴索水孟英令將蔗藜等榨汁頻灌勿歇其汗如雨下者三晝夜始休於是粥漸進瀉漸止溲漸長前方又去貝母銀花紫菀加石斛龍眼肉服之痊愈朱敦書令正患感吳某與表藥二帖發出赤疹神氣漸昏葉某知其素患耳聾目障為陰虛之體改用犀角地黃湯二劑而遺溺痙厥始延孟英視之曰雖形瘦陰虧邪易擾營幸非濕甚之軀尚可設法但心下拒按厄逆便祕是痰熱尚阻氣分誤服升提每成結胸地黃滋滯實為禁藥今人臨症不能詳審往往用非所當用本年敗證甚多余每見神未全昏便不甚閉惟胸前痞結不可救藥而死者皆升提之誤進或膩滯之早投也石北涯在旁聞之嘆曰無怪乎君素以犀角地黃湯奏奇績而他人效尤則屢僨事豈非能與人規矩不能與人以巧耶於是以犀角元參竹茹貝母旋復栝蔞枇杷葉紫菀白前菖蒲為方調紫雪兩服厄逆止神漸清而咽痛口渴乃去紫雪白前菖蒲加射干山豆根知母花粉吹以錫類散二日咽喉即愈胸次漸舒疹回熱退去犀角紫菀射干豆根加銀花梔子竹葉海虴鳧茈漸安眠食唯大解久不行孟英曰腹無痛苦體虛只宜潤養佐以蓯蓉麻仁當歸生地等藥多服而下遂愈張篪伯紀綱李貴患感數日忽然昏厥比沿途求孟英往視業已薄暮主人謂自朝至此一息奄奄恐不及灌藥矣實不便屈診孟英曰余既來且視之見其面色灰黯戴眼口開按其脈尚不絶與菖蒲膽星竹茹旋覆等為劑和入童溺調以牛黃至寶丹灌之覆杯而起魏翎谷浼孟英視其鬱甥之病熱逾半月自胸次脹及少腹痛不可以撫摩便祕溺赤舌黑口乾自汗煩躁六脈弦強無胃曰此恙酷似傷寒論大結胸症結胸煩躁無藥可治越二日便行而歿孟英曰傷寒之邪在表誤下則邪陷而成結胸未經誤下不為結胸溫熱之邪在裡逆傳於心包誤汗則內閉以外脫若順傳於胃腑誤汗則盤踞而結胸前人但云誤汗劫奪胃汁而未及於結胸者因結胸之症不多見耳然不可不知故謹志之郁某之病初起某醫用葛根湯一劑繼則胡某用柴葛羌防十餘劑釀成是證吳欣山之子素稟虛怯滋補頗投醫不察其患溫發熱僉謂陰虛竟投膩滯培元之劑乃至舌黑卷短唇焦溺赤孟英一診即云不救顧聽泉竭力圖維終不能愈按虛人受感每蹈此轍特録以為戒汪左泉病滯下晝夜數十行而即日須補歲考遺才浼孟英商速愈之策切脈弦滑苔黃滿布曰易事耳重用黃芩黃連佐以山楂厚朴送服青麟丸四錢投匕而痊略無他恙翁嘉順之母染溫病孟英診曰高年陰氣太虧邪氣偏盛玉版論要云溫病虛甚死言人之真陰甚虛曷足以御邪熱而息燎原可虞在兩候之期至十四日果殞秋燥夥人葉殿和庚寅秋患感旬日後汗出昏瞀醫皆束手乃甥余薇恆挽孟英勘之曰此真陰素虧過服升散與仲聖少陰誤發汗同例下竭則上厥豈能引亡陽為比而以附桂速其斃耶以元參地黃知母甘草白芍黃連茯苓小麥龜板鱉甲牡蠣驢皮膠為大劑投之得愈家叔南山於秋間患感日治日劇漸至神昏譫妄肢震動惕施陳兩醫皆謂元虛欲脫議投峻補家慈聞而疑之曰盍與孟英商之孟英診曰無恐也通絡蠲痰可以即愈用石菖蒲羚羊角絲瓜絡冬瓜子苡仁桑枝橘絡旋覆蔥須貝母鉤藤膽星為劑化服萬氏牛黃清心丸一顆覆杯而安調理半月而愈段春木秋杪患發熱而腰痛腿痛如刀割孟英視之略不紅腫脈至細數苔色黑燥溺赤便黑豫西洋參麥冬生地犀角銀花楝實石斛知母甘草竹瀝蔗汁為大劑投之熱漸退痛漸已惟舌絳無津故仍與甘涼濡潤為方數日後忽舌絳倍加燥及咽膈水飲不能下咽孟英曰真陰涸竭藥難奏績矣然竊疑其何以小愈之後驟爾真陰涸竭或者背余而服別藥乎繼其契友來詢云段死而舌出此曷故歟孟英聞之爽然大悟因擷傷寒瘥後女勞復之文示之其人頓足云良然彼於小愈後曾宿於外次日歸即轉劇苟直陳不諱或尚可活乎孟英曰未必然也燒裩散鼠矢湯皆從足少陰以逐邪彼不過熱邪襲入此經所謂陰陽易是也今少腹無絞痛之苦原非他人之病易於我真是女勞之復以致真陰枯涸更將何藥以驟復其真陰哉然而從此女勞復與陰陽易一虛一實有定論不致混同而治矣冬溫毛允之戊午冬患感初治以溫散繼即以滋陰病日以劇延至亥春或疑為百日之勞或謂是傷寒壞證而鳳山僧主升柴耆術以補之丁卯橋用輕粉巴霜以下之雜藥遍投形神日瘁乃尊學周延孟英視之脈來澀數上溢厄忒口膩雖覺嗜飲而水難下膈頻吐涎沫便閉溺赤潮熱往來少腹如烙按之亦不堅滿曰此病原屬冬溫治以表散則津液傷而熱乃熾繼以滋填熱邪愈錮再施溫補氣機更窒用升柴耆術欲升其清而反以助其逆巴霜輕粉欲降其濁而盡劫其陰病及三月發熱不是表邪便祕旬余結澀非關積滯且脈澀為津液之已傷數是熱邪之留著溢乃氣機為熱邪所壅而不得下行豈非溫邪未去得補而膠錮難除徒使其內灼真陰上熏清道以致一身之氣盡失肅清之令法當搜剔餘邪使熱去津存即是培元之道伸其治節俾濁氣下趨乃為宣達之機何必執參茸為補虛指硝黃為通降哉以北沙參紫菀麥冬知母花粉蘭草石斛丹皮黃芩桑葉黃連梔子銀花枇杷葉木通蘆根橘皮竹茹橄欖地栗海蜇等出入為方服之各恙遞減糜粥漸加半月後始得大解而腹熱全消穀食亦安乃豫滋陰善後而愈金寬甫初冬患感局醫黃某聞其向來不拘何病總需溫藥而痊胸懷成見進以薑桂之方漸至足冷麵赤譫語煩躁疑為戴陽而束手矣舉家倣徨延孟英診焉曰此伏邪晚發誤豫升提熱浮於上清解可安寬甫猶以向不服涼藥為疑方中芩連之類堅不肯用乃兄願谷中翰極力開導督人煎而飲之果得霍然周曉滄乃郎品方患冬溫所親顧聽泉知其體屬陰虧病非風寒也不犯一分溫升之品而證不能減勢頗可危乃虛懷轉邀孟英診之曰所治良是也但於方中加貝母杏仁紫菀冬瓜子等味與之遂效可見藥貴對病雖平淡之品亦有奇功孟英嘗云重病有輕取之法於此可見戴氏婦年五十六歲仲冬患感初服楊某歸柴丹參一劑繼服朱某乾薑蒼朮厚朴藥五劑遂崩血一陳謂其熱入血室不可治矣始延孟英診之脈形空軟促數苔黑舌絳足冷而強息微且善笑詢其汛斷逾十載曰冬溫失於清解營血暴脫於下豈可與熱入血室同日而語耶必由誤服熱藥所致因檢所服各方而嘆曰小柴胡湯與冬溫何涉即以傷寒而論亦不能初感即投況以丹參代人參尤為悖謬夫人參補氣丹參行血主治天淵不論風寒暑濕各氣初感皆禁用血藥為其早用反至引邪深入也既引而入再誤於辛熱燥烈之數投焉得不將僅存無幾之血逼迫而使之盡脫於下乎女人以血為主天癸既絶無病者尚不宜有所漏泄況溫邪方熾而陰從下脫可不畏哉病家再四求治孟英豫西洋參生地蓯蓉犀角石斛生白芍銀花知母麥冬甘草蔗漿童溺二劑足溫舌潤得解醬糞脈數漸減而軟益甚乃去犀角加高麗參數帖脈漸和熱退進粥隨以調補幸得向安吳馥齋室人春間娩子不育汛事亦未一行偶患嘔吐發熱眩暈心𩞄大解溏瀉口渴溲痛或疑為娠或疑為損孟英診曰産及一載而經不至腹不脹脈弦緩非娠非損乃血虛痰滯而感冬溫也以羚羊角淡豆豉竹茹白薇梔子枇杷葉知母蔥白花粉投之三劑熱退吐止去蔥豉羚羊加生地甘草橘皮調之而愈張肖江妹暮冬患感朱某進溫散藥數服病日劇比孟英視之目瞪不語面赤氣逆晝夜需人抱坐四日不著枕矣乃冬溫挾痰誤提而氣不肅降也以旋復赭石杏仁貝母花粉茅根冬瓜子紫菀薤白蔞仁蘇子石菖蒲竹瀝為劑蘆蔔湯煎三帖大便行而能臥矣自言胸中迷悶改用小陷胸湯合三子養親湯加沙參知母旋復貝母竹茹枇杷葉數劑熱退知飢而愈項肖卿家擁厚資人極好善年甫三十五歲體甚壯偉微感冬溫門下醫者進以薑桂之劑即覺躁擾更醫迎媚徑用大劑溫補兩帖後發狂莫制又招多醫會診僅以青麟丸數錢服之所親梁楚生宜人聞其危速孟英視之業已決裂不可救藥甚矣服藥之不可不慎也富貴之家可為炯戒本朝乾綱丕振雀頂尚紅冠飾朱纓口燔煙草皆為陽盛之象是以火證偏多夫藥者補偏之物醫為救弊之人豈可不識此大氣運而硜硜然泥夫司天在泉以論治何異癡人説夢焉安徽人程某仲冬患感醫者聞其病前一日曾啖生蘆蔔一枚而大便又溏苔色又白今年又為濕土在泉遂指為中虛寒濕之病參朮附桂多劑率投馴致舌黑神昏尚疑為大虛之候禾中沈柳衣見之知其藥誤另招張鏡江診之曰冬溫也連與犀角地黃湯而無起色二十日外始乞孟英視焉舌縮底絳苔黑如漆口開莖萎脈細數而弦右則按之如無此乃陰液盡灼溫毒深蟠甘露瓊漿不能復其已竭之津矣俄而果敗繼有潘聖徵者於仲冬患感至十四日退熱之後杳不知飢群醫雜治逮季冬下旬轉為滯下五色跗腫裂血溲澀口乾始延孟英診之左脈弦細而數右脈弦滑而空苔色黃膩根焦時或自汗乃氣液兩竭熱毒逗留之象必從前過服溫補之藥否則熱退在十四日之期何至延今五十餘朝而見證若是之棘手哉其弟鴻軒云此番之病補藥不過二三劑惟仲秋患瘧時醫謂其苔白體豐云是寒濕嘗餌桂附數十劑且日飲燒酒耳孟英曰此即釀病之具矣治病且難何況有如許之藥毒內伏更將何法以生之耶堅不立方其家必欲求藥以扶持度歲孟英曰是則可也以白頭翁湯加銀花緑豆歸身白芍陳米蘆莖蘭葉藕肉為劑另以補中益氣湯大料蒸露代水煎藥服後焦苔漸退糞色亦正舉家喜出望外復丐孟英救之奈脈無轉機遂力辭之又有沈聽松母季秋患虐孟英嘗往診之曰伏暑所化且體屬陽強而多痰火切勿畏虛輒從溫補奈病者期於速愈廣徵醫療或以為證屬三陰或謂是子母瘧或指為老年胎瘧衆楚皆咻病不能愈延至冬季亦轉為痢且肌腫臀瘡口糜舌泡諸醫束手復請診於孟英脈與潘聖徵案相同不可藥救矣咳嗽陳足甫稟質素弱上年曾經吐血今夏患感後咳嗽夜熱飲食漸減醫作損治滋陰潛陽久服不效秋杪孟英診之曰陰分誠虛第感後餘熱逗留於肺阻氣機之肅降搏津液以為痰此關不清雖豫滋填培補之藥亦焉能飛渡以行其事耶先清肺氣以保胃津俾治節行而灌溉輸然後以甘潤濃厚之法補實真陰始克有濟如法施之果漸康復孟英治其令叔王丈高年痰嗽喘逆礙臥肢冷顴紅飲食不進與真武湯而安仲冬大雪連朝積厚丈許嚴寒久凍西湖可行車馬斯時也盛少云患痰嗽夜熱自汗不寐左脅痛如針刺肌削不飢自問不起矣請孟英托以後事及診其脈許以可生蓋病來雖惡未經誤藥也與固本丸加龜板鱉甲蓯蓉知母黃柏青黛石斛花粉白芍楝實海石旋覆貝母蛤殼牛膝出入為方大劑投之即效連服四五十帖而痊豫謂斯證患於斯時若經別手未有不投溫補者而少云能與孟英遊其亦具眼之人乎此真所謂患難交不可不留心於平日然亦不能人人而遇之殆佛氏所謂有緣存乎其間歟石誦羲室久患痰嗽諸醫藥之勿瘳孟英切其脈曰非傷風也與北沙參熟地百合麥冬貝母紫菀蓯蓉枇杷葉鹽水炒橘皮燕窩一劑知數劑已初秋又患脘痛上及肩尖向以為肝氣輒服破削之品孟英曰亦非也以砂仁炒熟地炙橘紅楝實延胡枸杞當歸茯苓桑椹蒺藜為方服之良效繼即受孕矣初冬邵可亭患痰嗽面浮微喘醫謂年逾花甲總屬下部虛寒進溫補納氣之藥喘嗽日甚口涎自流莖囊漸腫兩腿腫硬至踵頭仰則咳嗆咽疼不能略臥痰色黃濃帶血小溲微黃而長許芷卿薦孟英視之脈形弦滑有力曰此高年孤陽熾於內時令燥火搏其外外病或可圖治真陰未必能復且平昔便如羊矢津液素干再投溫補如火益熱矣乃以白虎湯合瀉白散加花粉西洋參貝母黃芩大劑投之並用北梨抖汁頻飲潤喉以緩其上僭之火數帖後勢漸減改投葦莖湯合清燥救肺湯加海蜇蛤殼青黛荸薺竹瀝旬日外梨已用及百斤而喘始息繼加龜板鱉甲犀角以豬肉煮湯代水煎藥大滋其陰而潛其陽火始下行小溲赤如蘇木汁而諸證悉平下部之腫隨病遞減一月以來共用梨二百餘斤適大雪祁寒更衣時略感冷風腹中微痛自啜薑糖湯兩碗而喘嗽復作口乾咽痛大渴舌破仍不能眠復用前方以緑豆煎清湯代水煮藥始漸向安孟英謂其郎步梅曰內經云陰津所奉其人壽今尊翁陰液久虧陽氣獨治病雖去矣陰津非藥石所能繼續況年逾六秩長不勝消治病已竭人謀引年且希天眷豫以脈察之終屬可虞毋謂治法不周贈言不早致有他日之疑成敗之論也葉晝三患咳逆上氣頭偏左痛口渴不飢便泄如水王瘦石薦孟英視之曰此肝陰胃汁交虛時令燥邪外薄與育陰熄風清燥滋液之法日以漸安服及二月大便反形乾結而痊王開榮素患痰嗽兼有紅證今冬病頭痛發熱渴飲不飢便溏溺少譫語神昏自述胸中冷氣上衝醫見其面赤痰喘欲投附桂黑錫丹等藥所親翁嘉順囑勿輕服為延孟英診之脈滑且數曰溫邪挾宿飲上逆法當清解豫北沙參冬瓜子知母滑石花粉石菖蒲貝母杏仁蘆根蔥白淡豆豉竹瀝兩劑後面赤退乃去蔥豉加麥冬桑葉枇杷葉數帖熱去瀉減譫語止頭痛息喘定神清乃裁去菖蒲滑石加梨汁地栗海蜇服數日痰漸少谷漸安渴止溺行始進養陰之法遂以霍然孫渭川年逾七旬脈象六陰按之如無偶患音嘶痰嗽舌絳無津孟英用甘涼清潤法音開而嗽不已仍與前藥轉為滯下色醬溺赤臍旁堅硬按之躍躍舌猶枯絳渴飲不飢人皆危之孟英曰腸熱由腑而出痢不足慮第高年陰液難充不能捨涼潤以為方苟犯溫燥其敗可必幸渠家平素恪信竟服犀角地黃知母銀花蓯蓉花粉麥冬白芍石斛楝實等藥十餘劑痢止而臍旁柔軟因去犀角加西洋參又兩旬始解燥矢而溲徹胃蘇又服半月復得暢解舌亦潤澤而愈張與之令堂久患痰嗽礙臥素不投補藥孟英偶持其脈曰非補不可與大劑熟地藥一飲而睡與之曰吾母有十七載不能服熟地矣君何所見而重用頗投孟英曰脈細痰咸陰虛水泛非此不為功以前服之增病者想必雜以參術之助氣昔人云勿執一藥以論方故處方者貴於用藥能恰當病情而取捨得宜也許守存久患痰嗽孟英主滋水舒肝法以陰虧而兼郁也業已向愈所親某亦涉獵醫書謂滋陰藥不可過服投以溫補已而咳嗽復作漸至咽痛冬初又延診於孟英曰六脈皆數見於水令其不能春乎果驗世人不辨證之陰陽但論藥之涼熱因而僨事者多矣王澮涵室年逾六旬久患痰嗽食減形消夜不能眠寢汗舌絳廣服補劑病日以增孟英視之曰固虛證之當補者想系未分經辨證而囫圇顢頇翻與證悖是以無功投以熟地蓯蓉龜板胡桃百合紫石英茯苓冬蟲夏草等藥一劑知旬日愈以其左脈弦細而虛右尺寸皆數為陰虧氣不潛納之候及閲前服方果雜用耆術以助氣二陳湯故紙附子肉桂等以劫陰宜乎愈補而愈劇也畢方來室患痰嗽礙眠醫豫補攝至涕淚全無耳目閉不飢二便澀滯干嗽咳無痰氣逆自汗孟英切脈右寸沉滑左手細數而弦乃高年陰虧溫邪在肺未經清化率為補藥所錮宜開其痹而通其胃與栝蔞薤白紫菀蔸鈴杏仁貝母冬瓜子甘草桔梗旋復竹茹之劑而安逾二年以他疾終趙春山司馬向患痰嗽自仲秋以來屢發寒熱吳古年從伏暑化瘧治頗為應手而一旬半月之後病必復至延至季冬董蘭癡鹺尹囑其質於孟英按脈滑數舌絳苔黃渴飲溲赤動則喘逆夜不成眠痰多畏冷自問不起矣孟英曰無恐也不過膏粱釀痰溫補助熱是為病根逮夏吸受暑邪互相轇轕秋半而發勢頗類瘧古年雖識其證惜手段小耳因豫羚羊角豆豉連翹薄荷知母花粉竹茹貝母旋覆海虴元參梔子省頭草梨汁等藥服五劑熱退不畏冷去前四味加沙參麥冬葳蕤枇杷葉漸能安寐各恙遞減再加生地服匝月而體健勝昔登高不喘司馬雲余昔曾服參茸大補之藥而陽痿今服君方而沉疴頓起乃知藥貴對證不貴補也吳薇客太史令堂患痰嗽喘逆便祕不眠微熱不飢口乾畏熱年逾六旬多藥勿痊孟英切其脈右寸關弦滑而浮左關尺細軟無神是陰虛於下痰實於上微兼客熱也攻補皆難偏任與竹茹貝母旋復石斛海浮石蘆根冬瓜子枇杷葉杏仁花粉為劑以熟地泡湯煎服則濁藥輕投清上滋下是一舉兩全之策也投匕果應再服而大便行漸次調養獲痊謝譜香素屬陰虧情志抑鬱因遠行持重而患咳逆左脅刺痛寸步難行杳不知飢臥難著枕孟英診之脈象弦細軟數苔膩痰黏便艱溲少曰此乃腎氣不納肝氣不舒肺氣不清胃氣不降投以沙參枇杷葉竹茹貝母旋復梔子龜板鱉甲絲瓜絡冬瓜子青鉛白前金鈴藕肉以熟地泡湯煎服數劑而平繼漸滋填向愈謝某患嗽臥難偏左孟英切其脈右寸軟滑曰此肺虛而痰貯於絡以葦莖絲瓜絡生蛤粉貝母冬瓜子茯苓葳蕤枇杷葉燕窩梨肉投之果愈屠敬思體氣素弱去冬因子殤於痘醫豫舒郁填陰病日以劇僉云不治乃延孟英診之兩關甚數寸上洪滑嗽逆痰多臥不著枕溺赤便難極其畏冷是冬溫未罷誤補熱鬱之候世間之死於勞損者何嘗盡是虛證每以補藥僨事授以廓清肺胃之藥周身發疥各恙漸安蘊伏既清始投滋養善後不僅病愈次年春更得一子董哲卿二尹令正胎前患嗽娩後不痊漸至寢汗減餐頭痛口燥奄奄而臥略難坐起孟英診脈虛弦軟數視舌光赤無苔曰此病之頭痛口燥乃陽升無液使然豈可從外感治是沖氣上逆之嗽初非傷風之症也與蓯蓉石英龜板茯苓冬蟲夏草牡蠣穭豆衣甘草小麥紅棗藕肉數帖餐加頭痛不作加以熟地服之遂愈錢聞遠自春間偶患痰嗽醫投蘇葛而失音更醫大劑滋補漸至飲水則嗆久延愈劇邀孟英診之曰左寸動數尺細關弦右則澀乃心陽過擾而暗耗營陰肺金受灼清肅不行水失化源根無蔭庇左升太過右降無權氣之經度既乖血之絡隧亦痹飲水則嗆是其據也金遇火伏其可慮乎繼而瘀血果吐納食稍舒老醫嚴少眉以為可治竭力圖維仍殞於伏陳某患嗽嗽則先吐稀痰次吐黃濃甜濁之痰繼以深紅帶紫之血仍能安穀別無所苦多藥不愈孟英切其脈緩大而右關較甚乃勞倦傷陽而兼濕熱蘊積也與沙參生薏苡木瓜茯苓杏仁竹茹桑葉枇杷葉生扁豆葦莖花粉為劑吞松石豬肚丸而愈謝普香體屬久虛初冬患嗽痰減食適孟英丁艱邀施某視之云是腎氣不納命火無權疊進腎氣湯月餘遂至嘔惡便溏不飢無溺乃束手以為必敗矣季冬乃延孟英診之脈甚弦軟苔膩舌紅乃中虛而健運失職誤投滋膩更滯樞機桂附之剛徒增肝橫與黨參白朮茯苓澤瀉橘皮半夏竹茹梔子薏苡蒺藜蘭葉柿蒂之劑培中泄木行水蠲痰旬日而愈鄭嫗患咳嗽自覺痰從腰下而起吐出甚冷醫作腎虛水泛治漸至咽喉阻塞飲食礙進即勉強咽之而胸次梗不能下便溏溲頻無一人不從虛論孟英診曰脈雖不甚有力右部微有弦滑苔色黃膩豈屬虛證以葦莖湯合雪羹加貝母知母花粉竹茹麥冬枇杷葉柿蒂等藥進十餘劑而痊喘證張氏婦患氣機不舒似喘非喘似逆非逆似太息非太息似虛促非虛促似短非短似悶非悶面赤眩暈不飢不臥補虛清火行氣消痰服之不應孟英診之曰小恙耳旬日可安但必須懲忿是囑豫黃連黃芩梔子楝實鱉甲羚羊角旋覆赭石海蜇地栗為大劑送服當歸龍薈丸未及十日汛至其色如墨其病已若失後豫養血和肝調理而康鄰人王氏婦之父王叟仲秋患痰嗽不食氣喘不臥囊縮便祕心搖搖不能把握勢極可危伊女浼家慈招孟英救之曰根蒂欲脫耳非病也以八味地黃湯去丹皮澤瀉合生脈散加青鉛龍骨牡蠣紫石英胡桃楝實蓯蓉為劑投之大解行而諸恙減乃減去蓯蓉麥冬服旬日而瘳邵奕堂室以花甲之年仲冬患喘嗽藥之罔效坐而不能臥者旬日矣乞診於孟英邵述病源云每進參湯則喘稍定雖服補劑仍易汗出慮其欲脫及察脈弦滑右甚孟英曰甚矣望聞問切之難不可胸無權衡也此證當憑脈設治參湯切勿沾唇以栝蔞薤白旋覆蘇子花粉杏仁蛤殼茯苓青黛海蜇為方而以竹瀝萊蔔汁和服投匕即減十餘帖痊愈同時有石媼者患此病極相似脈見虛弦細滑孟英豫沙參蛤殼旋覆杏仁蘇子貝母桂枝茯苓等藥之中重加熟地而瘳所謂病同體異難執成方也張孟皋少府令堂年逾古稀患氣逆殿屎煩躁不寐孟英切脈滑實且便祕面赤舌絳痰多以承氣湯下之霍然逾年以他疾終王致青鹺尹令正患痰喘胡某進補腎納氣及二陳湯三子養親湯諸方證瀕於危顧升庵參軍令延孟英診之脈沉而澀體冷自汗宛似虛脫之證惟二便不通脘悶苔膩是痰熱為補藥所遏一身之氣機窒痹而不行也豫栝蔞薤白旋復赭石杏仁貝母梔子紫菀兜鈴海虴竹瀝等以開降覆杯即減再服而安王小谷體厚善飲偶患氣逆多醫咸從虛治漸至一身盡腫酷肖回春録所載康康康候副轉運之證因懇治於孟英脈甚細數舌絳無津聞間有譫語乃真陰欲匱外證雖較輕於康然不能收績矣再四求疏方與西洋參元參二地二冬知母花粉竹茹貝母竹瀝蔥須等藥三劑而囊腫全消舉家欣幸孟英以脈象依然堅辭不肯承手尋果不起吳蘊香大令宰金溪自仲春感冒而起逮夏徂秋痰多氣逆肌肉消瘦延至初冬諸證蜂起耳鳴腰痛臥即火升夢必干戈凜寒善怒多醫咸主補虛迄無小效臥理南陽已將半載群公子計無所施飛函至家囑大公子汾伯副車叩求孟英來署已仲冬之杪日矣診脈弦細而左寸與右尺甚數右寸關急搏不調且病者頸垂不仰氣促難言舌黯無苔面黧不渴孟英曰病雖起於勞傷挾感而延已經年然溯其所自平昔善飲三十年來期在必醉非僅外來之客邪失於清解殆由內伏之積熱久錮深沉溫補雜投互相煽動營津受灼內削痰多升降愆常火浮足冷病機錯雜求愈殊難既承千里相招姑且按經設法以石膏知母黃芩等清肺滌痰青蒿鱉甲梔子金鈴等柔肝泄熱元參女貞天冬黃柏等壯水制火竹茹旋覆枇杷葉橘紅等宣中降氣出入為方間佐龍薈丸直泄膽經之酒毒紫雪丹搜逐隧絡之留邪服三劑而舌布黃苔蘊熱漸泄服六劑而嗽減知飢渴喜熱飲伏痰漸化季冬八日即能出堂訊案十劑後凜寒始罷足亦漸溫肺氣果得下降望日出署行香繼而兵火之夢漸清夜亦能眠迎春東郊審決積案亦不覺其勞矣方中參以西洋參生地麥冬充其液銀花緑豆雪羹化其積至庚戌歲朝各處賀年午後護日極其裕如且肌肉漸豐面黑亦退藥之對病如是之神調養至開篆時起居如舊各恙皆瘥而孟英將赴宜黃楊明府之招醞香為録其逐日方案跋而記之茲特採其大略如此鮑繼仲於季春望日忽然發冷而喘汗欲厥速孟英視之脈沉弦而軟滑帶數是素患痰飲必誤服溫補所致也家人始述去冬服胡某腎氣湯頗若相安至今久不吐痰矣孟英曰病在肺肺氣展布痰始能行雖屬久病與少陰水泛迥殊辨證不明何可妄治初服頗若相安者方中附桂剛猛直往無前痰亦不得不為之辟易又得地黃等厚濁下趨之品回護其跋扈跳梁之性然暴戾之氣久而必露柔膩之質反阻樞機治節不伸二便澀少痰無出路愈伏愈多一朝卒發遂壅塞於清陽升降之路是以危險如斯須知與少陰虛喘判分霄壤切勿畏虛妄補投以薤白栝蔞枳實杏仁旋復赭石半夏紫菀竹茹蘆根蛤粉雪羹之劑而平繼與肅清肺氣而滌留痰匝月始愈潘肯堂室仲冬陡患氣喘醫治日劇何新之診其脈無常候囑請孟英質焉孟英診曰兩氣口之脈皆肺經所主今肺為痰壅氣不流行虛促雖形未必即為虛諦況年甫三旬平昔善飯病起於暴苔膩痰濃縱有足冷麵紅不飢不寐自汗等症無非痰阻樞機有升無降耳遂與石膏黃芩知母花粉旋覆赭石蔞仁通草海蜇竹瀝蘆蔔汁梨汁等藥一劑知二劑平乃去二石石膏赭石加元參杏仁服旬日而安俟其痰嗽全蠲始用沙參地黃麥冬等以滋陰善後余朗齋令堂秋間患伏暑孟英已為治愈失於調理復患氣衝喘自汗肢冷少餐攻補不投仍邀孟英治之與填補衝任清滌伏痰法合甘草小麥大棗以補血而愈哮證孫渭川令侄亦患哮氣逆欲死孟英視之口渴頭汗二便不行徑豫生石膏橘皮貝母桂枝茯苓知母花粉杏仁紫菀海蜇等藥服之而愈耳姓婦回族患哮自以為寒頻飲燒酒不但病加更兼嘔吐泄瀉兩腳筋掣既不能臥又不能坐孟英診曰口苦而渴乎泄瀉出如火乎小溲不行乎痰黏且韌乎病者曰誠如君言想為寒邪太重使然孟英曰汝何愚耶見證如是猶謂受寒設遇他醫必然承教況當此小寒之候而哮喘與霍亂世俗無不硬指為寒者誤投薑附汝命休矣豫北沙參生苡仁冬瓜子絲瓜絡竹茹石斛枇杷葉貝母知母梔子蘆根青果海蜇萊蔔汁為方一劑知二劑已鮑繼仲患哮每發於冬醫作虛寒治更劇孟英診之脈滑苔厚溺赤痰濃豫知母花粉冬瓜子杏仁貝母茯苓滑石梔子石斛服之而安痰證蕭某素患痰多常服六君子湯偶延孟英診之脈細數而兼弦滑曰六君子湯亟當屏絶病由陰虧火盛津液受灼而成痰須服壯水之劑庶可杜患將來蕭因向吸鴉片煙自疑虛寒滋陰不敢頻服繼患喉痛專科治而不效仍乞診於孟英因謂曰早從吾策奚至是耶此陰虛於下陽浮於上喉科藥不可試也大劑育陰潛陽其痛日瘥而喉齶皆形白腐孟英曰吸煙既久毒氣熏蒸之故耳令吹錫類散始得漸退愈後復患滯下孟英曰今秋痢雖盛行而此獨異於人切勿以痢疾套藥治之蓋火迫津液結為痰飲釀以煙毒熏成喉患吾以燃犀之照而投激濁揚清之治病雖愈矣內蘊之痰濁尚多奈向來為溫補藥所禁錮於腸胃曲折之間而不得出今廣投壯水之劑不啻掘江河而滌陳莝豈可與時疫暑熱之痢同年而語耶治不易法食不減餐日數十行精神反加佳逾月之後大解始正計服甘涼約藥二百劑肌肉復充痰患若失定州楊素園明府宰宜黃吏治有聲精於醫學其夫人多病自治不痊毗陵吳子和囑其函懇醞香屈孟英診視而孟英因母老急欲旋里堅辭不往即據來信所述病狀擬方立案云細閲病原證延二十餘年始因啖杏生冷傷乎胃陽肝木乘虛遂患脅痛攣掣身軀素厚濕盛為痰溫藥相投是其效也馴致積溫成熱反助風陽消爍胃津漸形瘦削而痰飲者本水穀之悍氣緣肝升太過胃降無權另闢窠囊據為山險初則氣滯以停飲繼則飲蟠而氣阻氣既阻痹血亦愆其行度積以為瘀前此神術丸控涎丹之滌飲丹參飲桃核承氣湯之逐血皆為傑構已無遁情逮延久元虛即其氣滯而實者亦將轉為散漫而無把握矣是以氣升火浮顴紅面腫氣降火熄黃瘦日增苟情志不怡病必陡發以肝為剛臟在志為怒血不濡養性愈侜張胃土屬陽宜通宜降通則不痛蓋六腑以通為用更衣得暢體覺寬舒是其徵也體已虛病似實虛則虛於胃之液實則實於肝之陽中虛原欲納食而肝逆蛔擾欲嘔吐出之水已見黑色似屬胃底之濁陰風鼓波瀾翻空向上勢難再攻承示脈至兩關中取似形鼓指重按杳然詎為細故際此春令正鳶飛魚躍之時仰屋圖維參徹土綢繆之議是否有當仰就斤繩沙參八錢鮮竹茹四錢川椒紅二分烏梅肉炭六分茯苓三錢旋覆三錢金鈴肉二錢柿蒂十個仙半夏一錢淡肉蓯蓉錢半吳茱萸炒黃連四分冬蟲夏草錢半另用炙龜板藕肉各四兩漂淡陳海蜇二兩鳧茈一兩赭石四錢先煮清湯代水煎藥正月十四日一診上擬方案來差星夜齎回於十六日到宜黃縣素園讀案狂喜以為洞見臟腑必欲孟英一診以冀霍然遂夤夜備輿專丁持函求孟英暫緩歸期醞香因篤於情誼亦再四勸駕並囑四令郎偕行孟英迫於情不可卻二十二日抵宜黃縣署初診案云證窬二十年右脅積氣有升無降飲阻不宣嘔逆減餐亦將半載二便非攻不暢容色改換不常口苦吞酸苔黃舌絳渴喜冷飲畏食甘甜以甘能緩中冷堪沃熱病機於此逗根根深難即蠲除標實本虛求痊匪易據述脈亦屢遷似無定象夫既流善幻顯屬於痰茲按脈左緩滑右軟遲兩尺有根不甚弦澀是汛愆因乎氣阻尚未至陰血之枯春令肝木乘權胃土久受戕克病已入絡法貴緩通通則不痛腑以通為補法難時變不能捨通字以圖功布鼓雷門諸希教正沙參八錢鮮竹茹四錢青黛五分旋覆三錢酒炒黃連六分白前一錢生白蒺藜三錢紫菀一錢海石五錢川楝肉三錢川貝一兩黑梔三錢另以生蛤粉生冬瓜子蘆根蘆蔔各一兩絲瓜絡五錢漂海蟄二兩柿蒂十個先煮水代湯煎藥蔥須二分後下再診左脈如昨兼弦右寸亦轉緩滑中脘氣漸下降二便欲解不行蓋升降愆常樞機窒澀由乎風陽浮動治節橫斜肺既不主肅清則一身之氣皆滯也輕可去實先廓上遊前方去海石加栝蔞三錢枳實一錢三診脈來較靜小溲漸行雖未更衣已能安穀濁得下行導以清通前方去貝母楝肉加歸尾錢半桃仁十粒送服導水丸十粒四診腿涼便滯氣少下趨顴面時紅火炎上僭兩脅較熱絡聚痰瘀疊授清宣更衣色黑噫氣漸罷酸水不吐納穀頗增脈稍和緩法仍緩導冀刈根株前方去枳實歸尾減導水丸五粒五診各恙皆減眠食漸安火猶易升頭痛面赤頰頸酸結核脅熱未蠲脈漸柔和且參清養前方去白前青黛紫菀黃連加銀花貝母黃菊花丹參陳細茶橄欖六診積痰下降頸核漸平舌紫口乾卯辰熱僭陰虛木旺氣道尚未肅清養血靖風自可使其向愈前方去陳細茶蔥須加石斛留贈善後方便色轉正後用此沙參八錢冬蟲夏草二錢女貞三錢丹參三錢鮮竹茹四錢川斛五錢鹽水泡橘紅八分黃菊三錢旋覆三錢黑梔仁三錢川貝四錢金鈴肉錢半另以炙鱉甲漂海蟄各一兩葦根二兩絲瓜絡五錢煮湯代水煎藥又諸恙盡瘳用此滋養前方去橘紅菊花金鈴子梔子旋覆加石英沙蒺藜茯苓各三錢蓯蓉當歸各錢半湯引去葦根加炙坎版一兩藕二兩古云肥白之人多氣虛又云痰飲須以溫藥和之儒醫顧聽泉體豐色白平昔多痰晨起必喘逆飽食稍安頗有氣虛之象季冬感冒自服疏解未效迓孟英診焉左關弦寸滑如珠尺細而干舌尖甚絳乃真陰素虧水不涵木風陽內熾搏液成痰謀慮操持心陽太擾肺金受爍治節不伸苔雖白而已干熱雖微而睛赤忌投溫燥宜與輕清用元參石斛梔子竹茹旋覆蛤殼貝母枇杷葉竹葉蘭葉蓮心為劑三啜而安自謂氣虛遽服黨參枸杞當歸等藥下咽之後即覺火升氣逆漸至言語支離溲頻自汗夤夜復迎孟英診治脈已虛促不調即投牡蠣龜板鱉甲女貞旱蓮元參甘草小麥竹葉蓮心以和心肝之陽而鎮龍雷之奮一劑而平繼又作勞復感仍授輕清之法兩劑後又因怫怒縈思肝陽復僭顴紅目赤左耳時聾夜不成眠神情煩躁越日陡然大汗濕透衣襟再速孟英圖之脈極弦數而細仍為陰虛陽越不可誤認陽虛而妄施桂附先令熏以醋炭撲以蠣粉隨灌以大劑二至丸二冬三甲元參丹參人參黃連童溲而瘳繼與多劑育陰清肝始得痊愈附録偶然事耳如前年五月間偶診顧聽泉明經之脈即謂家篪伯茂才云顧君不可以冬蓋死象已見也後竟歿於立冬之時朱大鏞令大父患四肢冷顫常服溫補延久不痊孟英切其脈弦而緩曰非虛也與通絡方吞服指迷茯苓丸而瘥金葉仙大令病其媳刲股以進因固無效也悲哀欲絶遂發熱胡某治以傷寒藥而神迷自汗驚惕畏冷改換補藥乃氣逆不進水穀矣孟英視之是七情有傷痰因火迫堵諸空靈之所也豫沙參元參丹參丹皮茯苓麥冬連翹竹茹竹葉蓮心小麥加以川貝母一兩投之數劑而瘥血證範慶簪年逾五十素患痰嗽乙酉秋在婺地名驟然吐血勢頗可危孟英診曰氣虛而血無統攝也雖向來咳嗽陰虧陰藥切不可服然非格陽吐血桂附更為禁劑乃以潞黨參炙黃耆白術茯苓甘草山藥扁豆橘皮木瓜酒炒白芍藥為方五帖而安繼去甘草木瓜加熟地黃黑驢皮膠紫石英麥冬五味子龍骨牡蠣熬膏服之痊愈亦不復發後範旋里數年以他疾終歙人吳永言於十年前讀論語不撤薑食之文因日服之雖盛夏不輟至三年前患大溢血雖以涼藥治瘳而時時火升迄今不愈季冬就診於孟英身不衣錦頭面之汗蓬蓬也且云服芩連則煩渴益甚以苦能化燥也用生地即悶滯不飢以甘能緩中也蔗梨入口亦然按其脈沉取滑數是從前之積熱深伏於內豫白虎湯去甘草粳米加竹葉竹茹花粉海蜇荸薺銀花緑豆恣服漸吐膠痰而愈丁未春金朗然令堂陡吐狂血肢冷自汗孟英切脈弦澀察血紫黯乃肝鬱凝瘀也證雖可愈復發難瘳豫丹參丹皮茺蔚旋覆茯苓梔子柏葉鬱金海虴之方覆杯果愈然不能懲忿逾兩年復吐竟不起王子能參軍令正久患吐血醫不能愈延孟英視之脈弦滑而搏指右手較甚渴喜冷飲米穀礙於下咽小溲如沸夜不成眠久服滋陰毫無寸效孟英以葦莖湯合雪羹加石膏知母花粉枇杷葉竹茹旋覆滑石梨汁大劑投之三十劑而痊繼而參軍旋省患久積憂勞真陰欲匱竟難救藥尋果仙遊鄭某吐血盈碗孟英脈之右關洪滑自汗口渴稍一動搖血即上溢人皆慮其脫意欲補之孟英曰如脫唯我是問與白虎湯加西洋參大黃炭一劑霍然鎖某弱冠吐血楊醫連進歸脾湯吐益甚孟英視之面有紅光脈形豁大因問曰足冷乎探之果然遂與六味地黃湯送飯丸肉桂心一錢覆杯而愈邵子受令閫患吐血肌膚枯澀口渴脈虛大孟英曰氣分之陰虧也溫補既非滋填亦謬以西洋參黃耆二冬知母百合玉竹石斛桑葉枇杷葉投之而愈孫執中春前四日忽然鼻衄如注諸法莫塞夤夜請孟英視之脈弦而數曰冬暖氣泄天令不主閉藏今晚雷聲大震人身應之肝陽乃動血亦隨而上溢不可以其體肥頭汗畏虛脫而進溫補也投以元參生地犀角牡蠣知母生白芍牛膝茯苓側柏葉童溺諸藥一劑知二劑已既而脅痛流乳人皆異之孟英與甘露飲加女貞旱蓮三甲而瘳吳蘊香之僕吳森在越患感旋杭日鼻衄數升苔黃大渴脈滑而洪孟英投白虎湯二帖而安遽食肥甘復發壯熱脘悶昏倦孟英以枳實梔子豉湯而瘥數日後又昏沉欲寐發熱自汗舌絳溺澀仍求孟英診之左尺細數而芤右尺洪大是女勞復也研詰之果然與大劑滋陰清熱藥吞豭鼠矢而愈趙秋舲進士令郎子循每啖蔗則鼻衄必至或疑蔗為大熱之性孟英曰蔗甘而涼然甘味太重生津之力有餘涼性甚微蕩熱之功不足津虛而熱不甚熾者最屬相宜風溫證中救液之良藥吾名之曰天生復脈湯若濕熱痰火內盛者服之則喻氏所謂翻受胃變從而化熱矣凡藥皆當量人之體氣而施豈可拘乎一定之寒熱耶今子循之體水虛而火旺者也蔗性不能敵反從其氣而化熱正如蔗經火煉則成糖全失清涼之本氣矣枸杞子亦然蒲艾田年逾花甲陡患鼻衄諸法不能止速孟英救之面色黑黯而有紅光脈弦洪而芤詢知冬間廣服助陽藥是熱亢陰虛之證與大劑犀角元參茅根女貞旱蓮石斛茯苓澤瀉天冬知母投匕而安續與滋陰藥填補而康吳蘊香大令之四令媳時患腹脹餐減牙衄腿痛久治不效肌肉漸消孟英診脈弦細而數曰肝氣雖滯而陰虛營熱豈辛通溫運之可投耶以烏梅黃連楝實白芍梔子木瓜首烏鱉甲竹茹貝母服之果愈繼與甘潤滋填肌充胃旺汛準脈和積歲沉疴宛然若失沈悅亭之妻患齒衄五日不止去血已多諸方不應孟英脈之弦滑上溢投犀角澤蘭元參旋覆生地花粉茯苓牛膝桃仁澤瀉而安既而詢其經事本月果已愆期蓋即逆行之候也繼用滋陰清熱乃漸康復孫氏女年將及笄久患齒衄多醫莫療孟英診曰六脈緩滑天癸將至耳豫丹參生地桃仁牛膝茯苓白薇滑石茺蔚子一劑知數日愈尋即起汛略無他患謝再華室素患肝厥孟英於癸卯歲授藥一劑六載安然今夏偶患齒衄繼漸腐臭頭痛汛阻徹夜無眠蓋因秦某作格陽證治進以腎氣湯數服而致劇也孟英豫大劑神犀湯加知母黃柏旬日而瘳某男子患便血醫投溫補血雖止而反泄瀉浮腫延及半年孟英診之脈數舌絳曰此病原屬濕熱溫補翻傷陰液與黃芩黃連梔子白芍桑葉丹皮銀花石斛楝實冬瓜皮鱉甲雞內金等藥旬余而愈王開榮偶患腹中絞痛自服治痧諸藥而大便瀉血如注孟英診之左脈頗和右關尺弦大而滑面色油紅喘逆不寐豫葦莖湯合金鈴子散加銀花側柏葉山梔石斛黃芩黃連二劑後面紅退血亦止乃裁柏葉銀花加雪羹枯荷杆又兩劑始發熱一夜得大汗周身而腹之痛脹爽然若失即能安寐進粥改投沙參知母花粉桑葉枇杷葉石斛白芍橘絡杏仁冬瓜子茅根荷杆三劑大解行而脈柔安穀戊申元旦陳秋槎參軍大便驟然下黑血數升繼即大吐鮮紅之血而汗出神昏肢冷搐搦躁亂妄言速孟英至舉家跪泣求命察其脈左手如無右弦軟按之數以六十八歲之年僉慮其脫參湯煎就將欲灌之孟英急止勿服曰高年陰分久虧肝血大去而風陽陡動殆由忿怒兼服熱藥所致其夫人云日來頗有鬱怒熱藥則未服也惟冬間久服薑棗湯且飲都中藥燒酒一瓶耳孟英曰是矣以西洋參犀角生地銀花緑豆梔子元參茯苓羚羊角茅根為劑衝入熱童溲灌之外以燒鐵淬醋令吸其氣用龍骨牡蠣研粉撲汗生附子搗貼湧泉穴引納浮陽兩服後血止左脈漸起又加龜板鱉甲服三帖神始清各恙漸息稍能啜粥乃去犀羚加麥冬天冬女貞子旱蓮草投之眠食日安半月後始解黑燥屎兩旬外便溺之色始正與滋補藥調痊仍充撫轅巡捕矍鑠如常秋間赴任紹興酉年秋以他疾終便血至三十餘年且已形瘦腰痛嗽痰氣逆似宜乎溫補之法矣而嘉定沈醞書患此瀕危求孟英以決歸程之及否比按脈弦數視舌苔黃詢溺短赤曰痔血也殆誤於溫補矣肯服吾藥旬日可瘳醞書欣感力排衆論徑服其方果不旬而愈方用葦莖湯合白頭翁湯加枇杷葉旋覆花側柏葉藕節是肅肺祛痰清肝涼血互用也祝氏婦患溺血五六年矣醫皆作淋治孟英診視脈弦數苔黃口苦頭痛溺熱曰是溺血也法當清肝與久淋當滋補者迥殊病者極為首肯蓋其出路自知而赧於細述故醫者但知其為淋也驚悸怔忡一圃人詣孟英泣請救命詰其所以云家住清泰門內馬婆巷因本年二月十五日卯刻雷從地奮火藥局適當其沖牆垣廨宇一震泯然雖不未傷人而附近民房撼搖如簸其時妻在睡中驚醒即覺氣不舒暢半載以來漸至食減形瘦神疲汛少惟臥則其病如失藥治罔效或疑邪祟所憑祈禱壓鎮亦屬無靈敢乞手援幸無卻焉孟英許之往見婦臥於榻神色言動固若無恙診畢病人云君欲睹我之疾也耶坐起果即面赤如火氣息如奔似不能接續者苟登廁溲便必賁逆欲死而前所服藥如破氣行血和肝補肺運脾納腎清火安神諸法具備輒如水投石孟英仿喻氏治吳添官母厥巔疾之法用藥旋覆花代赭石龍膽草黃連龍骨牡蠣五味子烏梅木瓜法夏蒺藜豬膽汁一劑知旬余愈孟英治其令弟季傑之簉室因夜間未寐侵晨飲酒解寒適見旁人爭誶即覺心跳欲吐家人疑其醉也而欲吐不出氣即奔逆如喘且肢麻手握語言難出又疑為急痧而欲刺之孟英聞而視之脈象弦駛曰夜坐陽升飲醇則肝陽益浮見人爭誶是驚則氣更上逆不可刺也灌以蘇合香丸一顆下咽即瘥顧升庵參軍之仲郎久患多疑善恐不出房者數年矣食則不肯與人共案臥則須人防護寡言善笑時或遺精多醫廣藥略無寸效孟英切脈甚滑數與元參丹參竺黃竹茹丹皮黃連花粉梔子海虴荸薺為劑送服當歸龍薈丸四帖即能出署觀劇遊淨慈而登吳山參軍大喜以為神治次年為之配室章養雲室患感適遇猝驚黃包二醫皆主溫補乃至昏譫痙厥勢極危殆棺衾成備無望生矣所親陳仰山聞之謂云去秋顧奏云之恙僅存一息得孟英治愈子盍圖之章遂求診於孟英證交三十八日脈至細數無倫兩手拘攣宛如角弓之反張痰升自汗渴飲苔黃面赤臀穿晝夜不能閣眼先與犀角羚羊角貝母石斛元參連翹知母花粉膽星牛黃鱉甲珍珠竺黃竹葉竹茹竹瀝為方三劑兩手漸柔汗亦漸收又五劑熱退痰降脈較和而自言自答日夜不休乃去羚羊角石斛珍珠牛黃加西洋參生地大塊硃砂兩許服之聆絮不減復於方中加青黛龍骨牡蠣服二劑仍喋喋不已孟英苦思數四徑於前方加木通一錢投匕即效次日病者自云前此小溲業已通暢不甚覺熱昨藥服後似有一團熱氣從心頭直趨於下由溺而泄從此神氣安謐粥食漸加兩腿能動大解亦堅忽咽腫大痛水飲不下孟英曰餘火上炎也仍與前方更吹錫類散而安唯臀瘡未斂腿痛不已乃下焦氣血傷殘改用人參黃耆當歸白芍生地合歡山藥麥冬牛膝石斛木瓜山梔藕肉數服痛止餐加又豫峻補生肌而愈魏氏女因事驚駭次日即不知飢眩暈便祕醫謂神虛投補數帖反至時欲昏厥更醫作中風治勢益甚旬日後孟英持其脈弦伏而滑胸腹無脹悶之苦而旬余又不更衣是驚則氣亂挾痰逆升正仲聖所謂諸厥應下者下其痰與氣也以旋復赭石梔子黃連雪羹楝實貝母金箔竹瀝萊蔔汁為方並以鐵器燒紅淬醋令吸其氣二劑厥止旬日而瘳楊某方作事不知背後有人潛立回顧失驚遂不言不食不寐不便別無他苦孟英按脈沉弦以石菖蒲遠志琥珀膽星旋復貝母竺黃杏仁省頭草羚羊角為劑化服蘇合香丸二帖大解行而啜粥夜得寐而能言復豫調氣寧神蠲飲藥數日霍然王瘦石稟屬陰虧卒聞驚嚇之聲而氣逆肢冷自汗息微速孟英視之身面皆青緑之色脈沉弦而細乃素傷憂慮而風陽陡動也豫牡蠣四兩鱉甲二兩蛤殼一兩石英五錢龍齒小麥辰砂麥冬茯神貝母竹茹為方一劑知二劑已續以滋養而瘳己酉春胡孟紳山長患疑坐臥不安如畏人捕自知為痰餌白金丸吐之汗出頭面神躁妄聞孟英切其脈弦滑洪數不為指撓投石膏竹茹枳實黃連旋覆花粉膽星石菖蒲加雪羹竹瀝童溲吞礞石滾痰丸下其痰火連得大解夜分較安惟不能斷酒為加緑豆銀花枳椇子吞當歸龍薈丸旬余脈證漸平神氣亦靜尚多疑懼改授犀角元參丹皮竹葉竹茹貝母百合丹參蓮心豬膽汁炒棗仁鹽水炒黃連吞枕中丹以清包絡肝膽之有餘而調神志又旬日各恙皆蠲即能拈韻繼與十味溫膽法善其後太侖陸竹琴之令正陡患心悸肢冷如冰其子惶惶浼吳江程勉耘懇援於孟英察其脈浮弦而數視其舌尖赤無苔乃陰虛陽越煎厥根萌與元參二至三甲龍齒石英生地牛膝茯神蓮子心而愈康康侯司馬令郎爾九在玉環署中患心忡自汗氣短面赤霎時溲溺數十次澄徹如水醫僉謂虛補之日劇乃來省就孟英診焉左寸關數右弦滑心下似阻因作痰火阻氣心熱移肺治用蛤殼黃連枳實楝實旋覆花粉橘紅杏仁百合絲瓜絡冬瓜子海虴荸薺竹茹竹瀝梨汁等出入為方服之良愈而司馬指康康侯為職守所羈嘗患恙函請孟英診視者數四竟不克往繼聞司馬於仲冬竟卒於甌乃知病而得遇良手原非偶然前歲遇而今歲不能致豈非命也耶不寐費伯元分司患煩躁不眠醫見其舌苔白也投以溫藥因而狂妄瘛瘲多方不應孟英視之左脈弦細而數右軟滑乃陰虛之體心火熾肝風動而痰盛於中也先以犀角羚羊角桑葉菊花熄其風元參丹皮蓮心童溲清其火竹茹貝母雪羹化其痰兩劑而安隨與三甲二至丸磁朱丸潛其陽甘草小麥大棗緩其急地黃麥冬養其陰漸次康復邵竹魚給諫起居飲食如常唯僅能側眠略難仰臥仰而寤無恙也稍一閣眼則驚竄而醒雖再側眠亦徹夜不得寐矣多年莫能治孟英以三才湯合枕中丹加黃連肉桂交泰丸服之良效遺精一少年驟患遺精數日後形肉大脫連服滋陰澀精之藥如水投石孟英與桂枝湯加高麗參黃耆龍骨牡蠣服下即效匝月而瘳屠某患夢遺久治不愈耳出膿水目淚難開肩脅胸背痠疼微有寒熱食減神疲孟英察脈左弦數右虛軟以三才湯封髓丹加龍骨牡蠣黃耆丹皮山梔菊花旬日而瘳癲狂李某戊年冬醉飲夜歸為查段人員所嚇神志即以漸昏治之罔效至於不避親疏裸衣笑罵力大無制糞穢不知己年夏延孟英視之用石菖蒲遠志龍齒龜板犀角羚羊角元參丹參知母黃柏梔子龍膽草枳實黃連竺黃竹瀝石膏赭石黑鉛鐵落出入為方十餘帖吐瀉膠痰甚多繼豫磁朱丸漸以向愈李叟年逾古稀意欲納妾雖露其情而子孫以其耄且瞽也不敢從因此漸病狂惑群醫咸謂神志不足廣投熱補之藥愈服愈劇始延孟英診之脈徑搏指面赤不言口涎自流力大無制曰此因秉賦過強陽氣偏盛姑勿論其脈證即起病一端概可見矣如果命門火衰早已萎靡不振焉能興此念頭醫見其老輒疑其虛須知根本不堅實者不能享長年既享大壽其得於天者必厚況人年五十陰年先衰徐靈胎所謂千年之木往往自焚夫陰盡火炎萬物皆然去年冬吾治邵可亭孤陽喘逆壯水清火之外天生甘露飲即北梨汁灌至二百餘斤病已漸平僅誤於兩盞薑湯前功盡墜可見陰難充長火易燎原今肉桂附片仙茅鹿茸人參巴戟紫河車等藥服之已久更將何物以生其涸竭之水而和其亢極之陽乎尋果不起江某年三十餘忽兩目發赤牙齦腫痛漸至狂妄奔走罵人不避親長其父惶惶求孟英診之脈大而數重按虛散與東洋參熟地黃辰砂磁石龍齒菖蒲棗仁琥珀肉桂金箔龍眼肉為劑投匕即安翼日能課徒矣王月鋤令媳於廟見古時結婚儀式時忽然目偏左視揚手妄言諸親駭然詰其婢媵素無此恙速孟英視之脈弦滑而微數苔黃脘悶蓋時雖春暮天氣酷熱兼以勞則火升挾其素有之痰而使然也與犀角羚羊角梔子連翹元參丹參薄荷花粉送服礞石滾痰丸三服而痰下神清改投清養遂愈次年即誕子朱養心後人名大鏞者新婚後神呆目瞪言語失倫或疑其體弱神怯與鎮補安神諸藥馴至善飢善怒罵詈如狂其族兄已生邀孟英診之右脈洪滑與犀角石膏菖蒲膽星竹瀝知母吞礞石滾痰丸而愈癇證邵竹魚給諫令郎之子旅久患痰多胸膈滿悶連年發癇藥之罔效孟英脈之曰氣分偏虛痰飲阻其清陽之旋運宜法天之健以為方則大氣自強而流行不息胸次乃廓然如太空矣與六君子湯去甘草加黃耆桂枝薤白蔞仁石菖蒲蒺藜旋覆服之滿悶漸舒癇亦不發矣中風鄭芷塘令嶽母年逾花甲仲春患右手足不遂舌謇不語面赤便閉醫與疏風不效第四日延診於孟英右洪滑左弦數為陽明腑實之候疏石菖蒲膽星知母花粉枳實蔞仁秦艽旋覆麻仁竹瀝為方或慮便瀉欲脫置不敢用而不知古人中藏宜下之藏字乃府字之偽柯氏云讀書無眼病人無命此之謂也延至兩旬病勢危急芷塘浼童秋門復懇孟英視之苔裂舌絳米飲不沾腹脹息粗陰津欲竭非急下不可也即以前方加大黃四錢絞汁服連下黑矢五次舌謇頓減漸啜稀糜乃去大黃加西洋參生地麥冬丹皮薄荷服五劑復更衣語言乃清專用甘涼充津滌熱又旬日舌色始淡納穀如常改以滋陰漸收全績逾三載聞以他疾終趙秋舲進士去秋患左半身不遂伊弟笛樓暨高弟許芷卿茂才主清熱蠲痰治之未能遽效邀孟英診之脈甚遲緩苔極黃膩便祕多言乃於藥中和入竹瀝一碗且以龍薈滾痰二丸相間而投二丸各用斤許證始向愈今春出房眠食已復而素嗜厚味不戒肥甘孟夏其病陡發孟英診之脈形滑駛如蛇斷其不起秋初果歿賴炳池令堂年近古稀患左半身不遂醫與再造丸暨補劑服二旬病如故孟英按脈弦緩而滑顴赤苔黃音微舌謇便澀無痰曰此痰中也伏而未化與犀角羚羊角竹茹貝母菖蒲法半夏花粉知母白薇豆卷桑枝絲瓜絡等藥服三劑而苔化音漸清朗六七劑腿知痛痰漸吐便亦通既而腿痛難忍其熱如烙孟英令塗蔥蜜以吸其熱痛果漸止半月後眠食漸安二旬外手能握月餘可扶掖以行矣徐夢香年近六旬患手顫不能握管孟英以通補熄風之藥吞服指迷茯苓丸而安仲秋類中遺溺痰升昏瞀妄言汗多面赤急延孟英視之脈浮弦洪滑蓋吸受熱邪而連日適服參湯也與羚羊角石菖蒲連翹梔子桑葉菊花楝實石斛知母花粉竹瀝銀花青蒿白薇等藥一劑知二劑神清乃去羚羊角菖蒲加竹茹貝母滑石投之下痢白如膿垢者數日始知飢納穀漸以調理而愈匝月即能作畫季秋仍幕遊江右韓組林年雖七十飲啖兼人而平時喜服藥醫以其老輒用桂附參茸等藥以期可享遐齡詎料初八日晚膳尚健飯三更睡醒倏寒栗發顫俄而四肢瘛瘲越日云亡得非即世人所謂子午證耶孟英曰此老系陽旺之體肥甘過度痰火日增年至古稀真陰日耗而久服此等助火灼陰之藥以致風從火出立拔根荄與兒科所云急驚風證殆無異焉眩暈湖墅張春橋素稟不堅頭眩腦鳴頻服溫補藥甚覺畏冷人皆謂其體偏於寒也辛丑春始請孟英診之脈甚數曰陰虧也溫補非宜改服滋水培元之劑頗為有效夏間或勸以灸火云可以除百病蓋未知灼艾之可以除百病者謂可除寒濕凝滯陽氣不能宣通之證非謂內傷外感一切之病皆可以灸除之也故仲景有微數之脈慎不可灸之訓正以艾火大能傷陰也灸後數日即寒少熱多宛如虐疾醫者以為脾寒病投以溫散日以滋甚春橋知藥治未符堅不肯服乃父與之詢其故漫曰要兒服藥須延王先生診治與之遂邀孟英治之切其脈滑數倍加曰陰虛之體內熱自生灸之以艾火氣內攻當時溽暑天熱外爍三者交加陰何以堪再投溫散如火益熱當從疸瘧治專以甘寒熄熱則陰津不致枯涸而寒熱可不攻自去所謂治病必求其本也竟不用一分表散藥而治愈一老廣文俸滿來省驗看患眩暈醫謂上虛進以參耆等藥因而不食不便煩躁氣逆孟英診曰下虛之證誤補其上氣分實而不降先當治藥然後療病與山梔豆豉黃芩桔梗枳實橘紅紫菀貝母一劑粥進便行嗣用滋陰熄風法而愈王雪山令媳患心悸眩暈廣服補劑初若甚效繼乃日劇時時汗出肢冷息微氣逆欲脫灌以參湯稍有把握延逾半載大弗不資莊之階舍人令延孟英診視脈沉弦且滑舌絳而有黃膩之苔口苦溲熱汛事仍行病屬痰熱轇轕誤補則氣機壅塞與大劑清熱滌痰藥吞當歸龍薈丸服之漸以向安仲夏即受孕次年二月誕一子惜其娠後停藥去痰未盡娩後復患悸暈不眠氣短不飢或作産後血虛治不效仍請孟英視之脈極滑數曰病根未刈也與蠲痰清氣法果應比丘尼心能體厚蹣跚偶患眩悸醫以為虛久服溫補漸至發腫不飢仲夏延孟英視之脈甚弦滑舌色光絳主清痰熱盡撤補藥彼不之信仍服八味等方至季夏再屈孟英診之脈數七至眠食盡廢不可救藥矣果及秋而荼毗和尚死叫荼毗曾稼梅令嬡患眩暈脘痛筋掣吐酸渴飲不飢咽中如有炙臠朱某與溫胃藥病日劇孟英診脈弦滑投竹茹貝母吳茱萸黃連旋復赭石梔子楝實枳實郁金雪羹之藥十餘劑始愈胡秋谷令嬡年甫笄女子十五歲為笄往歲患眩暈孟英切其脈滑作痰治服一二劑未愈更醫謂虛進以補藥頗效渠信為然今冬復病徑服補藥半年後眠食皆廢聞聲驚惕寒顫自汗肢冷如冰以為久虛欲脫乞援於孟英脈極細數目赤便祕胸下痞塞如柈力辨其非虛證蓋痰飲為患乍補每若相安惟具隻眼者始不為病所欺也投以旋復赭石竹茹貝母蛤殼花粉桑葉梔子栝蔞薤白黃連枳實等藥數服即安而暈不能止乃去赭石薤白栝蔞枳實加元參菊花二至三甲之類服匝月始能起榻李甫華令正患頭震孟英脈之弦滑乃肝經鬱怒火升也投當歸龍薈丸而瘥然不能懲忿其病屢發之後更兼溺閉腹脹喘汗欲絶亟邀孟英視之脈甚弦澀口苦苔黃舌色紫黯汛雖不愆內有瘀滯也以雪羹加金鈴旋覆梔子滑石桃仁茺蔚車前子木通仍吞龍薈丸外以田螺大蒜車前草搗貼臍下服後果先下黑血溲即隨通繼而更衣糞色亦黑遂愈厥證許滇生之媳為阮藝臺太傅之女孫在都因喪子悲哀患發厥屢服補劑以致汛愆或疑為娠孟英曰脈雖弦數以滑乃痰挾風陽而為厥也與大劑蠲痰熄風舒郁清營之劑漸以獲愈丁酉中秋夜牙行張鑑録年逾花甲猝僕於地急延孟英脈之弦滑而大曰痰氣食相併而逆於上也先以烏梅擦開牙關橫一竹箸於口灌以淡鹽薑湯隨以鵝翎探之太息一聲而蘇次與調氣和中而愈後數年以他疾終秋初家慈猝僕於地孟英診之脈浮弦以滑用羚羊角膽星牡蠣石菖蒲丹參茯苓鉤藤桑葉貝母橘紅蒺藜等以順氣蠲痰熄風降火而痊癸卯春前數日忽作欠伸而厥孟英切脈微弱而弦曰病雖與前相似而證則異矣以高麗參白朮何首烏山茱萸枸杞桑椹石斛淮牛膝蒺藜橘紅牡蠣等鎮補攝納以瘳余謂此等症安危在呼吸之間觀前後猝僕數案可見其辨證之神雖古人不多讓況世俗之所謂醫乎家慈兩次類中豫皆遠出微孟英吾將焉活感銘五內聊識數言惟願讀是書者體其濟世之心臨證得能如是將胥天下之沉疴而盡起矣祝叟年近古稀己亥春赴席忽仆地痰湧肢強眼斜舌謇不語外科王瑞芝薦孟英視之投六君子湯加蠍稍羚羊角膽星石菖蒲竹瀝薑汁而瘳沈新豫令嶽母陡患昏厥速孟英視之病者樓居酷熱如蒸因曰此陰虛肝陽素盛之體暑邪吸入包絡亟宜移榻清涼之地隨以紫雪丹一錢新汲水調下可安而病者自言手足已受縲紲堅不肯移家人驚以為祟聞而束手孟英督令移之如法灌藥果即帖然胡次瑤婦陡患肢麻昏眩以為急痧孟英視之面微紅音低神憊睛微赤舌色微黃足微冷身微熱胸微悶脈微弦曰乃本元素弱謀慮縈思心火上炎內風隨以上僭豈可誤作痧閉妄投香散之藥哉以人參龍骨牡蠣菖蒲黃連石英麥冬小麥竹葉蓮子心為方兩啜而瘥尋與平補善其後脫證甲申夏豫於登廁時忽然體冷汗出氣怯神疲孟英視之曰陽氣欲脫也猝不及得藥適有三年女佩薑一塊約重四至五錢急煎而灌之即安後用培補藥率以人參黃耆白術炙草為主蓋氣分偏虛也鄭九經越醫陳六順診治服藥後汗出昏狂精流欲脫孟英切其脈既散且亂沉取極細曰此證頗危生機僅存一線亦斯人陰分素虧不可盡謂桂附之罪也以元參生地知母黃柏白芍石斛百合甘草梔子桑枝龍骨牡蠣鹽水炒豆豉為大劑灌之下咽即安次日去梔豉甘草加龜版鱉甲鹽水炒橘紅服十餘帖而康痹證某媼年六十餘患腰腿串痛聞響聲即兩腿筋掣不可耐且必二三十次臥榻數載諸藥罔效孟英察脈沉弦苔膩便祕亦因廣服溫補而致病日劇也與雪羹羚羊角楝實膽星橘絡竹瀝絲瓜絡吞礞石滾痰丸及當歸龍薈丸四劑大瀉數十次臭韌異常筋掣即已乃去二丸加山梔黃連羊藿服六劑即健飯而可扶掖以行矣某嫗患腰痛脹欲捶多藥不效孟英視其形雖羸瘦而脈滑痰多苔黃舌絳曰體虛病實溫補非宜苟不攻去其痰徒以疲藥因循則病益實體益虛糜帑勞師養成寇患豈治病之道哉先以雪羹湯加竹茹楝實緑萼梅杏仁花粉橘紅茯苓旋覆吞控誕丹服後果下膠痰三進而病若失嗣豫調補獲痊牙行王炳華室夏患臂痛孫某曰風也服參耆歸芍數帖臂稍愈而脘痛孫曰寒也加以桂附痛不止而漸覺痰多孫曰肝腎不足也重用熟地枸杞令其多服取效不料愈服愈劇漸至昏厥孫尚以為藥力之未到病體之久虛前方復加重甚而時時發厥始請孟英診之脈沉而有弦滑且數之象乃謂炳華曰此由過投溫補引動肝風煽其津液為痰痰復乘風而上此暈厥之所由來也餘波則奔流經絡四肢因而抽搐陽氣盡逆於上宜乎鼻塞面浮濁氣不能下達是以便滯不飢炳華曰先生真神見也溫補藥服凡三月矣不知尚可救乎孟英曰不疑吾藥猶有望焉遂豫大劑甘寒熄風化飲佐以涼苦泄熱清肝厥果漸止而各恙遞蠲兩月後康復如常某勞力人陰分素虧驟感風濕兩膝刺痛痠軟不能稍立孟英以六味地黃湯加獨活豆卷一劑知二劑已徐月岩室患周身麻木四肢癱瘓口苦而渴痰冷如冰氣逆欲嘔汛愆腹脹頻飲極熱薑湯似乎暢適深秋延至季冬服藥不愈孟英診脈沉弦而數因問曰溺熱如火乎間有發厥乎病者唯唯遂以雪羹旋復赭石梔子楝實竹茹石斛知母花粉桑枝羚羊角橄欖蛤殼為方送下當歸龍薈丸服之遞減二十劑即能起榻乃去羚羊角赭石加洋參生地蓯蓉藕汁投之漸愈高某患兩膝筋絡痠痛略不紅腫臥則痛不可當徹夜危坐孟英切脈虛細苔色黃膩咽燥溺赤與知母石斛梔子楝實牛膝豆卷桑枝竹瀝為方送虎潛丸旬日而瘳謝譜香素體陰虛忽患環跳穴痛始而下及左腿繼而移於右腿甚至兩足轉筋上衝於腹間或痛自乳起下注於髀日夜呼號肢冷自汗略難反側醫見其血不華色輒投補劑逮仲春孟英自江西歸診脈弦軟微滑畏熱知飢溲赤便堅舌紅不渴乃陰虛而痰氣滯於厥陰也以蓯蓉鼠矢竹茹絲瓜絡橘核茴香湯炒當歸吳萸湯炒黃連川椒湯炒烏梅延胡湯炒楝實海虴鳧茈為劑一服即減數啜而安繼與虎潛加秦艽而起痿證夏間王某患感越醫謝樹金治之病雖退而能食矣但不能起坐類乎癱瘓延已月餘人皆謂其成廢所親鍾某浼孟英視之曰此因多服表散汗出過分氣血兩傷肢骸失其營養脈微而細舌亮無苔與大劑高麗參黃耆當歸白術熟地杜仲菟絲子牛膝枸杞山藥木瓜萸肉萎蕤續斷桑枝服數十帖而起腳氣顧云蘿令正久患腳氣屢治屢發馴致周身筋掣上及於巔齦痛齒麻腰痠目眩口乾食少夜不能眠孟英察其脈芤而弦數真陰大虧腿雖痛從無赤腫之形腳氣藥豈徒無益而已豫二地二冬二至丸知母黃柏桑枝菊花梔子楝實青蒿白薇龜板鱉甲藕肉等藥服之各恙漸減蓋因平昔帶下太甚陰液泄漏而筋脈失其濡養治病應澄源以潔流秋間以海螵蛸粉魚膘膠黃柏阿膠為丸服之痊愈魏女患腳腫嘔吐寒熱便祕孟英豫龍膽瀉肝湯而立效繼有孫氏婦患此亦以是藥獲愈胃脘痛趙聽樵室高若舟之妹也去冬偶患脘痛黃某治之漸增頭痛眩暈氣逆嘔吐痰多不寐便溏不食經事不行始疑其虛三月後又疑為娠諸藥遍嘗病日以進若舟延孟英脈之左弦而數右滑以駛曰病藥耳旬日可瘳趙疑大病小視不服其方越半月病者頸軟頭重難舉醫謂天柱已倒勢無望矣若舟聞之復懇援於孟英疏方仍是前診之法趙問此病諸醫束手大劑補藥尚無寸效而君兩次用藥皆極清淡雖分量頗重亦焉能有濟乎孟英曰子何愚耶藥惟對證乃克愈病病未去而補之是助桀也病日加而補益峻是速其死也原彼初意非欲以藥殺人總緣醫理未明世故先熟不須辨證以補可媚人病家雖死不怨醫者至老無聞一唱一和熟能挽此頽風令閫體質雖豐而陰虛有素是以木少水涵肝陽偏盛上侮於胃則為脘痛斯時若投以酸苦泄肝甘涼養胃數日愈矣乃溫補妄施油添火上肺津胃液灼爍無餘怒木直升樞機窒塞水飲入胃凝結為痰雖見證多端皆氣失下降豈可指眠食廢以為癆月汛爽爽字作愆期解而為娠耶豫大劑輕淡之品肅清氣道俾一身治節之令肝胃逆升之火胃腑逗留之濁樞機郁遏之熱水飲凝滯之痰鹹得下趨自可向愈不必矯枉過正而妄以芒硝大黃傷正氣所謂藥貴對證而重病有輕取之法非敢藐視人命故將疲藥塞責也趙極感悟投匕即效逾旬果安又一月經至嗣豫滋養康復如常越二載又病復惑於黃某溫補之論而孟英之功盡墜惜哉金朗然之母偶發脘痛嘔吐醫與溫補藥初若相安漸至畏寒不寐四肢不仁更醫云是風痹仍投溫補因而不飢不食二便不行肌肉盡削帶下如溺始延孟英診之曰暑伏脾胃耳其多投溫補而不遽變者以熟地等陰柔膩滯為之挾制也然津氣灼爍而殆盡脂液奔迫以妄行治節無權陽明涸竭焉能衛皮毛而暢四肢利機關以和九竅哉與白虎湯加西洋參竹茹橘皮絲瓜絡石斛花粉竹瀝海虴連進二十劑始解黑矢而各恙漸安嗣與和肝胃調八脈以善後遂愈李某向患脘痛孟英頻與建中法獲瘳今秋病偶發他醫診之聞其溫補相投徑依樣而畫葫蘆服後耳閉腿痛不飢便滯仍就孟英視之曰暑邪內伏誤投補藥使然治宜清滌為先彼不之信反疑為風氣付外科灼灸遂至筋不能伸而成錮疾孟英曰此證較金病金朗然母之病輕逾十倍惜惑於淺見致成終身之患良可嘆也獨怪謀利之徒假河間太乙針之名而妄施毒手舉國若狂竟有不惜重價求其一針隨以命殉之者吾目擊不少矣夫內經治病原有尉之一法然但可以療寒濕凝滯之證河間原方惟二活羌活獨活黃連加麝香乳香耳主治風痹今乃托諸鬼神矜誇祕授云可治盡內傷外感四時十二經一切之病天下有是理乎況其所用之藥群集辛熱香竄之品點之以火定必傷陰一尉而吐血者有之其不可輕試於陰虛之體與挾熱之證也概可見矣吾友盛少云之尊人臥云先生誤於此而致周身潰爛臥床數載以亡仲聖焦骨傷筋之訓言猶在耳操醫術者胡忍執炮烙之嚴刑欺世俗而罔利哉沈某患脘痛嘔吐二便閉澀諸治不效孟英視之脈弦軟苔黃膩曰此飲證也豈沉湎於酒手沈云素不飲酒性嗜茶耳然恐茶寒致病向以武彝紅茶葉熬濃而飲之諒無害焉孟英曰茶雖涼而味清氣降性不停留惟蒸遏為紅味變甘濁全失肅清之氣遂為釀痰之媒較彼曲糵殆一間耳醫者不察僅知嘔吐為寒薑萸沉附不特與病相反抑且更煽風陽飲藉風騰但升不降是以上不能納下不得通宛似關格然非陰枯陽結之候也以黃連楝實梔子黃芩旋覆竹茹枇杷葉橘皮半夏茯苓澤瀉蛤殼荷杆生薑衣為方送服震靈丹數劑而平匝月而起王耕藍室素患脘痛近發寒熱醫與溫補漸至胸痞嘔厄譫語神昏舌絳面赤足冷自汗瘧仍不休孟英用元參犀角石膏石菖蒲連翹杏仁貝母旋覆竹茹枇杷葉竺黃柿蒂竹瀝鬱金諸藥化服萬氏牛黃清心丸數服而愈金某久患脘痛按之漉漉有聲便祕溲赤口渴苔黃杳不知飢絶粒五日諸藥下咽傾吐無餘孟英察脈沉細而弦用海虴荸薺各四兩煮湯飲之竟不吐痛亦大減繼以此湯煎高麗參黃連楝實延胡梔子枳椇子石斛竹茹柿蒂等藥送服當歸龍薈丸旬日而安繼豫春澤湯調補收績蓋其人素善飲而嗜瓜果以成疾也董曉書令正素患脘痛甚至暈厥今秋病腰痛腿木胸悶氣逆不能臥胡某進溫補藥而喘汗欲脫杳不思谷孟英切脈虛細中兼有弦滑舌絳而渴乃陰虛挾痰耳與沙參蓯蓉木瓜石斛蛤殼蒺藜紫石英茯苓紫菀杏仁楝實首烏牛膝諸藥旬日而安繼加熟地黃服之痊愈莊芝階舍人令嬡孀居在室陡患氣衝欲厥脘痛莫當自服沉香吳萸等藥病益劇而嘔吐發熱略有微寒孟英按脈弦滑且數苔色滑膩微黃而渴喜冷飲便祕溲熱眠食皆廢是伏痰內盛肝逆上升而兼吸受暑熱也豫吳萸水炒黃連枳實竹茹栝蔞石膏旋覆赭石知母半夏雪羹服二劑吐止痛減五劑熱退而解猶不暢旬日始得豁然乃去石膏知母旋復赭石調之而愈吳蘊香大令仲媳汛愆而崩之後脘痛發厥自汗肢冷孟英脈之細而弦滑口苦便澀乃素體多痰風陽內鼓雖當崩後病不在血與旋復赭石羚羊角竹茹枳實貝母薤白栝蔞蛤殼為方痛乃漸下厥亦止再加金鈴延胡蓯蓉鼠矢服之而愈逮季冬因猝驚發狂笑罵不避親疏孟英察脈弦滑而數與犀角羚羊角元參丹皮丹參梔子菖蒲竹葉鱉甲竹瀝吞服當歸龍薈丸熄風陽以滌痰熱果數劑而安然平時喜服補藥或有眩暈不知為風痰內動益疑為元氣大虛孟英嘗諫阻之而彼不能從至次年春季因傷感而狂證陡發毀器登高更甚於昔孟英視之苔黑大渴與前方加珍珠牛黃服之苔色轉黃弦滑之脈略減而狂莫可治改以石膏硃砂鐵落菖蒲青黛知母膽星鱉甲金鈴旋覆元參竹瀝為大劑送服礞石滾痰丸四服而平繼而腳氣大發腹痛便閉上衝於心肢冷汗出昏暈欲厥與黃連楝實梔子竹茹小麥百合旋復貝母延胡烏藥雪羹石英鼠矢黃柏藕肉等藥服之而安吳沄門年逾花甲素患脘痛以為虛寒輒用溫補久而益劇孟英診曰肝火宜清彼不之信延至仲夏形已消瘦倏然浮腫脅背刺痛氣逆不眠心辣如焚善嗔畏熱大便時瀉飲食下咽即吐諸醫束手乃懇治於孟英脈軟而數與竹茹黃連枇杷葉知母梔子楝實旋復赭石等藥而吐止飲食雖進各恙未已投大劑沙參生地龜板鱉甲女貞旱蓮桑葉丹皮銀花茅根竹茹貝母知母黃柏枇杷葉菊花等藥出入為方二三十劑後周身發疥瘡而腫漸消右耳出黏稠膿水而瀉止此諸經之伏熱得以宣泄也仍以此藥令其久服逮秋始愈冬間能出門矣脅痛單小園巡檢患右脅痛醫豫溫運藥病益甚至於音喑不能出聲仰臥不能反側坐起則氣逆如奔便溺不行湯飲不進者已三日矣孟英診其脈沉而弦與旋覆赭石薤白蔞仁黃連法夏竹茹貝母枳實紫菀加雪羹服之一劑知數劑愈腹痛腹脹陳春湖令郎子莊體素弱季秋患腹痛自汗肢冷息微咸謂元虛欲脫孟英診之脈雖沉伏難尋而苔色黃膩口乾溺赤當從證也與黃連厚朴楝實梔子元胡蠶砂省頭草等藥服之而康次年患感復誤死於補夏醞泉延孟英視錢嫗之病腹痛欲絶因見弦滑之脈與當歸龍薈丸而安許仲筠患腹痛不飢醫與參附薑術諸藥痛脹日加水飲不沾沉沉如寐孟英診脈弦細苔色黃膩投以枳實厚朴吳萸黃連梔子楝實香附蒺藜延胡等藥二劑便行脈起苔退知飢而愈阮範書明府令正患腹痛欲厥醫見其體甚弱也與鎮逆通補之法而勢日甚孟英察脈弦數左溢是因忿怒而肝陽勃升也便祕不飢口苦而渴與雪羹梔子楝實旋復絳屑元胡丹皮竹茹貝母調下左金丸而愈逾年以他疾歿於任所張月波令弟陡患腹痛適飽啖羊肉麵條之後醫皆以為食滯連進消導痛甚而渴得飲大吐二便不行又疑寒結疊投燥熱其病益加呻吟欲絶已四日矣孟英視之脈弦數苔干黃按腹不堅以海虴一斤鳧茈一斤煎湯頻灌果不吐令將余湯煎山梔黃連楝實石斛竹茹黃芩枇杷葉知母延胡柿蒂旋覆為劑吞龍薈丸投匕而溲行痛減次日更衣而愈吳誦青室年近五旬天癸已絶偶患腹脹局醫黃某知其體素羸也投以腎氣湯而寒熱漸作改從建中法旬日後病劇而崩愈補愈甚乞援於孟英脈洪而數渴飲苔黃是吸受暑邪得溫補而血下漏也與犀角元參茅根柏葉梔子楝實知母石斛花粉白薇等藥數劑始安續加生地二至丸二冬滋養而愈次年患病仍為藥誤而殞高若舟偶患腹脹醫投溫運漸至有形如痞時欲沖逆吐酸益信為虛寒之病溫補之藥備嘗飲食日減其痞日增肌肉漸消臥榻半載甲辰春迓孟英診脈沉弦而軟滑大解不暢小溲渾短苔色黃膩乃肝鬱氣結鬱則生熱補則凝痰與梔子川楝吳萸黃連元胡烏藥旋復枳實雞金鱉甲竹茹橘皮茯苓法夏等藥服之證雖遞減時發寒熱四肢痠痛或疑為瘧孟英曰此氣機宣達鬱熱外泄病之出路豈可截乎參以秦艽柴胡豆卷羚羊角蠶砂桑枝之類迎而導之人皆疑久病元虛藥過涼散而若舟堅信不疑孟英識定不惑寒熱漸息攻衝亦止按其腹尚堅硬時以龍薈滾痰丸緩異之飲食遞加漸次向愈若舟善作隸因集詩品書一聯以贈孟英云古鏡照神是有真宰明漪絶底如見道心蓋頌其隔垣之視也石子章患腹脹朱某與大劑溫補之藥殊若相安孟英見而非之彼云服之略不助脹正須多服圖痊君何疑耶孟英曰形瘦脈數舌色乾紅此為陰虛熱脹昔年有範次侯室及楊改之如君妾之恙皆類此多醫攻補追施病無小效吾以極苦泄熱微辛通絡之法投之應手而瘳今子病初起脹不礙食症非氣分可知而彼誤信溫補不助脹遂服之不疑不知陰愈耗絡愈痹脹雖不加而肌則愈削脈愈數干嗆氣急與女子之風消息賁何以異耶尋果不起按喻氏始信男子亦有血蠱證可見男女雖別而異中有同同中有異臨證者不可膠柱鼓瑟許某於醉飽後腹中脹悶大便不行自恃強壯仍飲酒食肉二日後腹痛猶疑為寒又飲火酒兼吸洋煙並小溲不通繼而大渴引飲飲而即吐而起居如常也四朝走懇孟英診之脈促歇止滿舌黃苔極其穢膩而體豐肉顫症頗可危因婉言告之曰不過停食耳且飲山楂神麯湯可也午後始覺指冷倦怠尚能坐轎出城到家氣逆夜分痰升比曉胸腹額上俱脹裂而死蓋知下之不及故不豫藥也宋氏婦患感反復已經向愈忽然腹脹上至心下氣喘便瀉溺閉湯飲不能下咽自汗不能倚息家人惶惶且極貧不能延診走乞孟英擬方挽救因以桂枝石膏旋復赭石杏仁厚朴黃芩半夏黃連通草為劑果覆杯而病若失張養之目擊嘆為神治噎氣豫素患噫氣凡體稍不適其病即至既響且多勢不可遏戊子冬發之最甚苦不可言孟英曰陽氣式微比喻衰落而濁陰上逆也先服理中湯一劑隨以旋覆代赭湯投之遂愈嗣後每發如法服之輒效後來發亦漸輕今已不甚發矣豫聞孟英常云此仲聖妙方藥極平淡奈世人畏不敢用殊可陋也袁某患噫聲聞於鄰俞某與理中湯暨旋覆代赭湯皆不效孟英診之尺中虛大乃詰之曰爾自覺氣自少腹上衝乎病者云誠然孟英曰此病在下焦用胡桃肉故紙韭子菟絲小茴鹿角霜枸杞當歸茯苓覆盆龍齒牡蠣服一劑其沖氣即至喉而止不作聲為噫矣再劑寂然多服竟愈許太常滇生之夫人患腰腿痛而素多噫氣或指頭一搓或眉間一抹其噫即不已向以為虛在都指京城時服補藥竟不能愈冬間旋里孟英診脈弦滑乃痰阻於絡氣不得宣也以絲瓜絡竹茹旋覆橘絡羚羊角茯苓豆卷金鈴柿蒂海虴荸薺藕肉為方吞服當歸龍薈丸而安厄逆朱浦香年五十六幼患童勞繼以吐血三十外即絶欲得延至此而平素便如羊矢其血分之虧如是今秋陡患厄忒連服滋鎮溫納之藥勢瀕於危延孟英診視脈至弦滑搏數苔黃厚而膩口苦溺赤主大劑涼潤如雪羹蔞仁竹瀝枇杷葉葦莖元參紫菀射干兜鈴菖蒲等多劑連下赤矢始瘳如此衰年虛體尚因痰熱致厄故虛寒之厄殊不多見嘔吐陳芰裳之太夫人陡患嘔吐徹夜不止次早延孟英診之自述因寒而致孟英知芰裳進場家無主藥之人若明言屬熱必致畏藥不服漫應曰固寒也而疏方則以黃芩黃連梔子川楝等以大苦寒為劑投之良愈趙子善令嬡患發熱嘔吐口渴便祕而年甫三齡不能自言病苦孟英視其舌微絳而苔卻干黃因與海虴鼠矢竹茹知母花粉杏仁貝母山梔石斛之藥二劑果下未化宿食色醬黏膩設投俗尚豫溫燥消散法必致陰竭而亡繼往維揚孟英臨別贈言謂其體質勿宜溫補次年患病果為參術殞命惜哉朱湘搓令郎留耕忽於飽食後大吐而厥冷汗息微急延孟英視之厥甫回而腹痛異常口極苦渴二便不行脈來弦緩乃痰滯而熱伏厥陰肝氣無從疏泄也投雪羹梔子楝實元胡蓯蓉吳萸黃連橘核旋覆竹茹蘆蔔汁之藥一劑痛減再服便行而愈霍亂上古無痘至漢始有今時罕有不出痘者以生齒日繁地氣日熱所以古人最重傷寒而今世偏多溫熱也於此日上海病因尤為貼切地氣以日熱穢氣亦日盛若伏暑欲發客邪外入兩邪交訌腸胃乃亂故氣道立時閉塞血脈因而瘀滯四肢厥冷手面皆黑陽明多氣多血之經見證若是之驟者非氣血忽然枯稿也夫人氣以成形耳氣不流行血肉即死故初起亟宜開閉俾氣通血活邪得外泄則正氣自復昧者不知邪閉血凝熱深厥深之理見其肢冷脈伏即以為寒又疑為脫既不敢刺更投熱藥使邪無宣泄愈閉愈冷雖七竅流血而死亦不悔悟亦有邪閉而正氣無以自容而外脫者陽從上脫則汗多而氣奪陰從下脫則瀉多而液亡所謂內閉外脫也欲其不外脫必開其內閉如紫雪絳雪行軍散皆開閉透伏之良方也而飛龍奪命丹即合行軍絳雪二方而加峻者且有人中白引濁下行尤具斬關奪命之能丁酉歲八九月間杭州盛行霍亂轉筋之證沈氏婦夜深患此繼即音啞厥逆比曉孟英診其脈弦細以澀兩尺如無口極渴而沾飲即吐不已足脛堅硬如石轉時痛楚欲絶乃暑濕內伏阻塞氣機宣降無權亂而上逆也為仿金匱雞矢白散例處蠶矢湯一方令以陰陽水煎成候涼徐服此藥入口竟不吐外以燒酒令人用力摩擦其轉戾堅硬之處擦及時許鬱熱散而筋結始軟再以鹽滷浸之遂不轉戾吐瀉漸止日晡即下午三時至五時復與前藥半劑夜得安寐次日但覺困極耳與致和湯數服而痊後治相類者多人悉以是法出入獲效惟誤服附子者最難救療鄭鳳梧年六十餘秋間患霍亂凜寒厥逆煩悶躁擾口不甚渴孟英診之脈細欲伏苔白而厚乃暑濕內蘊未化也須具燃犀之照庶不為病所蒙因制燃照湯與之一飲而厥逆凜寒皆退脈起而吐瀉漸止隨以清滌法愈之陸叟年七十餘仲秋患霍亂自服單方二三日嘔吐雖已且頻頻作噦聲不甚揚面赤目閉小便不通孟英視之脈雖虛軟並無脫象況舌赤而干利下臭惡此證乃氣分伏暑業擾及營慮其絡閉神昏胡可再投熱劑遂以紫雪丹三分用竹茹枇杷葉通草丹參連翹石菖蒲桔梗黃芩蘆根煎湯候冷調而徐服次日復診目開噦止小溲稍行於前方裁去紫雪加石斛苡仁服二劑利減能啜米飲矣隨用致和湯十餘服而瘳一婦年少體瘦初秋患霍亂轉筋舌絳目赤大渴飲冷脈左弦強而右滑大此肝胃之火素盛而熱復侵營也以白虎湯去粳米甘草加生地蒲公英益母草黃柏木瓜絲瓜絡薏苡仁一劑知二劑已丹溪云轉筋由於血熱此證是矣紀運翔年十七五月患霍亂勢亦垂危孟英往視然已手面皆黑目陷睛竄厥逆音嘶脈伏無溺舌紫苔膩大渴汗淋神情瞀亂危象畢呈時未交芒種暑濕之令未行仍是冬寒內伏春令過冷入夏猶涼氣機郁遏不宣故欲變溫病者皆轉為此證殊途同歸但不腹痛耳以寒邪化熱究與暑濕較異也亟令刺曲池委中出血如墨方以黃芩為君臣以山梔豆豉黃連竹茹薏苡半夏佐以蠶矢蘆根絲瓜絡少加吳茱萸為使陰陽水煎候溫徐徐服之遂不吐次日脈稍起又兩劑黑色稍淡肘膝稍和反加睛赤煩躁是伏邪將從外泄也去吳萸蠶矢加連翹益母草滑石而癍發遍身苔始漸化肢溫得寐小溲亦行隨豫清搜化毒之藥多劑而痊名其方曰黃芩定亂湯嗣治多人悉以此法增損獲效有史客素吸洋煙而患此證與此方數貼後反便祕目赤渴汗昏狂亦是久伏之邪漸欲外越也與竹葉石膏湯加減而瘳此外濕盛者加茵陳滑石氣實者加枳殼桔梗飲阻食滯者加厚朴萊蔔肝鬱氣結者加紫蘇楝實口渴用茅根湯或藕汁頻灌王季傑妾秋夜陡患霍亂腹痛異常診其脈細數而弦肢冷畏寒蓋覆甚厚詢其口不渴而瀉亦不熱然小溲全無吐者極苦舌色甚赤孟英曰此新涼外束伏暑內發也以絳雪玉樞丹灌之皆不受瀉至四五次始覺漸熱而口大渴仍不受飲語言微謇孟英令搗生藕汁徐灌之漸能受隨以黃芩黃連薏苡楝實梔子竹茹桑葉石斛蒲公英煎服痛即減吐瀉亦止改用輕清法而愈陳嫗年已七旬辛亥秋患霍亂轉筋甚危亟拉孟英救之已目陷神消肢冷音颯脈伏無溺口渴汗多腹痛苔黃自欲投井此乃煩渴之極也令取西瓜汁先與恣飲方用白虎湯加黃芩黃連黃柏木瓜威靈仙略佐細辛分許為劑覆杯即安人皆疑用藥太涼何以徑效孟英曰凡夏熱亢旱之年入秋多有此證豈非伏暑使然況見證如是之熾烈乎今秋余已治愈多人詢其病前有無影響或曰五心煩熱者數日矣或曰別無所苦惟見物如紅如火已而病即陡發夫端倪如此更為伏暑之的據焉附一僕伕縱酒飲食無節患霍亂吐瀉轉筋煩渴等症幾殆時六七月霖雨晝夜飲簷流溜水數升而愈千金方云輕者水瘥此偶合古方余目見其事後路途中及六合縣見一人亦患此服新汲井水愈摘自陳修園醫書七十四種霍亂論錢某患霍亂自汗肢冷脈無平日貪涼飲冷人謂寒證欲用大劑熱藥孟英曰苔雖白然厚而舌邊絳且渴甚頭大痛不可因寒涼致病而不察其有暑熱之伏也遂以五苓散去白術加黃連厚朴黃芩竹茹木瓜扁豆葉服後脈稍出汗漸收吐利亦緩即去肉桂加桑枝滑石甘草頭痛吐利皆止苔色轉黃隨用清暑和中而愈丁姓患霍亂苔色白薄而不渴但覺口中黏膩彼自知醫欲從寒濕治孟英曰中焦原有寒濕所以不渴然而黏膩豈非暑入而釀其濕為熱乎以胃苓湯去甘草白術加苡仁黃連半夏枇杷葉二劑而瘳胡泉琴舅氏家之潘嫗年逾古稀患霍亂轉筋頻危孟英用自制蠶矢湯治之而瘳某老人霍亂後目閉厄忒醫謂陷脫在即擬與桂附回陽而未服孟英詢之得知溺赤口渴脈情軟數改與肅清肺胃之劑果得漸安段堯卿之太夫人患霍亂轉筋年逾七十孟英投自制連朴飲三啜而瘳陳楚珍媳陡患霍亂臍間貼以回陽膏而不效孟英按脈滑數右甚口渴苔黃令揣胸下果堅硬而痛曰吐瀉雖多食尚戀膈非寒證也回陽膏亟宜揭去以菖蒲枳實蘇葉黃連黃芩桔梗竹茹牛蒡海虴蘆蔔為劑一服而瘳王壽和甫六歲陡患凜寒身熱筋瘈面紅譫妄汗頻四肢厥冷苔色黃膩口渴唇紅孟英曰此時邪挾食也以枳實梔豉湯加菖蒲及冬干蘆蔔菜煎成湯調入玉樞丹五分灌之次日譫瘈皆減而腹痛吐瀉邪欲轉霍亂以外泄也孟英謂不但傷寒可轉霍亂溫熱暑濕皆可轉霍亂也治當迎刃而導之於前方加蘇葉一分黃連二分同炒煎服連吐三五次瀉六七次痛即減第三日神始爽慧然去疾莫如盡再服原方一劑遂愈凡小兒之病因於食滯者多胃不和則臥不安陽明實則譫瘈若吐瀉乃病之出路而世人動輒以驚風藥治之每致僨事錢某患霍亂兼吐蛔十餘條而口乾脈細是暑伏厥陰以犯中也以黃連烏梅竹茹川楝薏苡石斛蘇葉黃芩清之而愈陳某患霍亂而所下皆血苔黃大渴而舌色紫黯乃暑毒深伏起病時又飲燒酒也用犀角益母地丁茅根菖蒲緑豆銀花黃芩黃連黃柏藕汁大劑灌之投匕而瘥李華甫繼室陡患霍亂兼溺血如注頭痛如劈自汗息微勢極危殆速孟英診視脈甚弦駛曰此肝火內熾暑熱外侵也以犀角木通滑石梔子竹葉薏苡銀花茅根菊葉為大劑和入藕汁送當歸龍薈丸吐瀉即已溺血亦減惟小便時頭猶大痛必使人緊抱其頭重撳其巔始可略耐尚是風陽僭極肺胃不清也以葦莖湯去桃仁加百合白薇元參小薊蒲公英竹葉西瓜翠衣蓮子心為方和入童溺仍吞當歸龍薈丸服旬日痊愈張二梅年逾六旬秋間患霍亂轉筋醫見高年而厥逆多汗擬進溫補張不敢服但用平淡單方及外治法而瘥然從此大便不堅時時自汗遍身瘡疥畏熱異常立冬後孟英診之脈甚滑數口渴苔黃便溺皆熱猶著夾衣是賦質偏陽濕熱內盛幸而未進溫補得以引年與大劑清化法漸愈某傳一方治遍身瘡疥頗佳以麻黃一兩川椒五錢蛇床子五錢斑蝥七枚雄豬油或柏油熬透去渣另用明礬黃柏各一兩萆麻子大楓子各四十粒共研細末調入油內絹包擦患處能拔蘊毒伏邪未出旬日可愈無後患比余孟英自稱火酒摩轉筋之義正同薑秋農瘧瀉初痊遽勞奔走陡患霍亂轉筋面臂色紫目陷音嘶胸悶苔黃汗多口膩神疲溲祕脈細而弦孟英以沙參蠶矢苡仁竹茹半夏絲瓜絡木瓜車前子扁豆葉陰陽水煎送左金丸一錢外以吳萸一兩研末鹽水調塗湧泉穴服後吐瀉漸止噫氣不舒厄忒脅痛汗減口燥脘下拒按脈軟而弦以素多肝鬱也去沙參蠶矢木瓜車前左金丸加紫菀鬱金楝實通草枇杷葉二貼後溲行厄止苔退足溫腰脹腿痛手紫漸淡去郁金紫菀木通川楝加沙參石斛蘭葉藕肉鮮稻頭亦二帖脈和脹減啜粥口咸體素陰虧也去半夏扁豆葉加歸身花粉橘皮又二帖大解行而安穀腰痠少寐為易西洋參加麥冬羊藿以調之數貼後又加枸杞杜仲而愈蔣循庵媳患霍亂轉筋交三日矣厥逆目竄膈悶無溺苔黃苦渴脈極弦細屢進桂附薑術氣逆欲死與昌陽瀉心湯加減煎成徐服外以吳萸研末滷調貼湧泉穴服二劑吐止足溫去紫蘇厚朴加川楝石斛蒲公英多劑獲痊蓋伏暑挾素盛之肝陽為病誤服溫補以致遽難廓清也戚媼者年六十餘矣自幼傭食杭州黃連泉家忠勤敏干老而彌甚壬寅秋患霍亂轉筋余孟英視之暑也投蠶矢湯兩帖而瘥三日後忽蜷臥不能反側氣少不能語言不食不飲蓮泉惶懼就近邀一老醫診之以為霍亂皆屬於寒且昏沉欲脫定附子理中湯一方蓮泉知藥猛烈不敢遽投商之王君安伯安伯云且忽服也若謂寒證則前日之藥下咽即斃吐瀉安得漸止乎蓮泉大悟乃著人飛刺招余往勘余曰此高年之體元氣隨吐瀉而虛治宜用補第余暑未清熱藥在所禁耳先清後補緩急之間此中須大學問若在孟浪之人必以前之涼藥為未當今日溫補為極是縱下咽不及救亦惟歸罪於前手寒涼之誤也設初起即誤死於溫補而舉世亦但知霍亂轉筋是危險之病從無一人知此證有陰陽之異治法有寒熱之殊而一正其得失者此病之所以不易治而醫之所以不可為也今蓮泉見薑附而生疑安伯察病機之已轉乃以朝鮮參麥冬知母葳蕤木瓜扁豆石斛白芍苡仁甘草茯苓等服六劑始能言動漸進飲食調理月餘而健此餘熱未清正氣大虛者之治法更有不因虛而余焰復燃者須用煉雄丹治之詹耀堂子年二十患霍亂服薑桂數劑瀉不止素吸鴉片煙疑為虛漏補之瀉益甚孟英視之大渴而脈弦數因為起病不因暑熱然陰分素虧雖飲冷貪涼熱藥豈堪過劑設無便瀉以分其藥力則津液早枯矣與白頭翁湯合封髓丹加銀花緑豆石斛一劑知二劑已蔣敬堂母年七十四陡患嘔瀉身熱腹痛神思不清孟英診之脈微弱而數曰暑脈自虛不可以高年而畏脫然辛散痧藥則不免耗傷其津液爰定黃芩黃連滑石石斛竹茹黃柏銀花竹葉橘皮枇杷葉之方冬瓜湯煎一劑而熱退神清再劑霍然王某久患吐血體極孱弱沈琴癡囑其丐孟英治之服藥甫有小愈而酷暑之時陡患霍亂轉筋大汗如雨一息如絲孟英視之曰陰血久奪暑熱鴟張吾霍亂論中之缺典也姑變法救之用北沙參枇杷葉龍骨牡蠣木瓜扁豆苡仁西滑石桑葉蠶砂石斛豆卷投之良愈嗣後每日調理仍服滋補以治宿恙閲二載聞服溫補藥致血暴湧而亡周鑅於七月十八日夜患霍亂轉筋甚劇倉促間誤服青麟丸錢許比曉急邀孟英診之脈微弱如無耳聾目陷汗出肢冷音啞肌削危象畢呈藥恐遲滯因囑其母先煎高麗參湯亟為接續隨以高麗參白術白芍茯苓附片肉桂乾薑木瓜苡仁扁豆蓮實為方一劑各症皆減次日復診孟英曰氣分偏虛那堪吐瀉之奪泄誤餌苦寒陽微欲絶昨與真武湯理中丸合法脾胃之陽復辟矣剛猛之品可以撤去蓋吐瀉甚而津液傷筋脈失養則為之轉薛生白比之痙病例可推也凡治轉筋最要顧其津液若陽既回而再投剛烈則津液不能復而內風動矣此治寒霍亂之用桂附亦貴有權衡不可漫無節治致墮前功也即於前方裁去干薑附片肉桂加黃耆石斛服至旬日而愈余周鑅自稱謂此番之病危同朝露若非孟公恐不能救常聞張柳吟云但使病者聽孟英論病之無微不入用藥之無處不到源源本本信筆成章已覺疾瘳過半古云檄愈頭風良有以也己丑年五月天氣驟熱孟英母陡患霍亂肢冷自汗脈微苔白腹大痛欲重按是中虛有素因熱而受寒侵也進大劑理中湯加桂枝白芍覆杯而愈此所謂舍時從證也褚子耘使女患此已身僵矣孟英以奪命丹二分囑其灌入頃刻活動隨以解毒活血湯數服得生一人孟英治愈後已溺行能食餘熱外泄滿面赤瘰忽然神氣瞀亂而死一人孟英治愈二便已如常矣越數日云飲食不得下戴眼厄忒而逝一人業已向愈忽然神情恍惚藥不及救陳解香弟患此垂危孟英治愈遂不服藥月餘復來請勘已咽痛礙進水穀頤腫牙糜牙關甚緊痰嗽脅痛溺赤管痛便溏色醬此餘毒蘊隆失於清解脈已弦緊數疾莫可措手並録以告賈旅者沈春泉年五十七立冬前五日食蟹面後陡患霍亂轉筋所吐瀉者皆水初進桂附藥筋轉益甚周身微汗神倦懶言指漸冷脈漸伏時欲太息更方用牡蠣一兩龜板八錢阿膠四錢服後勢較劇孟英視之苔黃大渴小便全無瀉出極熱心下拒按曰此伏暑挾食之證不知何所見而與燥補澀膩之藥嗣聞其次郎於立冬後亦患此證醫知伏暑用黃連等藥吐瀉已止因脈未遽起不知為伏暑未清改投桂附等三帖而亡尤可哀也陳藝圃亦知醫其室人於仲秋患霍亂轉筋自診以為寒也投熱劑勢益甚招朱椒亭視之亦同乎主人之見也病尤劇乃延孟英決之曰此寒為外束之新邪熱是內伏之真病口苦而渴薑附不可投矣與河間法謂表裡雙解清熱育陰之法人皆不信也再與他醫商之仍用熱劑卒至口鼻出血而死極其悔嘆始服孟英之卓識余謂霍亂一證近來時有而醫皆不甚識得清楚死於誤治極多孟英特著專論雖急就成章而辨晰簡當略無支漏實今日醫家首要之書以其切於時用不可不亟為熟讀而研究哉羅吉人立冬前患霍亂轉筋某知其陰分素虧病由伏暑服藥已得轉機數日後漸有厄忒孟英視之脈弦數左甚苔焦而渴齦衄脘悶便溏色醬小便短赤皆伏暑未清氣機阻塞之象既失清肅當臍尚貼回陽膏屢囑揭去不從後聞不起石雨田母年近五旬陡患霍亂轉筋苔黃大渴神情煩躁證屬伏暑脈頗不惡而渾身冷汗搖煽不停已為陽越之象不敢與方尋即告殞朱巽泉父年以六旬患霍亂轉筋證不甚劇問答音清而脈微欲絶亦決其不治已而果然某丙夜指午夜患此證刺出黑血侵曉孟英往視形脈兩脫大汗如淋目陷音嘶溺無苔膩平素嗜飲少谷好善忘勞此暑濕蘊中正氣潰散勉投參藥竟不能救方氏女播遷三載秋抵申患腫因在旅寄竟不調治交霜降腫忽消不數日又患霍亂即神氣瞀亂屋中盤走口呼姊姊乃姊強納之臥兩目轉旋不停淚涔涔下牙關即緊欲延孟英診竟不及也孟英曰此流離困苦憂鬱深沉木土相乘吐瀉而腫節交霜降氣肅腫消郁無所宣直凌脾胃吐瀉陡作木火勃升狂走目張陽從上越此情志內傷霍亂也故告危如是之速徐氏素無病胃亦強且善作勞夜分忽瀉二次晨起為孟英梳髮未畢又瀉一次因診之脈七至而細促不耐按略無病若此脈病人不病殆不始於今日不可救藥也既而瀉頗緩且食山東挂麵一小碗然尚能以乳哺女而既吸之後乳即癟塌陷而不起矣形亦漸削汗亦漸多脈亦漸脫音亦漸嘶戌刻遽逝及中氣卒然潰散絶無僅有之候也余抗一紙客在舟次病此至乞孟英診之已舌卷囊縮口開苔黑形脫神離不可救藥矣詢途中並未服藥諦思其故暑濕既可伏至深秋而發為霍亂則冬傷於寒者至春不為溫病亦可變為霍亂也雖為溫病之變證而溫即熱也故與伏暑為病不甚懸殊且細繹仲聖書亦未嘗不微露其意也如太陽與少陽合病自下利者與黃芩湯若嘔者黃芩加半夏生薑湯主之張石頑注云溫病始發即當用黃芩湯去熱為主若傷寒必傳至少陽熱邪入里方可用黃芩柴胡解之蓋黃芩湯乃溫病之主方即桂枝湯以黃芩易桂枝而去生薑以桂枝主在表之風寒黃芩主在裡風熱乃不易之定法其生薑辛散非溫熱所宜故去之此表裡寒熱之不可不知者也周禹載注云明言太少二陽何不用二經藥非傷寒也傷寒由表入里此則自內發外無表何以知或脅滿或頭痛或口苦引飲或不惡寒而即熱故不得謂之表也如傷寒合病皆表病也今不但無表且有下利里證傷寒協熱利必自傳經而入不若此之即利也溫何以即利其人中氣本虛內伏已深不能盡泄於外勢必下走利也孟英謂此論溫邪外發未久即可下走為利本文更有若嘔者句豈非溫病可轉霍亂早逗端倪於此乎曩纂溫熱經緯於此條下附注云少陽膽木挾火披猖嘔是上衝利由下迫何必中虛始利飲聚而嘔半夏生薑專開飲結如其熱熾易以黃連竹茹或問半癡曰既肝鬱於土而食不下行矣何以干矢自遺而不覺乎半癡謂胃與大腸原一氣相貫惟其食滯於胃而不化似與大腸氣不相貫故廣腸之宿糞出而不覺經云中氣不足溲便為之變是亦變也所謂不足者非言中氣虛也以中氣為病所阻則不足於降濁升清之職故溲便為之改常也因思霍亂之吐瀉無度乾霍亂之便閉不行皆變也皆中氣為病所阻而不足於降濁升清之職也設疑不足為虛則諸霍亂皆當補中氣為治矣此説與前釋邪之所湊其氣必虛之説可以互證八月初秋陽正烈姚歐亭初七日忽然身熱嘔瀉白苔滿布神憊不支腹痛汗頻音低溺澀先與人參黃連法半夏厚朴竹茹滑石苡仁蘇葉蠶砂扁豆葉二劑熱退神清而左脈仍弦關上高嘔酸無寐手足振惕客邪雖解土受木乘也去滑石厚朴蠶砂扁豆葉加茯神蛤殼紫菜緑豆白蔻仁三劑苔化能眠知飢瀉減去白蔻仁蛤殼加菖蒲白朮五劑而痊此霍亂之開闔失常中樞為邪所亂也前案之開闔無權中虛不能主持也同是一人先後一虛一實正可互勘至於前病愈後之嘔瀉振惕乃為風暑乘虛擾中之霍亂證朱鳴岐患下利轉筋醫見肢冷即投溫補服藥即吐既而厄忒不已溫補加峻病日以危延至九朝孟英按脈左至弦滑右弱不應指苔黃厚而膩濁小水不行臍上拒按因謂曰病原不重誤藥致劇命不應死幸而得吐與枳實桔梗黃芩黃連竹茹半夏紫蘇連翹蘆根枇杷葉滑石開痰行氣舒結通陽兩劑厄果止而遍身赤癍又二劑燥矢下而苔化溺行右脈漸振隨以清肅法調養而瘥此證若初治得法一二劑可愈舉世以瀉證吐證霍亂證霍亂轉筋證皆為寒證往往不察病情輒投熱藥今見肢冷而右脈軟弱彼方以為虛寒的據況服藥即吐厄忒隨來以為霍亂轉筋而見厄忒惶惶然以為虛脫之象故溫補日以加峻縱使一蹶不起病者無怨醫家不悔悟授受相承伎倆如是良可慨已此外如胸腹疼痛瘧疾哮喘經阻産後等證世俗亦多指為寒病雖以熱藥剎殺之不知厄忒則尤多枉死孟英嘗治一角妓患厄纍日此因破身太早固是虛證然血去陰傷豈可反以溫燥助熱遂至下焦不攝妓性畏藥用一味雞子黃連進數服而安泄瀉姚樹庭以古稀之年而患久瀉群醫雜治不效僉以為不起矣延至季秋邀孟英決行期行期二字此處作死亡解之早晚非敢望愈也孟英曰弦象獨見於右關按之極弱乃土虛木賊也調治得法猶可引年何以遽爾束手乎乃出從前諸方閲之皆主溫補升陽曰理原不背義則未盡耳如薑附肉蔻骨脂之類氣熱味辣雖能溫臟反助肝陽肝愈強則脾愈受戕且辛走氣而性能通泄與脫者收之之義大相刺謬而鹿茸升麻可治氣陷之泄而非斡旋樞機之品至熟地味厚滋陰更非土受木克脾失健行之所宜縱加砂仁酒炒終不能革其膩滑之性方方用之無怪乎愈服愈泄徒藉景嶽窮必及腎為口實也與異功散加山藥扁豆蓮子烏梅木瓜芍藥蒺藜石脂餘糧服之果效恪守百日竟得康強越三載以他疾終某人患晨瀉有年纍治不效春間尤甚孟英按其脈曰汝雖苦於瀉而瀉後腹中反覺舒暢乎曰誠然苟不泄瀉又脹悶減食矣而服四神附桂之藥其瀉必加此曷故也曰此非溫升補澀之證乃肝強脾弱木土相凌處一方令其常服數帖即安復竟無此恙也方用白朮苡仁黃連楝實桂枝茯苓木瓜芍藥蒺藜橘皮而已孔廣愚司馬久患溏瀉而舌黑氣短自春徂作往字解冬治而不愈孟英視之曰勞心太過陽爍其陰人見其溏瀉輒與溫中不知肺受火型氣失清肅而短促於上則水源不生自然溺少而便瀉矣投以肅肺清心涼肝滋腎之法果得漸瘳楊氏婦孀居患瀉久治不瘥孟英曰風木行刑胃也彼不之信另招張某大進溫補乃至腹脹不食夜熱不眠吐酸經祕頭痛如劈復乞孟英視之先投苦泄佐辛通以治其藥嗣以酸苦熄風安胃匝月乃瘳續與調補汛至而康方氏女久患泄瀉脘痛間兼齒痛汛事不調極其畏熱治不能愈上年初夏所親崔映溪為延孟英診之體豐脈不甚顯而隱隱然弦且滑焉曰此肝強痰盛耳然病根深錮不可再行妄補渠母云溏瀉十餘年本元虛極廣服培補尚無寸效再攻其病豈不可虞孟英曰非然也今之醫者每以漫無著落之虛字括盡天下一切之病動手輒補舉國如狂目擊心傷可勝浩嘆且所謂虛者不外乎陰與陽也今肌肉不瘦冬不知寒是陰虛乎抑陽虛乎只因久瀉遂不察其脈證而僉疑為虛寒之病矣須知痰之為病最頑且幻益以風陽性尤善變治必先去其病而後補其虛不為晚也否則養癰為患不但徒弗參藥耳母不之信遍訪醫療千方一律無非補藥至今秋頸下起一痰核黃某敷之始平更以大劑溫補連投百日忽吐泄膠痰鬥余而亡豫按此痰飲滋蔓木土相仇久則我不敵彼而潰敗決裂設早從孟英之言斷不遽死於今日也康康侯司馬之夫人泄瀉頻年納食甚少稍投燥烈咽喉即痛經治多手不能獲效孟英診曰脾虛飲滯肝盛風生之候也用人參白術橘皮半夏桂木茯苓楝實白芍木瓜蒺藜投之漸愈今冬又患眩暈頭汗面熱肢冷心頭似絞呻吟欲絶孟英以石英蓯蓉牡蠣緑萼梅茯苓蒺藜楝實白芍旋覆為方竟劑而康陳某偶患溏瀉所親鮑繼仲云余往歲患瀉治不中肯延逾半載幾為所困今秋患此服孟英方數劑霍然故服藥不可不慎也盍延孟英視之陳因中表二人皆知醫招而視之以為省便輒投以溫補健脾之藥數日後瀉果減而發熱昏痙咽喉黑腐其居停瞿穎山疑病變太速囑其請援於孟英孟英診曰遲矣病起泄瀉何必為寒正是伏邪自尋出路而溫補以固留之自然內陷厥陰不可救藥果即殞焉繼有高小垞孝廉令弟雨生因食蟹患瀉黃某用大劑溫補藥瀉果止而頸筋痠痛舌絳嘔渴口氣甚臭孟英持脈沉數曰食蟹而後瀉會逢其適耳脈證如斯理應清潤奈人自畏涼藥復質於吳某亦主溫補服及旬日昏痙舌黑而斃吳蘊香孝廉令孫兌官患發熱洞瀉大渴溲少涕淚全無孟英曰暑風行於脾胃也以沙參生薏苡生扁豆銀花石斛滑石甘草竹葉冬瓜皮澄地漿煎服數日而痊按此等證幼科無不作驚風治因而夭折者多矣沈辛甫善岐黃之學其妻體素弱而勤於操作年逾四秩汛事過多兼以便溏冷汗氣逆參耆屢進病日以危孟英診曰心脾之脈尚有根猶可望也與龍骨牡蠣龜板鱉甲海螵蛸石英餘糧石熟地茯苓為方一劑轉機漸以向愈某新秋陡患洞瀉如注即渾身汗出如洗懨懨一息孟英往勘脈來沉細身不發熱儼似虛寒之證惟苔色黃膩小溲全無乃濕熱病也與桂苓甘露飲加厚朴投匕而瘳慎氏婦産後腹脹泄瀉面浮足腫醫與滲濕溫補月餘不效疑為蓐損孟英視之舌色如常小溲通暢宛似氣虛之證惟脈至梗澀毫無微弱之形因與丹參滑石澤蘭茯苓茺蔚蛤殼桃仁海虴五靈脂豆卷數月即瘥葉杏江仲郎患發熱泄瀉醫治十七日不效骨瘦如柴音嘶氣逆所親許芷卿薦孟英診之脈數大渴汗多苔黃以竹葉石膏湯加減十餘劑漸以向愈大便反極堅燥繼豫滋養而康姚歐亭初夏偶患大瀉後苦脾約更旬始一更衣既而匝月一行極其艱滯而先硬後溏汗出神憊年逾六秩步履蹇滯雖廣服人乳及潤導諸藥率不效間或納食如哽嘔吐酸辣六脈遲軟苔色白潤不渴小便清長腹無脹痛此中氣不足溲便為之變也豈腸燥便祕可以潤藥濡之哉既不宜潤更不可下以中虛開闔無權恐一開而不復闔將何如耶亦不可升提蓋吐酸食哽已形下祕上衝之勢又素吸洋煙設一闔而竟不開又將何如耶爰以人參菊花半夏旋復白芍雞金木瓜枇杷葉為方服六劑更衣兩次解四彈丸又三劑解出十五六丸又三劑下九丸而始暢並不堅燥亦無溏矢毫不怯力是藥證已符為留調理法而別設或吐酸食哽則暫用人參黃連橘皮半夏旋復竹茹蘇葉枇杷葉紫石英以清肅鎮熄之孟英次女八月草三日忽患痛瀉肢冷脈伏崔某進附子理中湯加減瀉不止而苔黑唇燥頗露熱象改投犀角石斛生脈散等藥形漸脫又用桂附八味湯遂於八月草九日舌焦如炭而逝噫據此病情是伏暑也痧證霍亂挾食者必先去食傷寒亦然秦氏論之詳矣然竟有病始飽食之餘初非因食為患者半癡孟英別號半癡嘗云既無枵腹待病之理豈可專以攻消為治故臨證必審問慎思而明辨之庶免顢頇貽誤之弊痢疾金魁官九月間患五色痢日下數十行七八日來口噤不納腹痛呻吟危在旦夕矣孟英視之曰暑挾食耳誤服熱藥矣攻補皆不可施也輕清取之可即愈焉以北沙參黃連鮮蓮子梔子黃芩枇杷葉石斛扁豆銀花桔梗山楂神麯滑石為方覆杯即安孟英嘗曰蓮子最補胃氣而鎮虛逆若反胃由於胃虛而氣衝不納者是皆熱邪傷其胃中清和之氣故以黃連苦泄其邪即仗蓮子甘鎮其胃鮮蓮子清香不渾鎮胃之功獨勝附録孟英玉芝丸豬肚一具治淨以連子去心入肚內水煎糜爛收干搗為丸服凡胃氣薄弱者常服玉芝丸令人肥健朱某患痢于越表散蕩滌滋膩等藥備嘗之矣勢瀕於危始返杭乞孟英診之神氣昏沉耳聾脘悶口乾身熱環臍硬痛異常晝夜下五色者數十行小溲澀痛四肢抽搐時時暈厥曰此暑熱之邪失於清解表散蕩滌正氣傷殘而邪乃傳入厥陰再以滋膩之品補而錮之遂成牢不可拔之勢正虛邪實危險極矣與白頭翁湯加山梔黃芩銀花白芍楝實蓯蓉石斛桑葉羚羊角橘葉牡蠣海虴鱉甲雞內金等藥大劑頻灌一帖而抽厥減半四帖而抽厥始熄旬日後便色始正溲漸清長粥食漸進半月後臍間之硬始得盡消改用養陰調理逾月而康朱念民患泄瀉自謂春寒偶薄而飲燒酒次日轉為滯下左腹起一痞塊痢時絞痛異常孟英曰陰虛木燥侮胃為瀉誤飲火酒怒木愈張非寒也亟屏辛溫之物用白頭翁湯加黃芩川楝梔子黃連海虴銀花草決明枳椇子緑豆皮十餘劑而愈汪左泉患滯下日夜數十行而即日須補歲考遺材浼孟英商速愈之策孟英切脈弦滑黃苔滿布曰易事耳重用黃芩黃連佐以山楂厚朴服青麟丸四錢投匕而痊陳晝三病滯下某進通因通用法痛泄無度嘔惡不納汗出息微脈弱眩暈孟英曰近多伏暑之痢此獨非其證也元將脫矣急投大劑溫補脈候漸安一月後甫得健復高若舟之庶母年逾花甲體豐善瀉張某向用參術取效今秋患白痢張謂寒濕滯中仍與理中湯加減病遂日增因疑老年火衰蒸變無權前藥中復加附子白痢病果減而腹脹且痛不食不溺噦逆發熱勢已危殆始迓孟英視之脈沉而滑數梗梗曰暑熱未清得毋補藥早投乎與黃芩黃連杏仁厚朴橘紅神曲白芍滑石川楝銀花海蛇雞內金之類一劑溺行痛減而痢下仍白其女為屠西園之室乃云向服補藥白痢已止今服涼藥白痢復作蓋病本久寒涼藥不可再用矣孟英曰言頗近理使他醫聞之必改溫補但病機隱伏測識匪易前此之止非邪淨而止之止乃血得補而不行之止邪氣止而不行是以痛脹欲死夫強止其痢遽截其瘧猶之乎新産後妄澀其惡露也世人但知其惡露之宜通而不知間有不可妄通者但知瘧痢之當止而不知邪未去而強止之其害較不止為尤甚也今邪未清滌而以溫補藥壅塞其流行之道以致邪不能出逆而上衝噦不能食此痢症之所畏吾以通降涼潤之劑搜邪掃濁惟恐其去之不速胡反以白痢復作為憂豈欲留此垢滯於腹中冀得化脂膏而填空隙何若是之寶惜而不願其去耶幸若舟深信竟從孟英議尋愈戚嫗病痢某醫以其高年用舍病顧虛之法為治漸至少腹結塊攻痛異常大渴無溺杳不知飢晝夜百餘行五色並見呼號欲絶孟英診之脈至沉滑而數因謂曰縱然暑濕深受見症奚至是耶此必溫補所釀也夫痢疾古稱滯下明指欲下而滯塞不通顧名思義豈可以守補之品更滯其氣燥烈之藥再助其虐現少腹聚氣如瘕痢症初起因於停滯者有之今見於七八日之後且時欲沖逆按之不硬則顯非停滯之可擬實為藥劑之誤投察前諸方果是參朮薑萸附桂粟殼故紙川椒烏梅等一派與病刺謬之藥是但知年老元虛不聞邪實則實幸未嘔噦尚可希冀一二遂與蓯蓉川楝白芍黃芩黃連橘皮石斛山楂神曲延胡緑萼梅鱉甲雞內金鼠矢海虴出入互用數帖漸安十八澗徐有堂室病痢醫作寒濕治廣服溫補之藥痢出覺冷遂謂沉寒改投燥熱半月後發熱無溺口渴不飢腹痛且脹巔痛不眠翁嘉順囑其求診於孟英察脈弦細沉取甚數舌絳無津肌肉盡削是暑熱膠錮陰氣受爍與北沙參肉蓯蓉黃芩石斛楝實白芍銀花桑葉丹皮阿膠合白頭翁湯為劑次日各恙皆減痢出反熱有堂不解問何以故孟英曰熱證誤投熱藥熱結而大便不行者有之或熱勢奔迫而泄瀉如火者有之若誤服熱藥而痢出反冷者殊不多見也無怪醫者指為久伏之沉寒吾以脈證參之顯為暑熱然暑熱之邪本無形質其為滯下也必挾身中有形之垢濁故治之之道最忌補澀壅滯之品設誤用之則邪得補而愈熾濁被壅而愈塞耗其真液之灌溉阻其正氣之流行液耗則出艱氣阻則覺冷大凡有形之邪皆能阻氣機之周流如痰盛於中胸頭覺冷積滯於腑臍下欲尉之類皆非真冷人不易識吾曾治愈多人矣徐極歎服仍議育陰滌熱病果漸瘳管氏婦自去秋患赤痢多醫罔效延至暮春孟英診脈弦數苔黃渴飲腹脹而墜五熱夜甚用白頭翁湯合金鈴子散加黃芩白芍梔子石斛吞駐車丸浹旬而愈朱浚宣令堂患滯下醫聞白色而豫升提溫補旬日後肢冷自汗液脫肛墜群醫束手慮其虛脫因浼濮樹堂乞診於孟英曰藥誤耳與大劑行氣蠲痰清肺之藥果漸吐痰而痢愈又其令弟同時患此五色並見神昏肢搐大渴莖腫腹痛夜熱危險異常孟英察脈細數與白頭翁湯加犀角生地銀花石斛楝實延胡黃芩黃連滑石丹皮木通甘草梢等藥三帖後熱退神清溺行搐止乃去犀角甘草梢丹皮滑石木通加砂仁拌炒熟地山楂炭服之漸安半月而愈盛犀林廣文之僕患血痢自秋徂冬半年罔效孟英察脈細弱而口乾腰膝痠痛豫鹿角霜蓯蓉枸杞杜仲菟絲續斷血餘木瓜赤石脂砂仁末炒熟地黃十餘劑而痊丙午春高漢芳患滯下色醬日數十行年已七十七歲自去秋以來漸形疲憊即服補藥馴致見痢黃某徑用溫補勢乃劇延孟英診之右脈弦細芤遲口渴溲澀時時面赤自汗乃吸受暑邪誤作虛寒治幸其所稟極堅尚能轉痢一誤再誤邪愈盛而正反虛矣以白頭翁湯加人參白朮銀花黃芩白芍楝實石斛延胡二劑即減五劑而安繼豫調補竟得霍然後三載以他疾終葉晝三侄女適朱氏上年四月分娩七月患赤痢其家謂産後之病不敢服藥延至今春肌消膝軟見食欲嘔晝三迓孟英診之左細軟右滑數伏暑為病幸未誤藥與沙參陳倉米當歸白芍續斷木瓜扁豆黃連石斛石蓮荷蒂柿蒂枇杷葉橘皮為方送駐車丸而愈孫心言以七十之年患滯下胡某知為暑熱以青麟丸下之治頗不謬繼則連投蒼朮厚朴法夏葛根等藥漸至咽痛口糜厄忒噤口諸醫進補其勢孔亟伊壻童秋門迓孟英診之右脈滑數上溢身熱面赤溲澀無眠體厚痰多時欲出汗在痢疾門中固為危候第以脈證參之豈是陽虛欲脫實由升散溫燥之劑燥爍其陰肺胃之氣窒塞而不能下行也與大劑肅清之藥一劑知二劑已隨以生津藥溉之痢亦尋愈莊芝階舍人之外孫汪震官春前陡患赤痢孟英診之脈滑數而沉面赤苔黃手足冷過肘膝當臍硬痛小溲澀少伏熱為病也與大劑黃芩黃連山梔楝實滑石丹皮砂仁延胡楂肉神曲銀花草決明等藥兩服手足漸溫而腳背紅腫起疱如蒲桃葡萄大一二十枚四服後腹痛減苔退而渴於原方去楂肉神曲砂仁加白頭翁赤芍海虴旬日後痢色轉白而疱潰黃水而平穀食遂安改用養胃陰清餘熱之法而愈聞孟英治此證每劑銀花輒用至兩許尚須半月而瘳設病在他家焉能如此恪信苟遇別手斷無如此重劑況在冬春之交誠古所未有之痢案後人恐難企及一叟患滯下色白不黏不飢不渴腹微痛而不脹孟英切脈遲微進大劑真武湯加人參而愈吳爾純八月下旬患滯下腹痛異常伊外祖許仲廉延孟英往診形瘦脈數而弦口渴音微溺澀乃陰分極虛肝陽熾盛伏暑為痢治法不但與寒例迥異即與他人之伏暑成痢者亦當分別用藥也與白頭翁湯加知母花粉銀花丹皮金鈴延胡沙參黃芩黃連服之次日復視痢減音開而右腹疼痛拒按為加冬瓜子烏藥鼠矢三劑而消滯下亦愈惟薄暮火升面赤自汗重加介類潛陽而痊徐氏婦懷妊患痢醫投溫補胸腹痛極昏厥咽糜水飲礙下孟英診之脈洪數舌絳燥亟吹錫類散灌以犀角石膏元參知母花粉竹瀝麥冬銀花梔子石斛旋覆青蒿白薇等大劑投之神氣漸清旬日後各恙始平繼去犀角加生地服二月痊愈謝再華請孟英治乍浦人滯下證晝夜百餘行不飢不渴而欲嘔腹痛上及於心胸切其脈頗平和是寒濕也與時行暑濕痢大相徑庭投干薑肉桂吳萸厚朴之劑數服霍然王瘦石夫人患滯下腹痛微嘔不飢口苦溲短耳鳴孟英診曰脈見細弱之形肌無華澤之色汛不行而早斷舌紫黯以無津是素質陰虧情懷悒鬱二陽默熾五液潛消雖吸暑邪莫投套藥與白頭翁湯加雪羹銀花梔子楝實數劑而減繼去雪羹加生地蓯蓉柿餅藕汁而安改授甘草小麥大棗加西洋參生地蓯蓉竹茹當歸芍藥葡萄乾而以藕湯煎服調養體質以痊王葦塘患滯下醫投枳實厚朴檳榔楂肉之藥數服後肢冷自汗杳不進谷脘悶腹痛小溲牽疼舉家惶惶孟英視脈細澀舌絳無津是高年陰虧伏暑傷液況平昔茹素胃汁不充加以燥熱之藥津何以堪因與沙參銀花蓯蓉白芍石斛木瓜甘草楝實扁豆花鮮稻根數劑痛悶漸去汗止肢溫乃加生地阿膠麥冬柿餅葡萄乾等以滋之居然而痢止餐加惟舌色至匝月始津潤復常陰液之難充也如此沈緩齋令堂患滯下色白醫豫溫運病勢日劇腹脹昏瞀湯飲不下孟英診為伏暑用黃芩黃連滑石厚朴等藥沈疑高年且素患脘痛豈可輒用苦寒孟英再四剖陳始服半劑病果大減不數帖即愈按此等證甚多奈執迷不悟者雖剴切言之不能解其惑亦可哀也已曹泳之二尹將赴代理昌化任而瘧痢並作寒少熱多滯下五色迎孟英視之面垢苔黃乾嘔口渴痛脹溺赤汗出神疲脈至洪數不清與大劑黃芩黃連滑石厚朴知母花粉銀花石膏連翹竹茹等藥投匕即減三服而起便祕沈東屏年逾八秩患腹脹便祕孟英診曰耄古稱九十歲年脈實天畀作給豫解此處引申作先天秉賦解獨厚症屬陽結法宜清火豫西洋參石膏白芍知母花粉桑皮橘皮枳殼甘草送更衣丸四劑而愈設投別藥勢必遷延而敗然而即使被誤藥而敗人亦謂其天年之得盡斷不料其藥治之誤也後四年始歿夏間王湘筠明府因食肉病脹醫謂老年氣弱火衰輒投溫補直至腹如抱甕始延孟英視之彌留已極不可救藥矣高氏婦因戒鴉片煙而服外洋丸藥諸無所苦惟便祕不通醫治兩月迄不能下仍能安穀而面赤齦脹欲挑每以銀針嵌入齒縫而拔出時銀色已如煤黑孟英診脈滑數與犀角石膏芒硝大黃升麻蜣螂為劑和以鮮銀花汁一杯服後夜間登圊三四行而病去及半再與清解化毒而痊黃履吉患痛嘔吐孟英已為治愈仲冬復發他醫藥之已七日不進谷矣二便祕澀形肉遽消再托孟英診之與旋復赭石竹茹茯苓吳萸黃連柿蒂楝實延胡等藥一劑知三劑愈脫肛高若舟之庶母患脫肛孟英脈之弦而滑溲澀苔黃曰雖屬高年非虛證也清其濕熱而痊東垣云中年以後已行降令清陽易陷升舉為宜吾師趙菊齋者年逾花甲偶因奔走之勞肛翻患痔小溲不行醫者擬用補中益氣湯及腎氣丸等法孟英按其脈軟滑而數苔色膩滯曰此平昔善飲濕熱內蘊奔走過勞邪乃下注想由其強忍肛墜之勢以致膀胱氣阻溲澀不通既非真火無權亦拒清陽下陷師聞而嘆曰論證如見肺肝雖我自言無此明切也方以車前通草烏藥延胡梔子橘核金鈴子澤瀉海金沙調膀胱之氣化而滲水服之溲即漸行改用防風地榆丹皮銀花荊芥槐蕊石斛黃連當歸清血分之熱而導濕肛痔亦平設不辨證而服升提溫補之方則氣愈窒塞濁亦上行況在高年告危極易瘧疾海陽趙子升辛卯夏病瘧急延孟英診之曰暑熱為患耳不可膠守於小柴胡也與白虎湯一啜而瘥甲午秋範麗門患溫瘧孟英用白虎加桂枝以痊之丙申夏盛少云病濕熱瘧孟英以白虎加蒼朮湯而安己亥夏豫舅母患瘧服小柴胡藥湯二三帖後汗出昏厥妄語遺溺或謂其體質素虛慮有脫變勸服獨參湯幸表弟壽者不敢遽進乃邀孟英商焉切其脈洪大滑數曰陽明暑瘧也與傷寒三陽合病同符處竹葉石膏湯二劑而瘳庚子夏滇人黃肖農自福清赴都道出武林患暑瘧孟英投白虎湯加西洋參數帖始愈辛丑秋顧味吾室人病疸瘧孟英亦主是方而效莊之階中翰張安人年逾花甲瘧熱甚熾孟英審視再四亦與竹葉石膏湯而安聞者無不驚異豫謂如此數證體分南北質有壯衰苟非識證之明焉能藥與病相當而用皆適宜哉癸巳秋余在婺患瘧大為醫人所誤初則表散繼則滋補延及月餘肌肉盡削寒熱不休且善嘔惡食溺赤畏冷乃買棹旋杭托孟英診視曰足太陰濕瘧也以不換金正氣散三啜而安石符生隨乃翁自蜀來浙同時患瘧醫者以小柴胡湯加薑桂投之不效改用四獸休瘧等法反致惡寒日甚穀食不進唯飲燒酒薑湯圍火榻前重裘厚覆胸腹痞悶喜以熱尉猶覺冷氣上衝頻吐稠黏痰沫延至臘初疲憊不堪始憶及丙申之恙因訪孟英過診脈沉而滑數苔色黃膩不渴便溏溺赤曰是途次所受之暑濕失於清解復以溫補之品從而附益之釀成痰飲盤踞三焦氣機為之阻塞所以喜得熱尉熱飲氣衝反覺如冰若不推測其所以然之故而但聞問在切脈之先一聽氣冷喜熱無不以為真贓現獲熟知病機善幻理必合參茲以脈形兼證並究其為真熱假寒自昭昭若揭矣豫大劑苦寒之藥以蘆蔔煎湯漸服漸不畏寒痰漸少谷漸增繼用甘涼善後喬梓皆得安痊汪吉哉久瘧不愈醫謂元氣已虛雜投溫補漸至肌瘦內燔口乾咳嗽寐汗溺赤飲食不甘孟英視之曰此熱邪逗留血分也與秦艽鱉甲散而瘳堂兄汪養余亦患瘧數月多醫療之罔效肌瘦自汗腰膝痠軟不能稍坐極其畏冷孟英曰此大虛證胡反不補猶以消導是何居心豫人參黃耆白術炙草熟地白芍五味杜仲山藥龍骨牡蠣桑枝大棗木瓜數十帖而起顧云垞體豐年邁患瘧於秋脈芤而稍有歇止孟英曰芤者暑也歇止者痰濕阻氣機之流行也大忌溫補以助邪氣及與清解蠲痰之法病不少減而大便帶血孟英曰暑濕無形之氣而平素多痰邪反得以盤踞頗似有形之病清解不克勝其任氣血皆受其滋擾必攻去其痰使邪無依附而病自去切勿以高年而畏峻藥伊侄桂生少府亦精於醫者聞之極口稱是遂以桃仁承氣湯加西洋參滑石黃芩黃連橘紅貝母石斛為方送礞石滾痰丸乃郎石甫孝廉云此藥在他人必畏而不敢服我昔年曾患暑濕證深悉溫補之不可輕試況高明所見相同更何疑乎經服二劑下黏痰汙血甚多瘧即不作仍以清潤法善後而康遂安余皆山二尹起復赴都道出武林而患瘧範某云春寒所致辛溫散之來某謂酒濕之疴治以五苓且雜參歸薑棗之類病乃日甚旬日後脘悶腹脹便祕氣逆躁渴自汗昏瞀不瞑亟迎孟英視之曰蘊濕固然惟溫風外襲已從熱化何必夏秋始有熱瘧耶清解之法十劑可安服之果效旬日徑瘥酷熱之際瘧疾甚行有儲麗波患此陸某泥今歲寒水司天濕土在泉中運又從濕化是以多瘧率投平胃理中之法漸至危殆伊表兄徐和圃薦孟英視之熱熾神昏胸高氣逆苔若薑黃溺如赭赤脈伏口渴不食不便曰舍現病之暑熱拘司氣而論治謂之執死書以困活人幸其體豐陰足尚可救藥然非白虎湯十劑不能愈也和圃然之遂以生石膏知母銀花枳實貝母黃連木通花粉竹茹黃芩杏仁石斛海虴竹葉等相迭為方服旬日瘧果斷外甥莊迪卿患瘧大渴而喜熱飲脘悶脈伏苔膩欲嘔孟英曰蘊濕內盛暑熱外侵法當清解然脈證如是乃痰阻氣道使然清之無益溫之助瘧宜以礞石滾痰丸先為開導服後痰出甚多脈即見弦滑而數嘔止胸舒苔形黃燥與石膏知母黃連杏仁知母厚朴杏仁橘皮半夏茯苓滑石石斛菖蒲花粉等藥而安莊曉村芝階姊夫之侄孫也館於金願谷舍人家病瘧孟英曰吸受暑熱清滌即瘳越數日瘧作甚劇目赤狂言汗如雨下居停大驚聞服涼劑疑為藥誤亟速孟英至正在披狂莫制之時按其脈洪滑無倫視其舌深黃厚燥心疑其另服他藥之故而撲鼻吹來一陳薑棗氣因詰曰得無服薑棗湯乎曰恣飲三日矣孟英即令取西瓜一枚劈開任病者食之方從白虎而生石膏用一兩六錢病即霍然逾六年以他疾亡陳仰山如君患瘧孟英連與清暑法病不少減孟英疑亦薑棗湯所致詢知果然亟令屏絶遂愈余如汪子寬魏之裳胡秋紉等暑瘧治案皆以白虎湯化裁案多不備載録此以待讀者之隅反焉何永昌孟英之與人其妻病瘧間二日而作乃母曰瘧不可服官料藥徑服箋方旬日後勢甚危永昌乞孟英救之脈沉細而數尺為甚口渴目不欲張兩腰收痛宛如錐刺寒少熱多心慌不能把握曰異哉病也此暑入足少陰之證喻氏所謂汗下溫三法皆不可行者若病在別家慮其未必我信病在汝室人而求診於我事非偶然也汝母云官料藥不可治瘧未識此語出於何書何人所創既官料之勿服則私料更不可妄試矣殊屬可嗤然是證若延他醫診治非表散即溫補不可謂非汝母之一得也疏方元參八錢龜板石斛各一兩地骨皮六錢知母五錢桑葉金銀花各四錢花粉三錢丹皮二錢令用大沙鍋煎而頻服不必限劑服三日瘧斷而各恙皆減粥食漸進不勞余藥而起周某患瘧間二日而作寒少熱多醫謂老年三瘧放手溫補漸至杳不進谷所親李石泉孝廉囑延孟英診之脈細硬如弦毫無胃氣右尺洪數舌色光絳大渴溺滴孟英曰此足少陰暑瘧也廣服溫補津液劫盡欲以草木生之事不及矣世但知治瘧不善有三患邪留肝絡則為瘧母戕及脾元則成瘧臌耗乎腎陰則為瘧勞而此證以藥助邪邪將劫命求轉三患亦不能得所謂熱得補而更熾陰受灼以速亡陰愈亡而邪愈熾何殊炮烙之刑病者何辜可慘可慘逾日果歿特録以為戒醫者鑑之盛墨莊冬患間瘧因腹脹畏寒自服神麯薑湯勢益甚孟英視之曰暑濕內伏也以黃連枳實厚朴山梔黃芩杏仁貝母知母石斛旋復橘皮蘭草為劑蘆蔔煮湯煎藥三啜而瘳姚小蘅大令患瘧寒微熱甚日作二次汪某與柴胡湯藥二劑勢遂劇舌絳大渴小溲全無孟英曰津欲涸矣豫西洋參生地知母花粉石斛麥冬梔子百合竹葉投之五劑而瘧止其簉作妾解室同時患此嘔吐脅痛畏寒不渴苔色微白孟英與小柴胡湯三飲而瘳潘祥行在外患瘧買舟歸就孟英診視曰苔膩脈軟伏邪所化不與正瘧同科風寒藥一味不可犯薑棗湯一滴不可啜與知母黃芩橘皮半夏滑石厚朴杏仁石斛花粉省頭草一劑而病若失此等案極多姑載一二喬有南年三十九歲患牝瘧二旬醫治罔效所親徐和圃疑為伏暑迓孟英往診脈微無神倦臥奄奄便祕半月溺赤不飢痰多口乾稍呷米飲必揉胸捶背而始下苔色黑膩而有蒙茸之象乃曰此精氣神三者交虛之證不可與時行伏暑晚發同年而語也幸前手之藥法主運中尚無大害與人參白術肉桂附片沉香拌炒熟地鹿角膠石英蓯蓉枸杞當歸茯苓杜仲棗仁菟絲子山茱萸橘皮霞天曲胡桃肉等出入為大劑投十餘帖寒後始有熱而苔色乃退口不作渴甘淡亦日少粥食漸加即裁桂附白朮加石斛又服七劑解黑燥大便甚多凡不更衣者四旬二日矣寒熱亦斷安穀溲澄而竟愈或謂先生嘗訾人溫補之非何一旦放手而大用孟英曰溫補亦治病之一法何可廢也第用較少耳世之醫者眼不識病僅知此法可以媚富貴之人動手輒用殺人無算豈非將古人活人之方翻為誤世之藥可不痛恨耶九月間張春橋患瘧寒少熱多間二日而作甫兩發形即清瘦孟英診曰脈弦而細尺中甚數疾作於子夜口乾嗜飲乃足少陰熱瘧也兩發遽爾形消胡可玩視吾以妙藥奉贈可期即已但請即服不可商於人而致疑義也方用元參生地知母丹皮地骨皮天冬龜板茯苓石斛桑葉春橋以向所心折遂服之一劑瘧即止再以滋陰善後而愈豫謂此證一帖而瘳似乎輕易但非真才實學焉有此種妙治設遇別手非溫補即提表其禍可勝道哉然天下之病無論輕重總貴初治得法何致輕者重而重者危耶奈世俗之情必使輕者重而後轉安始知醫藥之功殊可嘆也按此證世人但知其為三陰瘧籠統治以溫補之法徒未聞有分經用藥者今提出少陰二字創立清涼之劑用藥精當取效敏捷法似新奇理自完足所謂活人治活病全以活潑運之也可以啓人慧悟垂作典型陳媼患牝瘧月餘腹脹便祕噯多不飢口淡脈滑孟英主黃連厚朴橘皮貝母杏仁竹茹旋復花紫菀枇杷葉蒺藜為方數劑即瘳蔣北甌二尹患瘧醫與小柴胡湯平胃散而漸甚繼以大劑溫補勢頻於危復用桂枝白虎湯狂亂如故所親董蘭初鹺尹延孟英視之曰暑瘧也桂枝白虎湯用於起病之時則妙矣今為溫散補燥諸藥助邪爍液脈數無倫汗渴不已雖宜白虎湯豈可監以桂枝助熱耗津而自掣其肘焉因與大劑白虎湯加花粉竹葉西洋參元參石斛服之即安至十餘帖瘧始瘳而舌尚無苔渴猶不止與甘涼濡潤三十餘劑始告痊周同甫患瘧多汗醫恐其脫與救逆湯而勢劇孟英診視之曰濕瘧耳濕家多汗無恐也況口渴溺赤溫補勿投與清解藥漸安繼而乃翁秋叔病初服溫補病進更醫知為伏暑與藥數劑熱果漸退偶延孟英診之尺中甚亂因謂其侄赤霞曰令叔之證必不能起吾不能藥也已而果然廣孔愚司馬之大公子仲秋間患瘧寒少熱多面目甚黃苔膩大渴腹脹溺赤仍能納穀且素嗜肥甘不能撙節孟英按其脈滑實而數與承氣湯加知母黃芩半夏貝母連翹黃連滑石石膏大腹皮花粉之類服二十餘劑而始愈是膏粱挾暑濕熱之治也許叔超令大母祖母患瘧延孟英治之脈弦滑而數脘悶便閉合目汗出口渴不飢或慮高年欲脫孟英曰此溫邪挾素有之痰所化補藥斷不可服與知母黃芩栝蔞杏仁連翹貝母旋復竹茹黃連石斛雪羹為方服果漸效許氏婦患間瘧寒少熱多不飢大渴善嘔無汗脈滑而弦孟英投白虎湯加花粉柴胡而愈海鹽周子因工於畫體素弱偶患間瘧黃某用首烏鱉甲薑棗等藥病日甚加以參桂狂躁妄言始延孟英視之面赤舌絳溲澀便溏渴飲汗多脈形細數是暑證也與元參銀花知母黃芩竹茹貝母竹葉荷稈蓮心西瓜衣為劑尋愈吳西瀍患瘧寒微熱甚旬余不愈孟英診之脈滑而長疏大劑白虎湯與之渠兄濂仲云沈顧二君皆主是方屢服無效孟英索方閲之湯雖白虎而石膏既少且煨兼不去米因謂其兄曰湯雖同君藥已重用而去米加花粉竹茹等其力不同科矣濂仲大悟服之尋愈此可以見服藥不可徒有湯頭之名也黃鼎如令堂年七十七歲季秋患間瘧每發加劇寒甚微而熱必昏痙舌不能伸三發之後人皆危之孟英視之顴赤目垂鼻冷額頦微汗苔色黃膩舌根純紅口渴痰多不思粥飲脈至弦數重按少神證屬伏暑挾痰而已陰虛陽越先與蓯蓉鱉甲楝實石斛竹茹貝母燕窩藕汁二劑而顴紅頦汗皆蠲繼佐人參竹瀝薤白麥冬枇杷葉旋覆去竹茹蓯蓉投三帖而昏痙不作又去薤白楝實加生地花粉服五日而瘧休飲食漸加而居然告愈方瘧勢披猖之際鼎如上水兩昆仲頗以為憂延諸名家議治有主人參白虎湯者有用犀角地黃湯者有欲大劑溫補者有執小柴胡湯加減者賴孟英力排衆議病家始有把握與孟英意見相合者何君新之也慫恿參贊與有功焉韓嫗年近花甲患三瘧於仲冬朱某主溫散並以薑棗湯恣飲旬日後粒米不黏瘧至大吐黃某以熱補進勢益甚又浹旬孟英視之胸中痞結如柈苔黃苦渴溲如熱湯脈弦滑右甚帶下如注投小陷胸湯合溫膽湯加薤白服後大吐膠痰十餘日胸痞始消改授甘涼瘧亦漸罷遞參滋陰遂以霍然陳舜廷患瘧久不愈其體素虧醫皆束手孟英視之曰舌絳無津微寒溲赤原屬春溫化瘧體與病皆不是小柴胡湯之例過投溫散熱熾陰傷與竹葉石膏湯撤熱存津而愈莊芝階舍人三令媳患搐搦間日而作孟英診脈弦數泛泛欲嘔口苦不飢凜寒頭痛汛事愆期溲熱如火乃厥陰暑瘧也投以大劑犀角羚羊角元參梔子菊花木通知母楝實花粉銀花之藥數日而愈趙子善患瘧畏冷不飢孟英診之脈滑數苔黃溲赤脘悶善喜嘔投竹葉石膏湯加減以清伏暑而痊王一峰之次郎患瘧多服薑棗溫散之藥因致壯熱耳聾譫語殿屎不寐昏狂見人欲咬顧聽泉從伏暑治亦不效延至初冬吳愛棠囑其求診於孟英按脈皆滑即以顧聽泉所疏犀角等藥內加石菖蒲膽星竹瀝珍珠牛黃為劑吞白金丸一服即減旬日霍然繼而其令堂發熱善嘔頻吐黏沫頭痛如劈口苦耳聾神識昏瞀脈弦而數乃伏暑挾內風之鴟張與犀角元參竹茹花粉知母連翹黃芩石斛梔子菊花雪羹等藥七日而瘳高瑞生令弟瘧久不痊形消不食醫謂虛也投補藥而更增自汗孟英診之脈弦滑脘下聚氣投小陷胸加竹茹旋復枳實以開痰結漸能納穀繼以清養病去肌充聞氏婦孟夏患間瘧而妊娠八月數發後熱熾神昏腰痛欲墮張養之囑援於孟英脈來洪滑且數苔色黃膩垢濁與黃芩知母竹茹竹葉銀花桑葉絲瓜絡石斛石膏石菖蒲一劑而痊朱佳木令尊患間瘧年逾七旬人頗憂之孟英切脈弦滑脘悶苔黃曰無恐也投清熱滌痰藥數劑霍然李明府令正年逾花甲素患痰嗽近兼哺熱不飢頭痛不食醫治罔效姚小荷薦孟英視之脈滑數乃痰火內伏溫熱外侵投石膏藥二服而熱退知飢又數劑並宿恙均愈余朗齋形瘦體弱患間日瘧寒少熱多二便澀滯脘膈悶極苔膩不渴孟英切脈緩滑而上溢曰素秉雖陰虧而痰濕阻痹既不可以提表助其升逆亦未宜以涼潤礙其樞機投以滑石厚朴竹茹旋復通草枇杷葉葦莖鬱金蘭葉之方苔色漸退即去厚朴郁金加黃連枳實半夏胸悶漸開瘧亦減便乃暢再去滑石半夏黃連枳實加沙參石斛橘皮黃芩浹旬而愈許季眉室歸自維楊仲秋患痁久虐曰痁自作寒濕治勢益劇其從子芷卿以為挾風暑也連進清解病不減邀孟英診之脈弦滑而洪體豐多汗苔黃便血嘔渴妄言徹夜不瞑欲臥於地乃伏痰內盛暑擾陽明也投大劑石膏知母犀角元參石斛銀花黃芩花粉蘭葉竹瀝三帖證始平芷卿隨以多劑肅清而愈莊芝階舍人年七十矣患間虐寒則顫栗熱則妄言孟英視之脈弦數而促苔黑口乾是素有熱痰暑邪內伏與知母花粉元參石斛黃芩竹茹連翹海虴蘆蔔蓮子心等藥數啜而瘳至仲冬因泛湖宴客感冒風邪嗽痰頭痛不飢寒栗自服羌活紫蘇荊芥等藥二劑勢益甚而口渴無溺孟英切其脈與季秋無異但兼浮耳證屬風溫既服溫散所謂熱得風而更熾也舌絳無津亟宜清化以桑葉枇杷葉梔子知母冬瓜子元參菊花花粉貝母梨汁為劑投匕即減旬日而痊鎖容亭姊自太侖歸寧即患時瘧顧聽泉一手清解業已安穀下榻忽然氣逆肢寒神疲欲寐耳聾舌謇杳不知飢大便仍行別無痛苦顧聽泉知其素患脫血元氣久虛改用參附等藥勢愈劇以為欲脫矣所親吳久山囑拉孟英圖之切脈弦緩視苔黃膩乃胎之初孕邪未盡而阻氣凝痰窒礙樞機治當宣豁以石菖蒲枳實旋覆半夏黃連茯苓橘皮蔥白海虴竹瀝為方投匕即效三啜霍然鎖繩先室人患瘧而馴至脘痞嘔厄鼻冷自汗不食不眠脈來歇止醫者危之孟英視之亦痰為患耳即以此方治鎖容亭姊之方去蔥白海虴竹瀝加薤白蔞仁竹茹投之果驗許芷卿痁起季秋孟英嘗清其伏暑而將愈其從母亦知醫強投以小柴胡一劑勢復劇孟英以溫膽湯去甘草加生石膏黃芩知母花粉蘆蔔而安繼因作勞太早而復發適孟英丁憂母喪趙君笛樓仍用清解而痊逮季冬因移居勞頓瘧忽間作且面浮跗腫喘嗽易嗔人皆以為大虛之候孟英切脈左弦徑而數右滑大不調苔黃且膩口渴溺多乃胃肺之熱痰有餘肝膽之風陽上僭畏虛率補必不能瘳用西洋參知母花粉竹茹蛤殼石斛枇杷葉青蒿秦艽白薇銀花海虴為方連投四劑大吐膠痰而各恙悉除甌鎮孫總戌令郎孫楚樓自鎮江來浙主於石北涯家途次患寒熱如瘧脅痛痰嗽北涯見其面黧形瘦頗以為憂即延醫與診醫謂秋瘧豫疏散方北涯猶疑其藥不勝病復邀孟英視之曰陰虧也勿從虐治以葦莖湯加北沙參熟地桑葉丹皮海石旋覆貝母枇杷葉為劑北涯見用熟地大為駭然孟英曰君慮彼藥之不勝病吾恐此病之不勝藥贈此肅肺潤燥滋腎清肝之法病必自安楚樓聞之嘆曰妙手也所謂深合病情前在姑蘇服疏散藥甚不相安居停居處謂住處主人之稱毋疑我服王公之藥矣果數日而痊逾旬即東渡越甌去黃疸張某患發熱醫知其非寒邪也用清解藥數劑腿痛異常身面漸黃孟英診之脈滑實腹脹口乾豫茵陳大黃湯兩劑便行而各恙霍然仲秋久雨吳汾伯於鄉試後患恙自言坐於水號浸及於膝人皆以為寒濕之病孟英切脈甚數溲赤苔黃口乾燥嗆因謂其尊人醞香曰病由暑濕而體極陰虧已從熱化不可以便瀉而稍犯溫燥之藥先與輕清肅解繼用甘涼撤熱漸能安穀半月後熱始退盡而寢汗不眠投以大劑滋填潛攝之藥兼吞五味子磁朱丸數十帖乃得康復此證誤治即敗少謬亦必成損苟非誠信於平日焉能誠服於斯時聞其寐汗不收夜不成寐之間旁言嘖嘖孟英恐其動搖主意必致全功盡棄囑其邀顧聽泉許芷卿質證而顧許咸是孟英議於是主人之意甚堅而大病乃痊籲談何易耶朱湘槎令侄新泉之室人懷妊患痢醫投溫燥止澀腹痛甚而遍身發黃飲食不思孟英視之暑濕也與黃芩黃連銀花茅根桑葉梔子楝實竹葉茵陳冬瓜皮而愈積聚赤山埠李氏女素稟怯弱春間汛事不行脅腹聚氣如瘕餐減肌削屢服溫通之藥至孟秋加以微寒壯熱醫仍作經閉治勢瀕於危乃母托伊表兄林豫堂措辦後事而豫堂特請孟英診以決之孟英切脈時壯熱烙指汗出如雨其汗珠落於脈枕上微有粉紅色乃曰虛損是其本也今暑熱熾盛先當治其客邪庶可希冀疏白虎湯加西洋參元參竹葉荷稈桑葉及何醫至一籌莫展聞孟英主白虎湯乃謂其母曰危險至此尚可服石膏乎且本草於石膏條下致戒云血虛胃弱者禁用彼豈未之知也豫堂毅然曰我主藥與其束手待斃盍從孟英死裡求生之路耶遂服二帖熱果退汗漸收改用甘涼清餘熱日以向安繼豫調氣養營陰瘕瘦亦消培補至仲冬汛至而痊次年適孫夔伯之弟王士乾室素多鬱怒氣聚於腹上攻脘痛旋髮旋安花甲外病益甚醫治益劇李西園薦孟英視之曰此非人間之藥所能療矣辭不豫方其夫子及壻環乞手援孟英曰既爾吾當盡力以冀延可也然腹中聚氣為瘕攻痛嘔吐原屬於肝第病已三十載從前服藥諒不外溫補一途如近服逍遙散最劫肝陰理中湯極傷胃液名稱療疾實則助桀人但知嘔吐為寒未識風陽內煽水自沸騰專於爐內添薪津液漸形涸竭奈醫者猶云水已不吐病似漸輕是不察其水已吐盡僅能噦逆空嘔所以不能納穀便祕不行脈弦無胃舌痿難伸蘊隆蟲蟲何可措手可謂女人亦有孤陽之病矣勉以西洋參肉蓯蓉麥冬玉竹生白芍石斛竹茹柏子霜紫石英為方豬肉煮湯煎藥和入青蔗漿人乳服後嘔噦皆止人以為轉機孟英曰譬之草木乾枯已久驟加灌溉枝葉似轉青蔥然根荄稿矣生氣不存亦何益耶繼而糜粥漸進頗思肉味其家更喜以為有望孟英曰且看大解後如何越數日大便頗暢殊若相安亟迓復診孟英曰枉費苦心矣脈不柔和舌不潤澤雖谷進便行而生津化液之源已絶藥石能從無中生有哉夏至後果殞水腫鍾耀輝年逾花甲在都指京都患腫起自腎囊氣逆便溏諸治不效急買車返杭托所親謝金堂邀孟英治之切其脈微且弱詢其溺清且長因問曰都中所服其五苓散八正散耶抑腎氣湯五皮飲也鍾云誠如君言遍嘗之矣而病反日劇者何孟英曰此土虛不制水也通利無功滋陰亦謬補土勝濕與大劑人參白術果即向安越八載以他疾終黃履吉截瘧後患浮腫趙某聞其體素虛切其脈弦細遂用溫補馴至厄忒不休氣衝礙臥飲食不進勢瀕於危請孟英決其猶及返餘杭否孟英曰脈雖弦細而有力子必誤服溫補矣肯服吾藥猶可無恐因與栝蔞薤白合小陷胸湯橘皮竹茹湯加柿蒂旋覆蘇子香附赭石紫菀枇杷葉為方四劑而瘳石北涯令正久患齦痛漸至身面浮腫或以為虛或以為濕病日以劇氣逆不飢孟英察脈左洪數右弦滑陰分雖虛先當清其肺胃之痰熱者投白虎湯加沙參花粉冬瓜皮枇杷葉梔子竹茹蘆根服之腫即消繼佐滋陰齦痛亦止淋證運糧千總馬香谷患溺閉欲死所親趙春山司馬延孟英視之脈堅體厚口渴苔黃投知母黃柏梔子楝實犀角紫菀栝蔞竹茹之藥送當歸龍薈丸而瘳竟不復發陳芰裳患淋久不愈延至溽暑孟英診之曰易事耳豫補中益氣湯而愈周菊生令正患少腹酸墜小溲頻數而痛醫投通利不效繼以升提溫補諸法備試至於不食不寐大解不行口渴不敢飲水聞聲即生驚悸孟英脈之曰此厥陰為病也不可徒治其足太陽先與鹹苦以泄其熱續用甘潤以滋其陰毫不犯通滲之藥而愈胡振華以花甲之年患溺後出血水甚痛自云溲頗長激似非火證孟英察脈有滑數之象豫元參生地犀角山梔楝實槐蕊側柏知母花粉石斛銀花甘草梢緑豆等藥旬日而痊逾四載以他疾終陳足甫溲後見血管痛異常減餐氣短孟英以元參生地知母楝實銀花側柏葉梔子桑葉丹皮緑豆為方藕湯煎服二劑病大減乃去丹皮柏葉加西洋參熟地服之而瘥朱湘槎令媳患溲澀痛醫與滲利反發熱頭痛不飢口渴夜不成眠孟英診之脈細數乃陰虛肝鬱化熱生風津液已爍豈容再利與白薇梔子金鈴子散知母花粉紫菀麥冬石斛菊花服之即愈許培之祖母年逾七旬久患淋漏屢發風癍孟英持其脈弦而滑舌絳口乾每以犀角生地二至丸黃芩青蒿白薇元參龜板海螵蛸之類息其暴甘露飲增損調其常人皆疑藥過涼孟英曰量體裁衣病屬陽旺氣血有餘察其脈舌治當如是病者乃云十餘年前偶患崩而廣服溫補遂成此恙始知先天陽氣雖充亦由藥釀為病秋杪患寒熱如瘧善怒不眠苦渴易飢卻不能納食孟英察脈弦數倍常豫清肺蠲痰柔肝充液之法漸以向安今冬有薦吳古年診治者詢知病源作高年脫營論而以血脫益氣裁方初服三四劑飲食驟增舉家欣幸已而血漏甚多眠食欲廢復延孟英視之仍主前議果得漸康疝氣金元章年逾七旬久患疝厥每病於冬以為寒也服熱藥而暫愈終不能霍然孟英診曰脾胃雖寒肝陽內盛徒服剛烈焉能中肯以人參白術枸杞蓯蓉當歸茴香菟絲鹿角霜桂枝茯苓楝實黃連吳萸橘核等藥為方服之今數年無恙矣慶雲圃觀察令郎陡患偏墜醫與茴香葫蘆巴烏藥荔核等劑遂疼不可忍因浼趙棠村鹺尹邀孟英視之按其脈膚甚熱曰非疝也睪丸腫痛必偏於右此濕熱時邪也設以疝治則必成癰乃按濕熱時邪治之果覆杯而痛減三服而便行熱退因食羊肉腫痛復作再與清解囑慎口腹而瘳諸虛有患陰虛火炎者面赤常如飲酒之態孟英主一味元參湯其效若神而屢試皆驗薛氏立齋醫案每以補中益氣湯與地黃丸並用為治雖盧不遠之賢亦或效尤其實非用藥之法也如果系清陽下陷而當升舉者則地黃丸之陰凝滯膩非所宜也設屬真陰不足之當用滋填者則升麻柴胡之耗散不可投也自相矛盾毫無紀律然上下分治原有矩矱有屠敬思者素屬陰虧久患痰嗽動則氣逆夜不能眠頻服滋潛納食漸減稍沾厚味嘔腐吞酸孟英視脈左弦而微數右則軟滑兼弦水常泛溢土失堤防肝木過升肺金少降良由久投滋膩濕濁內蟠無益於下焦反礙乎中運左強右弱升降不調以蓯蓉黃柏當歸芍藥熟地丹皮茯苓楝實砂仁研為末藕粉為丸早服溫腎水以清肝以黨參白朮枳實菖蒲半夏茯苓橘皮黃連蒺藜生曬研末竹瀝為丸午服培中土而消痰暮吞威喜丸肅上源以化濁三焦分治各恙皆安悉用丸劑者避湯藥之助痰濕耳室女多抑鬱干嗽為火鬱夫人人而知之者有王杞庭之姊年逾標梅謂當婚之年陡患干嗽無一息之停目不交睫服藥無功求孟英診焉兩脈上溢左兼弦細口渴無苔乃真陰久虛風陽上僭沖嗽不已厥脫堪虞授牡蠣龜板鱉甲石英蓯蓉茯苓熟地歸身牛膝冬蟲夏草胡桃肉之方藥甫煎果欲厥亟灌之即寐次日黃昏猶發寒痙仍灌前藥第三夜僅有寢汗而已四劑後諸恙不作眠食漸安設此等潛陽鎮逆之方遲投一二日變恐不可知矣況作郁治而再用開泄之品耶故辨證為醫家第一要務魏西林令侄女娩後惡露延至兩月繼聞乃翁條珊主政及兩弟卒於京悲哀不釋而為患乾嘔吐血頭痛偏左不飢不食不眠不便渴飲而溲必間日一行久治不效孟英切脈虛弦豁大與麥冬大棗加熟地首烏鱉甲二至丸菊花旋覆芍藥貝母麻仁青鹽等藥服後脈漸斂血亦止七八劑頭痛始息旬日後便行安穀逾年接柩悲慟血復溢誤投溫補而亡趙菊齋仲媳素患陰虛內熱時或咯血去年孟英已為治愈暨而汛事偶愆孟英診曰病去而孕矣今春娩後患瀉適孟英赴豫章之診專科進以溫熱之方而咳嗽乃作更醫改授養營之劑則滑瀉必加簽藥乩方備嘗莫效比孟英歸投以甘草小麥大棗配以烏梅黃連之法證漸輕減繼為其姻黨尼之多方蠻補遂致腹脹減餐日下數十行皆瑩白堅圓如白蒲桃之形上縈血絲菊齋悔悶仍乞援於孟英豫仲景當歸生薑羊肉湯每劑吞鴉旦仁二十一粒以龍眼肉為衣果兩服而便轉為溏痛即遞減再與溫養奇經之龜板鹿角霜當歸茯苓枸杞菟絲子甘草白芍烏賊骨蓯蓉蒲桃干藕肉等調理而痊朱氏婦素畏藥雖極淡之品服之即吐近患晡寒夜熱寢汗咽乾咳嗽脅痛月餘後漸至餐減經少肌削神疲孟英診之左手弦而數右部澀且弱曰既多悒鬱又善思慮所謂病發心脾是也而平昔畏藥豈可強藥再戕其胃誠大窘事再四思維以甘草小麥紅棗藕肉四味令其煮湯頻飲勿掇病者嘗藥大喜徑日夜服之逾旬復診脈症大減其家請更方孟英曰毋庸也此本仲景治臟燥之妙劑吾以紅棗易大棗取其色赤補心氣香悅胃加藕肉以舒郁怡情合之甘麥並能益氣養血潤燥緩急雖若平淡無奇而非惡劣損胃之比不妨久住胡可以為果子藥而忽之哉恪守兩月病果霍然高石泉媳骨小肉脆質本素虛冬間偶涉煩勞不飢不寐心無把握夜汗耳鳴馮某連進滋陰法病日甚孟英察其左寸甚動兩關弦滑苔色膩黃乃心肝之火內燔胃腑之氣不降陰虧固其本病滋填未可為非然必升降先調而後補之有益授以鹽水炒黃連石菖蒲元參丹參梔子石斛小麥知母麥冬竹葉蓮子心等藥服之即應續與女貞旱蓮牡蠣龜板地黃善後而瘥古方書云喘無善症喘而且汗尤屬可危戊戌春張雨農司馬必欲孟英再赴黃山孟英因其受病之深且公事掣肘心境不能泰然誠非藥石之可以為力也固辭不往司馬泣然哀懇但冀偕往旋署則任君去留可耳並囑趙蘭舟再四代陳曲悃孟英感其情同舟渡江次剡溪司馬談及體氣羸憊情形孟英忽曰公其久不作嚏乎司馬曰誠然有年矣此曷故也孟英曰是陽氣之不宣布耳古惟仲景論及之然未立治法今擬鄙方奉贈博公一嚏如何司馬稱善遂以高麗參乾薑五味子石菖蒲酒炒薤白半夏橘皮紫菀桔梗甘草為劑舟行抵嵊登陸取藥煎而服之駕輿以行未及草里司馬命從人詣孟英車前報曰已得嚏矣夏間顧聽泉邀孟英視其所視屠緑堂之恙孟英曰陰生可慮果於夏至前五日而卒屠之五令郎患痰嗽者數年近因悲哀病作徐某見其嗽甚則吐也投以參術病乃益甚潤七月十六日夜緑堂忽示夢雲汝病須延孟英診視服溫養藥可愈覺而異之即邀過診孟英曰此陰虛癆嗽嗽久而沖氣不納則嘔吐非胃寒也經言勞者溫之亦溫養之謂非可以溫補施之者病者見案更為驚歎始以父蘿告焉孟英亦為之肅然方用西洋參熟地蓯蓉二冬茯苓龜板牡蠣紫石英玉竹枇杷葉橘皮服之果安豫謂凡事皆可以感天地格鬼神況醫為性命之學耶即此一案可以知孟英之手眼通大非幸獲虛名者所能仰望也顧石甫為婁縣宰患恙醫治日劇解任歸求診於孟英脈見左寸如鉤曰病不能夏矣子雙適至聞而疑之謂許醫詰曰此症氣逆血溢腹脹囊腫宛以康康侯之疾若以外象觀之似較輕焉胡彼可愈而此勿治耶孟英曰彼為邪氣之壅塞脈雖怪而搏指不撓證實脈亦實也此則為真氣之散漫脈來瞥瞥如羹上肥而左寸如鉤是心之真臟脈見矣夫壅塞可以疏通散漫不能收拾客邪則草木能攻神病而刀圭莫濟證雖相似病判天淵縱有神丹終無補也季春果歿馬某年三十餘素用力患發熱惡寒肢振自汗少腹氣上衝胸頭痛口渴孟英診曰衛虛風襲而脈絡久傷肝風內動豫建中去飴糖加龍骨牡蠣石英蓯蓉楝實桑枝數帖而痊中毒丙戌春侖夫鄭德順患急症時已二鼓丐孟英視之見其扒床拉席口不能言唯以兩手指心抓舌而已孟英曰中毒也取緑豆二升急火煎清湯澄冷灌之果能霍然詰次日朝詢其故始言久患臂痛因餌草頭藥下咽後即心悶不可耐舌麻不能言而旁人不知也録此足以證孟英之燭照如神亦可見草藥之不可輕試也發癍胡季權令郎珍官右顴偶發紫癍一塊當時季冬孟英與犀角石膏涼解之藥二三帖後始發熱癍漸透犀角服至二十餘帖始撤去又素有目疾餘熱復從目發令以石膏藥久服居然漸愈且能食肌充略無他患聞者莫不異之雜治陸某操酒業極窘又遭顛沛久而患一異疾形消善癢蝨從皮膚而出搔之蠕蠕醫治莫效孟英診曰悲哀勞苦陽氣受傷麴櫱浸淫乃從蟲化與補氣藥加杉木桑枝而愈都城售透土長壽丹極言其功之大能治諸疾而價甚廉人皆稱之孟英謂勿論其所用何藥執一方以療百病無此治法每以稟賦不齊證因有別勸人切勿輕嘗況以緑豆湯為飲必有熱毒之品在內不可不慎也繼而張孟皋少府餌之患疽廣粵亭司馬服之咽爛孟英投多劑甘寒而愈王雪山久患下部畏冷吞未百丸齒痛目赤諸恙蜂起孟英察脈弦滑與多劑石膏藥兼以當歸龍薈丸頻服新疾既瘳腿亦漸溫令其常飲柿餅湯以杜將來之恙伊弟患腹脹而喜溫補久而不效孟英曰濕熱也宜清化彼不信因服透土丹初頗應已而血大溢始得悔悟志此數則以為世之好服奇藥者戒王雪山於上年誤餌透土丹之時孟英診治向愈即囑其常飲柿餅湯以杜關格於將來逮今年四月間形體日瘦張某進以導濕疏風補氣之藥孟英偶見之力勸其溫補莫投且以凡物遇火則乾癟得滋則肥潤為譬雪山深韙之奈為張某輩朝夕虛言所眩惑仍服補藥延至秋間始延孟英視之脅痛畏風周身絡脹時欲敲撲食少便艱日晡微有寒熱脈來弦澀而數右寸關弦軟以滑是升降之令久窒痰邪襲於墜絡關格之勢將成勉與沙參竹茹貝母白薇青蒿旋復石斛梔子楝實蘭草枇杷葉絲瓜絡冬瓜子蘆根茅根等出入為方服之寒熱既蠲脅痛亦減雪山大喜復請診之脈頗轉和第肝陰為謀慮所傷最怕情志不怡必生枝節小愈奚足為恃囑其另邀明眼圖之無如嗔怒縈思諸多棖觸頻有轉關屢生枝節以致大便必極捶背尻而始解上則吐痰惡谷果成關格之候復誤於溫散溫補舌色乾紫津涸而亡二婦産科月經不調壬寅春邵小墀室患汛愆釋醫診以為妊廣服保胎藥漸至腹脹跗腫氣逆礙臥飲食不進入夏延孟英視之曰血虛氣滯誤補成脹也先以黃連厚朴山楂雞內金橘皮大腹皮枳實茯苓梔子楝實杏仁紫菀旋覆等藥稍佐參術服之氣機旋運脹去食安漸入滋陰養血之治數月經行而愈張養之令正飲食如常而肌膚消瘦汛事如期而紫淡不恆兩腓發熱而別處仍和面色青黃而隱隱有黑氣色儼似虛寒多藥不效始延孟英診之脈似虛細而沉分略形弦滑曰此陽明有餘少陰不足土燥水涸仲聖有急下存陰之法然彼外感也有餘之邪可以直泄此內傷也無形之熱宜以甘寒義雖同而藥則異贈以西洋參生地生白芍生石膏知母黃柏茯苓梔子麥冬花粉楝實丹皮麥門冬木通諸品服至數斤黑氣退而肌漸充腓熱去而經亦調矣張養之侄女患汛愆而飲食漸減於甘豫通經藥服之尤惡谷請孟英診之脈緩滑曰此痰氣凝滯經隧不宣病由安坐不勞法以豁痰流氣勿投血藥經自流通於某聞而笑曰其人從不吐痰血有病而妄治其氣脹病可立待也及服孟英藥果漸吐痰而病遂愈養之大為折服豫謂世人頭痛治頭腳痛療腳偶中而愈貪為己功誤藥而亡冤將奚白此寓意草之所以首列議病之訓也孟英深得力於喻氏故其議病迥出凡流安知見識之超總由讀書而得雖然人存政舉未易言也吳馥齋令姊稟質素弱幼時鳳山診之許其不秀癸已失其怙恃情懷悒悒汛事漸愆寢食皆廢肌瘦吞酸勢極可畏孟英以高麗參鹽水炒黃連甘草小麥紅棗百合茯苓白芍旋覆花新絳牡蠣等藥治之各恙漸已繼以高麗參當歸熟地滋陰康強竟勝於昔趙聽樵令妹每汛至則腹脹嘔吐腰脊痠痛兩腿腫痛筋掣脘痛甚至痙厥多藥不效孟英以金鈴子散合左金丸加二陳橘皮半夏竹茹枳實桂枝茯苓數劑而愈續用蓯蓉菟絲淫羊藿杜仲桑椹木瓜續斷香附當歸白芍茴香楝實調之汛至如期略無痛苦初冬適楊子朴尋即受孕褚芹香女校書患汛愆寒熱醫以為損輒投溫補馴至腹脹不飢帶淋便閉溲澀而痛孟英診脈弦徑而數乃熱伏厥陰誤治而肺亦壅塞也與清肅開上之劑吞當歸龍薈丸兩服寒熱不作而知飢旬日後諸恙悉安熱入血室藁砧即丈夫遠出婦病如狂似屬七情中病而亦有不盡然者陳氏婦患此月餘巫醫屢易所費既巨厥疾日增孟英切其脈弦而數能食便行氣每上衝腹時痛脹詢其月事云病起汛後繼多白帶孟英曰病因如是而晝則明瞭夜多妄言酷似熱入血室之候徑從瘀血治之可也與桃仁紅花犀角菖蒲膽星旋覆赭石丹參琥珀蔥白之劑兩服而瘀血果行神情爽慧繼去桃仁紅花加當歸元參服數劑而瘳崩漏周光遠妻因悲鬱而患崩漏面黃腹脹寢食皆廢孟英用龜板海螵蛸女貞旱蓮貝母柏葉青蒿白薇小麥茯苓藕肉蓮子心而康白帶一婦女患帶下腰痛足心如烙不能移步孟英投大劑甘露飲而瘳妊娠感冒葉承恩室懷孕患感昏譫不語喜嘔便祕汗出不解脈澀口乾乃營陰素虧邪熱內熾以元參石膏知母黃芩竹茹貝母銀花枇杷葉白薇梔子楝實石斛投數劑而愈夏氏婦懷孕患感醫投溫散漸至氣衝不寐時欲痙厥脘悶呻吟渴難受飲所親張養之延孟英診之脈滑數而溢與小陷胸湯加旋復薤白石膏知母梔子竹茹杏仁腹皮蘇子竹瀝海虴大劑投之旬日而愈仁術志者海豐張君柳吟所題孟英之醫案也吾師趙菊齋先生暨莊舍人芝階為之序余以未與其事深以為歉秋間偶過孟英適有陳姓者牽羊來謝孟英頗疑之其人曰三月間次媳患時感而氣逆不能眠醫皆畏卻特延君指王氏診甫按脈云甚滑疾是為娠象用藥必須顧及此時次媳方於去秋娩後月事尚未一行君為此言闔讀音合作全字解家未嘗不竊笑也逮疾漸平哺兒之乳亦不覺少雖自問亦斷斷非妊至六月間腹漸脹方謂有病不料昨日倏讀音抒作忽然解産一孫舉家敬服高明故來致謝耳孟英因謂余曰昨診魏子恆之室亦妊也諸醫作虛損治脈雖虛微軟數而滑象仍形病家深不以吾言為然者緣病人之女兄二人皆死於虛勞也然其伯仲指病者姊妹之證吾皆診焉今已十餘年矣猶憶其伯字於關氏未嫁而卒證非不治亦為藥誤病中閲吾方案極為折服且曰先生來暮依不起矣前此延致諸名家徒曰虛證宜補而不治其所以虛處方則群聚補藥必以地黃為之冠雖有參耆亦列於後即使用藥不乖而陽生陰長氣為血帥之旨尚未分曉況其他乎吾聞而愕然何以閨中女子亦解談醫細詢始知為乾隆間名醫吳穎昭先生之女孫也尤為惋惜仲指其妹適於陳少簾少府的系損證若季第三妹者因其家懷先入之見遂致醫人迎合誤事豈不可嘆逮仲秋果聞魏氏分娩母子皆亡方嘆孟英之卓見為不可及也爰採秋冬諸案之治法不同證尋常者而續成一卷云錢氏婦懷孕四月而患寒熱如瘧醫與發散安胎乃至舌黑神昏大渴便瀉臭痰頓頻吐腰腹痛墜人皆不能措手孟英診曰伏暑失於清解舌雖黑而脈形滑數痰雖臭而氣息調和是胎尚未壞猶可治也重用氣血兩清之藥五劑而安糜粥漸進腰腹皆舒胎亦躍躍徐氏婦重身婦人懷妊曰重身而患四肢疼痛不可屈伸藥之罔效或疑為癱瘓任殿華令其舍專科而質於孟英診曰暑熱入於隧絡耳吾室人曾患此豫以桑枝竹葉扁豆葉絲瓜絡羚羊角豆卷知母黃芩白薇梔子照方服之果即得愈妊娠瘧疾陳足甫室懷妊九月而患瘧目不能瞑口渴自汗便溏氣短醫進育陰清解法數劑不應改用小柴胡一帖而咽痛舌黑心頭絞痛乃翁仰山聞之疑其胎壞延孟英過診曰右脈洪滑雖舌黑而胎固無恙也病由伏暑育陰嫌其滋膩小柴胡湯乃正瘧之主方古人謂為和劑須知是傷寒之和劑在溫暑等證不特手足異經而人參半夏薑棗皆不可輕用之藥雖有黃芩之苦寒而仲聖於傷寒之治猶有渴者去半夏加栝蔞根之文古人立方之嚴密何後人不加體察耶投以竹葉石膏湯瘧止便閉口渴不休與甘涼濡潤法數帖忽腹鳴泄瀉或疑寒涼所致孟英曰吾當以涼藥解之人莫識其意問難終朝語多不備録果以白頭翁湯兩啜而愈逮季秋娩後發熱不蒸乳惡露淡且少家人欲用生化湯孟英急止之曰血去陰更傷豈可妄疑瘀停而攻之與西洋參生地茯苓石斛女貞旱蓮甘草為大劑數日而安繼因觸怒少腹聚氣如瘕痠痛夜甚人又疑為涼藥凝瘀所致孟英力為辨析與橘核橘葉橘絡楝實蓯蓉木香山梔炭烏藥絲瓜絡海虴藕肉石斛兩頭尖等藥外以蔥頭抖爛貼之兩服後腹中雷鳴周身汗出而痛止人見其汗慮其虛脫急追孟英視之曰此氣行而病解矣但脈形細數陰津大傷苔黃苦渴亟宜潤補奈樞機窒滯滋膩難投且以濡養八脈為法服之各恙皆蠲眠食漸適緣平素多郁易犯痧氣頻發脘痛屢次反復孟英竭力圖維幸得轉危為安漸投滋補而愈妊娠咳嗽汪氏婦自孟秋患痢之後大便溏瀉未愈已而懷妊恐其墮也投補不輟延至仲冬兩目赤瞳滿遮氣逆礙眠脘疼拒按痰嗽不食苦渴無溲屈孟英診之脈甚滑數曰此溫補所釀之痰也夫秋間滯下原屬暑濕熱為病既失清解逗留而為溏瀉受妊以來業經四月慮其墮而補益峻將肺胃下行之令皆挽以逆升是以胸次堵塞而痛喘嗽不能臥又恐其上喘下瀉而脫也補之愈力以致治節盡廢溲閉不飢濁氣壅至清竅兩目之所以蒙障而瞽也與沙參蛤殼枇杷葉冬瓜子海石旋覆蘇子杏仁黃連枳實海虴黃芩梔子重加貝母服二劑即知飢下榻目能睹物矣妊娠泄瀉謝氏婦懷妊五月便瀉四日醫投薑附桂一劑遂四肢麻冷氣塞神昏溺閉汗淋大渴嘔吐延孟英診之脈未全伏先飲以醬油湯吐漸止隨與西洋參黃連黃芩黃柏竹茹石斛銀花扁豆葉蒲桃干蘆根緑豆以冬瓜湯煎徐徐溫服外用醋炭熏之各恙皆瘥次日復診脈弦滑瀉未止以白頭翁湯加西洋參甘草銀花扁豆蒲公英蒲桃干砂仁二劑而痊胎漏滿洲少婦懷妊漏血諸醫投以補藥漏如故間或不漏則吐血延逾兩載腹中漸動孕已無疑然血久溢於上下甚至納食即吐多醫不能治孟英診之脈滑數有力是氣實而血熱也證不屬虛補藥反能助病愈補愈漏胎無血蔭而不長其所以不墜者氣分堅實耳豫大劑清營藥血溢遂止而稀沫頻吐得飲即嘔口渴心忡氣短似促乃用西洋參麥冬知母石斛枇杷葉竹茹柿蒂生白芍木瓜重用烏梅投之覆杯即安次日能吃飯矣滑胎李華甫繼室娠三月而崩孟英按脈弦洪而數豫大劑生地銀花茅根柏葉青蒿白薇黃芩續斷驢皮膠藕節胎髮灰海螵蛸而安奈不能安逸越數日胎墮復崩孟英於前方去後六味加犀角竹茹元參為治或謂胎前宜涼産後則否乃招專科及蕭山竹林寺僧治之咸用溫藥且執暴崩宜補服藥數劑虛象日著時時汗出昏暈畏聞人聲懶言息微不食不眠間有厄忒崩仍不止皆束手待斃矣復邀孟英視之曰此執死書以治活病也夫血因熱而崩胎因崩而墮豈胎墮之後熱即化為寒乎參朮薑桂棕灰五味之類溫補酸澀既助其熱血亦奔流又窒其氣津液潛消至現以上諸證脈或不知而苔黃黑燥豈不見乎因與犀角石膏元參知母花粉竹瀝麥冬銀花梔子石斛旋覆青蒿白薇等大劑投之神氣漸清旬日後各恙始平繼去犀角加生地服二月痊愈朱砥齋司李之夫人纍患半産每懷孕服保胎藥卒無效今秋受妊後病咳嗽孟英視之盡屏溫補純與清肺或詰其故曰胎之不固或由元氣之弱者宜補正或由病氣之侵者宜治病今右寸脈滑大搏指吾治其病正所以保其胎苟不知其所以然而徒以俗尚保胎之藥投之則肺氣愈壅咳逆愈甚震動胞系其胎必墮矣朱極欽佩服之良效次年夏誕子甚茁壯胎前産後疑似之證極多號曰專科尚難措手陳肖岩孝廉之媳屠仲如之女也汛愆一度次月仍行方疑其病也孟英診曰尺雖小弱來去緩和是娠也繼而果然屠仲如令弟子緣之室經事稍遲孟英偶診亦以妊斷尋驗甫三月患胎漏適孟英丁內艱遭母喪遂不克保而墮墮後惡露雖行而寒熱頭痛時或自汗且覺冷自心中出醫謂類瘧與溫化之藥病日甚交八日孟英始出門即延診之脈來沉實而數舌苔紫黯乃瘀血為患耳與桃仁澤蘭山楂茺蔚旋覆紅花丹參通草琥珀蛤殼絲瓜絡之劑服之腹痛大減下瘀血如肺者一枚次日諸恙較減乳汁大流再以前方去通草加麥蘖投之服後仍腹痛復下瘀塊纍纍而諸恙若失或問曰先生嘗言産後腹無痛苦者不可妄行其血此證惡露已行腹無痛脹何以斷為瘀阻而再行其血耶孟英答曰正産如瓜熟蒂落諸經蔭胎之血貫串流通苟有瘀停必形痛脹墮胎如瘍癰未熟強擠其膿尚有未化之根絆不能一齊盡出所以胎雖墮而諸經蔭胎之血萃而未渙淺者雖出深者尚留況是血旺之軀加以溫升之藥挽其順流之路窒其欲出之機未到腹中脹痛奚作吾以循經通絡宣氣行瘀之法導使下行故出路始通而後腹痛瘀來必然有脈可徵非謂凡屬墮胎皆有是證也張慈齋室自春間半産後發熱有時迄於季秋廣服滋陰之藥竟不能愈其大父陳靄山延孟英診脈按之豁然投以當歸補血湯而熱退繼以小建中湯愈之全畹香令媳半産後營分不攝淋漓數月治之勿瘳孟英於季夏診視兩尺皆浮左寸關弦與三甲二至二地青蒿白薇柏葉海螵蛸黃柏為方服之漸愈仲秋診其脈即斷為受孕渠謂懷孕必無病矣而不知病久初痊正須培養雖即受孕涵蓄無權果至仲冬而胎墮矣顧氏婦半産後因吃飯脘痛人以為停食也進以消導痛甚發熱臥則右脅筋掣難忍孟英曰此非發散攻消可療與旋覆絲瓜絡冬瓜子蓮稈葦莖竹茹貝母枇杷葉蘭葉通草為方一劑知二劑已滯産一少婦分娩胞水早破胎澀不能下俗謂之瀝漿生催生藥遍試不應孟英令買鮮豬肉一二斤洗淨切大塊急火煎湯吹去浮油恣飲之即産母子皆生且云豬為水畜其肉最腴大補腎陰而生津液余嘗用治腎水枯涸之消渴陰虛陽越之喘嗽並具奇效仲景治少陰咽痛用豬膚亦取其補陰虛而戢浮陽也後賢不察反指為有毒之物汪訒庵非之是矣惟外感初愈及虛寒滑瀉者濕盛生痰之證概不可食以其滋膩更甚於阿膠熟地龍眼也豬以浙産者為良北豬不堪入用吾杭之燥肉鮓即豬皮為之可以致遠入藥尤為簡當不必泥於皮與膚之字面而穿鑿以誇考據也孟英又云昔老友範君慶簪語雄曰解渴莫如豬肉湯凡官爐銀匠每當酷暑正各縣傾造奏銷銀兩納庫之際銀爐最高火光迎面故非氣血充足者不能習此業然人受火爍其渴莫解必須豬肉以急火煎清湯撇去浮油缸盛待冷用此代茶雄聞而悟曰此渴乃火爍其液非茶可解豬為水畜其肉最腴功專補水救液允非瓜果可比因此推而及虛喘虛閉下損難産諸證之無液者無不投之輒應乃知豬肉為滋陰妙品也死胎不下局醫黃秀元之與人韓名諒者有兒婦重身患熱病局中諸醫皆慮胎隕率以補血為方旬日後勢已垂危挽人求孟英診之曰胎早腐矣宜急下之或可冀幸若欲保胎則吾不知也其家力懇疏方遂以調胃承氣湯合犀角地黃湯加西洋參麥冬知母石斛牛膝投之胎落果已臭爛而神氣即清熱亦漸緩次豫西洋參元參生地知母麥冬丹參丹皮茯苓山楂石斛豆卷茺蔚子琥珀等藥調之粥食日加旬日而愈産後血暈産後諸證首必通瘀然有不可以常理測者表弟周鶴庭室新産暈汗目不能開心若懸旌毫無惡露乃父何君新之按其脈有虛弦豁大之形亟拉孟英圖之與以三甲石英丹參琥珀甘草小麥緑豆衣等藥覆杯即安數服而愈或詰其何以知非瘀血為患曰此陰虛之體既産而營液大脫風陽上冒雖無惡露胸腹皆舒豈可誤作瘀沖而妄投破血之藥耶惡露不下朱氏婦産後惡露不行而宿哮頓發專是科者不能下手孟英以丹參桃仁貝母茯苓滑石花粉桂枝通草蛤殼苡仁紫菀山楂旋覆琥珀絲瓜子茺蔚子等出入為方三日而愈豫荊人娩後惡露不行或勸服生化湯適孟英枉顧診曰陰虛內熱天令炎蒸雖赤砂糖不可服也以生地丹參丹皮豆卷茺蔚子茯苓桃仁山楂梔子澤蘭琥珀投之即效且無別恙而易健可見體質不齊藥難概用況其致病之因不一病機傳變無窮語云量體裁衣而治病者可不辨證而施治耶孟英嘗曰凡産後世俗多尚生化湯是以一定之死方療萬人之活病體寒者固為妙法若血熱之人或兼感溫熱之氣者而一概投之驟則變證蜂起緩則蓐損漸成人但知産後之常有而不知半由生化湯之歷階此風最盛于越方本傳於越之錢氏自景嶽採入八陳遂致流播四海人之陰受其害者數百年矣從無一人能議其非今特為此長夜之燈冀後人不致永遠冥行或可稍補於世但景嶽最偏於溫補而獨於産後一門力辨丹溪大補氣血為主之非可謂此老之一隙微明惜猶泥於産後宜溫之謬説蓋由未入仲聖之宮牆也金亞伯廷尉之簉室産後惡露不行渴瀉痰多孟英以北沙參滑石生薏苡扁豆蛤殼豆卷石斛竹茹枇杷葉琥珀茯苓等藥數劑而愈庚子春戴氏婦産後惡露不多用山楂益母草酒煎連服數日遂發熱自汗口渴不飢眩暈欲脫徹夜不眠孟英視之曰此素稟陰虧血已隨胎而去雖惡露甚少但無脹痛之苦者不可妄投藥餌酒煎益母草山楂不特傷陰且能散氣而汗泄口乾津液有立竭之勢即仲聖所謂無陽也蓋人身天真之氣謂之陽陽根於津陰化於液津液既奪則陽氣無根而眩暈陰血不生而無寐若補氣生陰則捨本求末氣血不能生津液也唯有澄源潔流使津液充而氣血自復庶可無憂以西洋參生黃耆龍骨牡蠣玉竹百合甘草麥冬生苡仁生扁豆石斛木瓜桑葉甘蔗漿投之一劑即安數日而愈後以滋填陰分服之乃健産後發痙何新之令嬡適湯氏孟冬分娩次日便泄一次即發熱痙厥譫語昏狂舉家惶惶乃翁邀孟英察之脈弦滑惡露仍行曰此胎前伏暑乘新産血虛痰滯而發也與大劑犀角羚羊角元參竹葉知母花粉梔子楝實銀花投之遍身得赤疹而痙止神清乃翁隨以清肅調之而愈産後昏譫姚氏婦産後昏譫汗厥肌膚浮腫醫投補虛破血祛祟痰安神之藥皆不能治舉家惶怖轉延孟英診耶詢之惡露仍行曰此證病家必以為奇病其實易愈也昔金尚陶先生曾治一人與此相似載於沈堯夫女科輯要中方用石菖蒲膽星旋覆花茯苓橘紅半夏曲名蠲飲六神湯凡産後惡露行而昏譫者多屬痰飲不可誤投攻補此湯最著神效如方服之良愈産後發熱張鄭封妻娩後即發熱服生化湯兩帖熱益熾而發赤疹顧聽泉診之即豫清解藥三劑不應欲進犀角地黃湯而恐病家狃於産後以生疑也乃拉孟英質之診其脈弦滑而數面赤熱燥胸悶善悲肢腫而疼兩肘白泡如扁豆大者數十顆舌上亦有一顆痛礙水飲大便不解已旬日矣曰此不但胎前伏暑且有蘊毒而誤服生化湯以助其虛幸初手即用清解尚不至於昏陷犀角地黃湯極是治法但猶恐不能勝任乃與聽泉商加西洋參滑石知母銀花花粉人中白蔞仁竺黃貝母桑葉梔子為劑其所親曰高明斷為熱證何以病者雖渴而喜熱飲耶孟英曰此方中所以多用痰藥也凡胸中有熱痰阻礙氣機者每如是不可以其向不吐痰而疑吾言之妄也若因此而指為寒證則禍不旋踵矣進四帖始得大解頻吐稠痰而各恙皆減飲食漸加孟英曰病勢雖穩餘熱尚熾苟不亟為清滌而遽投補益猶有蓐損之虞其母家果疑藥過寒涼必欲招專科調治幸將前方示彼尚不妄施溫補然隔靴搔癢紀律全無旬日後餘火復燃鄭封堅懇孟英設法仍用甘寒療之周身肌蛻如蛇皮爪甲更新其病之再生也可知繼豫滋補真陰而起翁嘉順室娩後發熱竹林寺僧治之不應溫龔二醫皆主生化湯加減病益劇請孟英診之脈軟滑微數曰素體陰虧熱自內生新産血去是以發熱惟譫妄昏瞀最是嚇醫之證渴喜熱飲宛似虛寒之據宜其猜風寒而投表散疑血瘀以攻通遂爾帖帖泡薑人人桃桂陰愈受劫病乃日加幸而痰飲內盛津液未至涸竭與蠲飲六神湯去橘皮半夏加西洋參生地花粉竹茹知母生白芍為劑數日而瘳逾旬復發熱或疑涼藥之弊或謂産蓐成癆衆楚咻之病漸進矣其小姑適吳氏者向役於冥曹俗謂之活無常偶來探病忽仆地而僵口中喃喃或問汝嫂病何如答曰須服王先生藥人皆異之次日仍乞診於孟英曰脈浮數而弦是風溫也與前病異便瀉無溺肺熱所迫大渴無苔胃汁受爍亟與天生建中湯頻灌藥主大劑甘涼果得津回舌潤漸以痊可高祿卿室吳濂仲之妹也孟夏分娩發熱初疑蒸乳數日不退産科治之知挾溫邪進以清解而大便溏瀉遂改溫燥其瀉不減另招張某視之因謂專科誤用蔞仁所致與參耆薑朮鹿角肉果等藥泄瀉愈甚連服之熱壯神昏汗出不止勢瀕於危醞香孝廉徐夫人病者之從母也心慈似佛有子十人皆已出聞其殆夤夜命四郎季眉請援於孟英按脈洪數七至口渴苔黃洞瀉如火小溲不行因謂季眉曰病猶可治第藥太驚人未必敢服季眉堅欲求方且云在此監服乃疏白頭翁湯加石膏犀角銀花知母花粉竹葉梔子楝實桑葉豫之次日復診脈證較減仍用前方而病家群譁以為産後最忌寒涼況洞瀉數日乎仍招張某商之張謂幸我屢投溫補在前否則昨藥下咽頃刻亡陽復定耆術之方業已煎矣所親張芷舟孝廉聞之飛告於蘊香處汾伯昆季即馳至病家幸藥未入口奪盞傾之索孟英方煎而督灌且囑群季輪流守視免致再投別藥孟英感其情誼快舒抒所長大劑涼解服至七帖瀉全止熱盡退乃去白頭翁湯加生地元參竹茹貝母服半月始解黑色燥屎而眠食漸安第腑臟之邪雖已清滌而從前溫補將熱邪壅滯於膜絡之間復發數癰於胸之乳間孟英令其恪守前法復入蒲公英絲瓜絡橘葉菊葉等藥服至百劑始告痊愈而天癸亦至孟英曰世俗泥於産後宜溫之謬説況兼泄瀉即使溫補而死病家不怨醫者無憾也或具隻眼其誰信之此證苟非汾伯昆仲篤信於平時而力排衆論於危難之間余雖見到道不疑亦焉能有濟耶余嘗曰病不易識尤不易患醫不易薦尤不易任藥不易用尤不易服誠宇宙間第一難事也而世人淺視之可不悲哉陳書伯太史令弟婦娩後三日發熱汗多苔黃眩悸孟英切脈弦細虛數乃營陰素虧酷熱外爍風陽浮動痙厥之萌也與元參白薇青蒿生地小麥穭豆衣石斛鱉甲竹葉兩劑熱退知飢悸汗不止去青蒿白薇加龍骨牡蠣蓮心龜板紫石英而安繼又因暑風外襲壯熱如焚渴飲不飢睹物盡赤改授白虎湯加西洋參竹葉蓮杆一啜而瘳仍與鎮攝滋潛善其後而愈趙子循室娩後服生化湯兩帖更因驚嚇三朝發熱連投四物六合等湯病日以甚半月後始延孟英診之脈象左弦極右洪滑數苔黃大渴譫語嗽痰惡露仍行唇齒乾燥是因陰虛之體血去過多木火上浮酷暑外爍津液大耗兼有伏痰之候也亟與營衛兩清冀免他變而母家極畏石膏堅不與服越三日勢益劇計無所施子循之叔笛樓與其表兄許芷卿徑以白虎加減投之證有轉機翌日再迓孟英會同笛樓暨其舅氏許吉齋山長協商妥治咸是王孟英之議且以西瓜汁助其藥力熱始日趨下行二便如火又數日漸安粥食神氣亦清起坐梳頭夜能靜寐然熱蘊太久下焦患癰膿雖即潰陰液漏傷脈復空數浮大便泄善嗔口乾多夢皆木少水涵爍津侮胃之見證也孟英與笛樓商以白頭翁湯加龍骨三甲甘草木瓜育陰潛陽餘糧赤石脂丸中加烏梅黃連以熄風鎮胃果得瘡口膿干餐加瀉止脈柔熱淨苔退神怡正須善後甫授滋填不期酷兼旬甘霖忽降窗開徹夜復感風邪身熱微寒鼻流清涕而陰液久奪外患未痂培養礙投又難發汗肝風內應瘈噤旋形九仞之功遂成畫餅門外漢未免以成敗論然此案自堪傳也陸厚甫室陳芷潯主事之女也産後經旬偶發脘痛專科用溫補藥因而寒熱氣逆自汗不寐登圊不能解而臥則稀水自流口渴善嘔杳不納穀僉云不起矣乃父速孟英診之脈弦數而滑曰本屬陰虧肝陽侮胃誤投溫補澀滯之劑氣機全不下降以致諸證蜂起醫者見而卻走是未明其故也與沙參竹茹楝實延胡梔子黃連橘皮貝母杏仁石斛枇杷葉為肅肺以和肝胃法覆杯即安但少腹隱隱作痛於前方去杏仁貝母竹茹加知母花粉蓯蓉白芍橘核海虴乃解宿垢而瘳産後頭痛顧聽泉明經之媳新産後頭痛甚劇孟英按脈右甚滑大與清陽明法得大解而瘥産後痹痛施氏婦産後四肢串痛藥治罔效醫謂其成癱瘓矣延已逾月丐孟英視之膏藥遍貼呻吟不息脈數而洪舌絳大渴曰此非風濕為病膏藥亟為揭去近日服藥諒皆溫補祛風之劑營血耗傷內風欲動勢將弄假成真且吾向見其體豐血旺何以娩後遽患斯疾必生化湯砂糖酒之類所釀耳其父倪某目雖瞽聞而笑曰君誠天醫也小女服過生化湯兩帖赤沙糖八斤從此漸病不識尚可起廢圖全否孟英曰幸其體足於陰恢復尚易若陰虛血少之人而蹈此轍雖不即死難免不成蓐損因投大劑涼潤壯水之藥一劑知旬日安匝月起孟英謂暑令産婦服生化湯砂糖酒死者甚多唯六一散既清暑熱又行瘀血溽暑之令誠為産後妙方産後吐瀉夏間牙行倪懷周室新産數日泄瀉自汗嘔吐不納專科謂犯三禁不敢肩任孟英診脈虛微欲絶證甚可虞宜急補之遲不及矣用東洋參炙耆白術龍骨牡蠣酒炒白芍紫石英桑枝木瓜扁豆茯神黑大豆橘皮投之四劑漸已向安余謂新産後用參耆大補而又當盛夏之時非有真知灼見者不能也誠以天下之病千變萬化原無一定之治奈耳食之徒唯知執死方以治活病豈非造孽無窮亦何苦人人皆欲為醫而自取罪戾耶産後急勞陳氏婦素無病娩後甚健乳極多而善飯六月初形忽遽瘦猶疑天熱使然漸至減餐所親徐麗生囑延孟英視之脈細數舌光絳曰急勞也無以藥為夫乳者血之所化也乳之多寡可徵血之盛衰茲乳溢過中與草木將枯精華盡發於外者何異即令斷乳亦不及矣其家人聞之未為深信即日斷乳服藥及秋而逝吳馥齋室新産後嘔吐不止湯水不能下咽頭痛痰多苔色白滑孟英用蘇梗橘皮半夏吳萸茯苓旋覆薑皮柿蒂紫石英竹茹一劑知二劑已子宮脫垂翁嘉順令正娩後陰戶墜下一物形色如柿多方療之不收第三日始求治於孟英令以澤蘭葉二兩煎濃湯熏而溫洗隨以海螵蛸五倍子等分研細粉糝之果即收上繼而惡露不行白帶時下乳汁全無兩腿作痛又求方以通之孟英曰此血虛也乳與惡露雖無其腹必不脹前證亦屬大虛合而論之毋庸診視因與黃耆當歸甘草生地杜仲大棗糯米脂麻藕肉濃煎羊肉湯煮藥服後乳汁漸充久服乃健三兒科麻疹溽暑之令瘄江浙稱麻疹為瘄疹盛行幼科僅知套藥升柴防葛亂施殆亦疫癘之病造化默行其殺運歟陳仰山家患此者十餘人其長郎書芾孝廉之女勢最劇以瘄甫出而汛至也醫者卻走始延孟英視之脈滑而數舌絳大渴面赤失音不食便瀉曰此由發散太過火盛風熾氣血兩燔氣分之邪由瀉而略泄其焰營分之熱由汛而稍解其焚豈可畏其脫陷妄投止澀耶與西洋參石膏知母麥冬犀角生地連翹甘草石斛丹皮桑葉竹葉大劑投之三日而愈養陰善後遂以漸安其餘或輕或重孟英一以清解而痊仲夏瘄疹流行幼科執用套藥夭扎實多有王子能參軍所親楚人劉某僅一子甫五齡陸某見其瘄點不綻連進柳柳等藥壯熱無汗面赤靜臥二便不行參軍聞其殆延孟英視之投犀羚白虎湯而轉機陸某力阻石膏不可再餌仍進溫散以至氣喘痰升復加麻黃八分欲圖定喘而喘汗瀕危二便復祕再懇孟英救之投白虎湯加西洋參竹葉而愈繼有房氏子亦為陸某誤用溫散致劇痰喘便祕口渴神昏溲碧肢瘈孟英與大劑白虎湯加西洋參元參竹葉木通調紫雪丹四帖而始安李新畲仲郎瘄未齊而痰嗽氣喘苔色白滑小溲不赤或主犀角地黃湯加紫雪服而不效延孟英診之右脈洪滑而口渴乃天時酷熱暑邪薄肺挾其素有之痰而阻其治節所以氣機不行而疹不能達苔不能化溺不能赤也溫散大忌涼血亦非與竹葉石膏湯合葦莖湯加杏仁紫菀旋復枇杷葉海石投之氣平疹透苔退色紅小溲亦赤數日而愈徐艮生室年四十餘於酷暑之時患瘄所親沈悅亭連豫清解不能剎其勢為邀孟英視之體厚痰多脈甚滑數揚擲譫妄舌絳面赤渴飲便澀乃豫大劑白虎湯加犀角元參銀花花粉貝母竺黃竹葉竹茹竹湯送服滾痰丸服後大便下如膠漆脈證漸和數日後去丸藥其勢復劇甚至發厥仍加丸藥乃平如是者三次險浪始息悅亭復以白金丸滌其膈下留痰續用甘涼濡潤法充津液而搜餘熱漸以告愈姚子瘄後兩腿筋掣臥則更痛幼科作風治而愈劇孟英以犀角生地木通豆卷葳蕤桑枝丹皮梔子絲瓜絡投之而效朱敦書令嬡患感醫投溫散服二劑遍身麻瘄汛事適來醫進小柴胡湯遂狂妄莫制乞援於孟英脈至洪滑弦數目赤苔黃大渴不寐是瘄因溫邪而發所以起病至今時時大汗何必再攻其表汛行為熱迫於營胡反以薑棗溫之人參紫草柴胡升之宜其燎原而不可遏也與大劑犀角元參生地石膏知母花粉銀花竹葉貝母白薇以清衛涼營服後即眠久而未醒或疑為昏沉也屢為呼喚病者驚寤即令家人啓篋易服穿鞋梳髮告別父母云欲往花神廟歸位人莫能攔舉家痛哭急迓孟英復視脈象依然囑其家靜守忽哭仍以前方加重和以竹瀝童溲灌下即安繼用養陰清熱而愈韓石甫大令令正患感發疹沈悅亭治以清解熱漸退而神氣不爽舌黑難伸太息便祕胸次拒按脈弦緩而滑投涼膈散加知母花粉枳實竹茹一帖而苔即退黃再服而黑屎下神氣清即以向愈痘疫上年秋燥冬暖略無霜雪河井並涸吾杭自九月間起天花流行十不救五小兒之殤於是者日以百計孟英曰此痘疫也治法當與常痘有異惜幼科未之察耳且天令發泄不主閉藏入春恐多喉患特刊加味三豆飲俾未種痘者預服免患將出者恣飲冀輕又勸人頻服青龍白虎湯以杜春來喉恙不料其言果應三春不雨喉症甚多醫者猶不悟其致病之因僅知發散正如火上添油孟英胸有成竹一以仲景白虎湯為救焚主劑若已及於營分者用王晉三犀角地黃湯相機加減又刊青龍白虎湯暨錫類散方廣為印送賴此以活者不可勝數附加味三豆飲生緑豆生黃豆生黑大豆或用生白扁豆亦可生甘草金銀花水煎服孟英自注云古方三豆飲為痘疹始終可服之妙藥未出時常服痘可使稀將出時急服重可冀輕已出時恣服逆可轉順盡出時頻服毒可易清俗傳種痘是密室烘花更有初生小兒於十八日內服藥令其出痘之法是揠苗助長此等矯揉造作陰受其害者古今來不知幾恆河沙數矣至於種種稀痘之方皆無意義或以毒藥損人元氣或以穢物致生別恙慎勿為其所惑惟此方藥極簡易性最平和味不惡劣易辦易服不必論其體質久服無弊誠盡善盡美之王道藥也杭人惑於患痘不食豆之説甚屬可鄙今特辨明冀人醒悟凡小兒能啜飲後即以此藥日日代茶誠保赤之首章焉原方用赤豆性燥傷陰豫以黑大豆易之更有補陰之績雖燥令燥體皆無礙矣再益銀花甘草而化毒之功尤勝或疑銀花性涼似難久用不知三豆皆谷也性能實脾得銀花以濟之更覺沖和況小兒體稟純陽極宜此甘涼補陰之味豈特稀痘尤能明目消疳不生瘡癤泄瀉等病其功未能殫述也附青龍白虎湯橄欖生萊蔔水煎服孟英自注云此豫自制方也橄欖色青清足厥陰內寄之火風而靖其上騰之焰萊蔔色白化手太陰外來之燥熱而肅其下行之氣合而為劑消經絡留滯之痰解膏粱魚面之毒用以代茶則龍馴虎伏藏府清和豈但喉病之可免耶且二味處處皆有人人可服物異功優久任無弊實能弭未形之患勿以平淡而忽諸附錫類散象牙屑焙真珠各三分飛淨青黛六分梅花冰片三釐壁錢二十個俗名喜兒窠木板上者勿用西牛黃人指甲各五釐男病用女女病用男合送濟人須分別配之共研極細粉吹患處流出惡涎即愈孟英自注云此專治爛喉痧疹之神方也尤鶴年附載於金匱翼云張符瑞傳此方以得子故豫之名曰錫類散胡韻梅年已逾冠因夜坐感寒患頭痛惡冷嘔吐肢冷孟英視之曰舌絳脈數痘疹之候斷非受寒也幸胡平昔欽信遂與清透藥服之次日點形圓綻細詢果未出痘但火勢甚熾恐其惑於俗論囑請專科王蔚文會診所見略同一路清涼自起發至落茄痂毫不雜一味溫升攻托之藥而滿身密布形色粗紫漿膿茄痂黑便祕不飢渴無一息之停苟不如是用藥其能免乎此建中瑣言之所以有功於世也周鶴亭令郎年甫五齡痘後月餘清涼藥尚未輟忽發壯熱幼科治之勢益張肢瘈面赤嘔吐苔黃渴而溺清時或昏厥證交六日其外祖何新之邀孟英診之脈甚弦洪滑數心下拒按便祕汗多投小陷胸湯加石膏知母花粉竹葉枇杷葉貝母雪羹二劑各恙皆減溲赤便行繼與清養而安驚風陳姓小兒發熱肢搐幼科與驚風藥遂神昏氣促汗出無溺孟英至而視之曰暑也令取蕉葉鋪於泥地豫兒臥之投以辰砂六一散加石膏知母西洋參竹葉荷花露一劑而瘳繼有胡氏女病略同兒科云不治因懇於孟英亦以此法活之喬有南侄甫五齡發熱數日醫豫柴葛解肌湯一劑肢搐而厥目張不語其母孀居僅此一脈偏求治療毫無寸效所親徐和甫托王瘦石訪一擅幼科之長者瘦石謂宜求善於外感者蓋人有大小病無二致切勿舍大方脈而信專科此喻嘉言活幼金針也盍延孟英視之徐從之孟英曰病是暑邪治以風藥熱得風而焰烈津受灼以風騰乃風藥引起肝風再投俗尚驚風之劑稚子根本不牢而狂風不熄拔折堪虞與王氏犀角地黃湯加羚羊角生石膏元參桑葉菊花銀花牡蠣知母麥冬竹葉諸藥數服而痊疳積陳荷官病痞積腹脹發熱干嗆善食而黃瘦便溏溺赤兒科藥廣服無功已將絶望孟英聞而憐之曰吾於幼科雖未討論姑贈一方或有生機也以黃連白芍牡蠣鱉甲雞肫皮木瓜山楂楝實橘皮桔梗霞天曲旋覆梔子丹皮五穀蟲等藥一劑知旬余愈四外科疽婺人羅元奎丁亥夏卒發寒熱旋即嘔吐不能立自言胯間痛不可當孟英視其痛處焮赤腫硬形如肥皂莢橫梗於毛際之左乃曰此證頗惡然乘初起可一擊去之也用金銀花六兩生甘草一兩皂角刺五錢水煎和酒服之一劑減其勢再劑病若失逾年患傷寒孟英切脈虛細已極曰此不可徒攻其病者以陰分太虧耳與景嶽法以熟地當歸酒炒白芍炙甘草橘皮柴胡等藥一劑而瘳李燕標參戎於癸夏將赴都館於石北涯家項後患疽外科僉云不治孟英薦老醫朱嵩年療之漸安孟英偶診其脈謂北涯曰李證有可愈之機脈難久享其年北涯驚問所以孟英曰左尺堅摶真陰已傷非善象也既而告痊北上今春果卒於京茅家埠翁嘉潤患腰疽愈而復發者五年費用不資諸瘍醫治之不效盛少云囑其求治於孟英切其脈弦細以數曰子之幸也此內損證外科惡烏乎知與大劑甘潤滋填之藥匝月而痊至今不發無名腫毒翁嘉順去年秋間從梯半跌撲初無所傷旬日外陡發寒熱膝旁腫痛外科汪某治之潰後不能收功另招許某療之識為傷絡應手漸效翁極信服然培補年餘雖納食不減而肌肉漸削面色黧黑步履蹇滯且一旬半月之間必患處疼痛大發寒熱臥榻數日始能強起大費不資愈發愈劇至冬間咽糜齦腐睛赤音嘶乃懇孟英以決吉凶按脈滑數舌絳便艱口臭溲少蘊隆蟲蟲良由瘍醫僅知溫托一法既潰之後更以溫補收功善後竟未察其體氣病情以致平時所有之濕熱痰火一齊關住病猶自尋出路寒熱頻作而醫者不識妄指為虛補其逾年人財兩瘠真諺所云將錢買憔悴也與元參黃柏知母甘草銀花花粉緑豆梔子海虴荸薺為大劑投之吹以錫類散且令日啖梨蔗麒麟菜柿餅等物至五十日諸恙悉蠲體腴善步癤濮嫗於酷熱之秋渾身生癤如疔痛楚難堪小溲或祕或頻大便登圊則努掙不下臥則不能收攝人皆謂其虛也孟英診脈滑數舌紫苔黃而渴豫白虎湯加花粉竹葉梔子白薇紫菀石斛黃柏十餘劑而痊瘰癧歙人吳茂林患右頰腫痛頦下結核牙關僅能呷稀糜外科稱名不一治若網知孟英投以大麻殭蠶羚羊角石膏省頭草升麻當歸秦艽花粉黃芩等藥漸愈發頤朱小輝太守令嬡驟患頤腫連及唇鼻乃至口不能開舌不得出孟英視之曰此溫毒也用射干山豆根馬勃羚羊角薄荷銀花貝母花粉杏仁竺黃為劑並以紫雪丹搽於唇內錫類散吹入咽喉外將橄欖核磨塗腫處果吐韌涎而腫漸消詰朝即啜稀粥數日而愈乳中結核胡氏婦患乳房結核外科雜投溫補核漸增而痛脹日甚馴至形消汛愆夜熱餐減骨痿於床孟英診曰郁損情懷徒補奚益豫以蠲痰開鬱之劑吞當歸龍薈丸痛脹遞減熱退能餐月事仍行改投虎潛丸加減法服半年餘而起凡前後計用川貝母七八斤他藥稱是今春因哭母悲哀陡然發厥豫甘麥大棗湯加龍骨牡蠣龜版鱉甲磁朱丸金箔龍眼肉而安腸癰石芷卿驟患腹脹旬日後臍間出膿外科視為腸癰與溫補內托之藥遂咳嗽不眠腹中絞痛異常痰色紅緑大便不行乃延孟英商之脈弦細以數舌絳而大渴曰察脈候是真陰大虛之證耆桂歸術皆為禁劑以甘露飲加西洋參花粉貝母杏仁冬瓜子投之痰咳即安而外科謂此恙最忌泄瀉潤藥不宜多服孟英曰陰虛液燥津不易生雖求其泄不可得也烏可拘泥一偏而不知通變哉仍以前法去杏仁貝母花粉加知母百合合歡皮為方並囑另邀老醫朱嵩年敷治其外如法施之果漸向安久之當臍痂落如小兒落臍帶狀臍內新肉瑩然而愈梅毒吳藝閣因壯年時患梅瘡過服寒涼之藥瘡雖愈陽氣傷殘虛寒病起改投溫補如金液丹大造丸之類始得獲安奈醫者昧於藥味為補偏救弊而設漫無節制率以為常馴至血溢於上便瀉於下食少痰多喘逆礙臥兩足不能屈伸童某猶云寒濕為患進以苓薑朮桂湯多劑勢益劇且溲漸少而色緑如膽汁醫皆不明其故延孟英診之脈弦硬無情曰從前寒藥戕陽今則熱藥竭陰矣胃中津液皆灼爍以為痰五臟咸失所養而見證如上水源欲絶小溲自然漸少木火內焚乃露東方之色與章虛谷之所治暑結厥陰用來復丹攻其邪從溺出而見深碧之色者相同然彼實此虛判分天壤恐和緩再來亦難為力矣尋果歿腎囊癰胡蔚堂年近古稀患囊腫小溲赤短寒熱如瘧孟英曰非外感也乃久蘊之濕熱下流氣機尚未宣泄豫五苓散合滋腎丸加楝實梔子木通兩劑後囊間出腥黏黃水甚多小溲漸行寒熱亦去繼與知柏八味去山藥萸肉加梔子楝實芍藥苡仁等久服而愈膿窠瘡金元章媳於甲午新寡後患膿窠瘡大抵濕熱之病耳瘍醫連某疑為遺毒竟作廣瘡療漸至上吐下利不進飲食另從內科治亦無寸效延至春末更兼腹痛自汗汛愆肌削諸醫皆見而卻走矣王仲安薦孟英視之曰此胃氣為苦寒所敗肝陽為辛熱所煽前此每服陽剛即如昏瞀稍投滋膩泄瀉必增遂謂不治之證未免輕棄乃以四君子湯加左金丸川椒烏梅蓮子木瓜餘糧石脂等出入為方百日而愈第信猶未轉也諸親友環議再不通經病必有變孟英力辨此非經阻可通之證惟有培養生化之源使其氣旺血生則流行自裕若不揣其本而齊其末則礱礱粳即稻穀之粗殼粳不能榨油徒傷正氣盡墜前功豈不可惜衆議始息恪守其方服至仲冬天癸至而肌肉充康復如常矣附王氏云蓮子最補胃氣而鎮虛逆若反胃由於胃虛之氣衝不納者皆是熱邪傷其胃中清和之氣最宜黃連苦泄其熱即仗蓮子甘鎮其胃蓋以蓮子清香不渾鎮胃之功獨勝爰附録於此以備參考五五官科目赤朱養之令弟媳初患目赤服藥後漸至滿面紅腫壯熱神昏醫者束手孟英切脈洪實滑數舌絳大渴腹微脹以酒洗大黃犀角元參滑石甘草知母花粉銀花黃芩連翹薄荷菊花丹皮兩下之竟愈王天成牙行一婦年五十餘初患左目赤漸至發熱醫投溫散便瀉而厥進以補劑少腹宿瘕攻痛勢極危殆丐孟英診之脈甚弦實舌絳而渴豫蓯蓉橘核當歸元胡龜板石英螵蛸茯苓梔子楝實吳茱萸黃連數服而安逾年以他病卒江蘿花如君患兩目腫痛不能略張醫投風藥昏譫欲厥浼孟英診之脈至洪滑大渴便祕豫白虎湯二劑霍然翁氏婦患目疾自春徂夏治不能瘳漸至腹中痞脹痛不可當食不能下便祕形消孟英視之乃肝鬱痰滯而誤補以致殆也脈弦數而滑豫金鈴子散合雪羹煎湯吞當歸龍薈丸及礞石滾痰丸三投即效服至二十餘日各恙皆蠲眠食如舊內障胡季權之子珍官甫六歲目患內障繼則夜熱痰嗽小溲過多醫作童損治服滋補數月病日以甚孟英持脈右大口渴苔黃曰伏暑在肺法當清解及詳詰其因始言病起瘄後蓋餘邪未淨而投補太早與滑石知母花粉桑葉茅根枇杷葉蘆根冬瓜子杏仁服二劑遍身發出癍塊又二劑癍退苔化乃去滑石加沙參餌之其熱頭面先退次退四肢以及胸背又數日甫退於腹人皆詫其熱退之異孟英謂熱伏既久復為半年之補藥膩滯於其間焉能一旦盡滌其勢必漸清而漸去也熱退既淨溺亦有節痰嗽遞蠲餐加肌潤而內障亦漸除矣胞瞼腫核馮媼患左目胞起瘰繼而痛及眉稜額角巔頂腦後筋掣難忍醫投風藥其勢孔亟孟英診脈弦徑舌絳不飢豫固本丸合二至丸加桑葉菊花犀角羚羊角玄參牡蠣鱉甲白芍知母石斛丹皮細茶等出入互用匝月始愈喉痹一男子患喉痹專科治之甫愈而通身腫勢日增醫者驚走孟英診之曰病藥病藥謂病由誤藥所致也投附子理中湯數劑而愈豫謂喉痹治以寒涼法原不謬而藥過於病翻成溫補之症是病於藥也嘗聞孟英云病於病而死者十之三病於藥而死者十之七以余觀之誠非激論也籲可嘆矣潘馥堂令嬡患感沈悅亭治之漸愈惟咽阻無形水穀礙下孟英以竹葉石膏湯加紫菀白前旋覆枇杷葉以清肺熱而降肺氣果即貼然許安卿患咽痛瘍科黃秀元連豫升散之藥延及齦腫牙關不開舌不出齒自汗脈澀絶谷瀕危孟英往勘即令洗去滿頸敷藥以菊葉搗塗吹以錫類散煎犀角羚羊角射干馬勃梔子貝母山豆根等藥灌之數日而痊沈春暘之母偶患咽喉微痛服輕藥一劑即覺稍安且起居作勞如常第五日猶操針黹至四鼓第六日忽云坐立不支甫就榻即昏沉如寐亟延王瘦石視之用犀角地黃湯化萬氏牛黃丸灌之繼邀徐小波診亦主是湯云恐無濟乃邀孟英決之切其脈左數右滑皆極虛軟曰王徐所見極是但雖感冬溫邪尚輕微因積勞久虛之體肝陽內動灼液成痰逆升而厥儼似溫邪內陷之候方中犀角靖內風牛黃化痰不妨借用病可無虞今日不必再投藥餌矣翌日復診神氣雖清苔色將黑孟英豫肅肺蠲痰熄風充液之劑熱退而苔色鬆浮孟英曰舌將蛻矣仍豫前藥越宿視之苔果盡褪宛如脫液之舌且嘔惡時作大解未行孟英於甘潤生津藥內乃佐竹茹竹瀝柿蒂海蜇數劑嘔止便行而舌上忽布白腐之苔及齒齦唇頰滿口遍生揩拭不去人皆異之孟英堅守肅清肺胃仍佐竹茹竹瀝加橄欖銀花建蘭葉數劑白腐漸以脫下舌色始露惟啜粥則胸次梗梗不舒夜不成寐孟英曰胃汁不充熱痰未淨也仍守前議病家疑之復商於瘦石瘦石云勿論其他即如滿口腐苔酷似小兒鵝白即鵝口瘡大方證甚屬罕見苟胸無學識者見之必按劍而詫今醫者有不惑之智而病家乃中道生疑豈求愈之道焉沈大愧服一遵孟英設法既而吐痰漸少納穀頗適兩脅又添辣痛孟英診脈左關弦數曰必犯忿怒矣詰之果然加山梔川楝旱蓮女貞生白芍緑萼梅等數服各恙皆減膚蛻如片而右腿腫痛不能屈伸或疑風氣思用艾灸孟英急止之曰此陰虧耳誤灸必成廢疾吾以妙藥奉贈但不許速效也疏方以西洋參熟地蓯蓉桑椹石斛木瓜當歸白芍二冬杞子菊花楝實牛膝無核白葡萄乾為劑久服果得向愈越三載以他疾終喉風德清蔡初泉陡發寒熱咽痛大渴脘悶舌絳孟英診脈甚數徑投大劑犀角羚羊角元參丹皮桑葉梔子銀花花粉連翹牛蒡服後遍身發赤疹而熱退知飢矣疫喉痧段春木之室爛喉內外科治之束手姚雪蕉孝廉薦孟英視之骨瘦如柴肌熱如烙韌痰阻於咽喉不能咯吐須以帶帛攪而曳之患處紅腫白腐齦色皆糜米飲不沾汛事非期而至按其脈左細數右弦滑曰此陰虧之體伏火之病失於清降擾及於營先以犀角地黃湯清營分而調妄行之血續與白虎湯加西洋參等肅氣道而瀉燎原之火外用錫類散掃痰腐而消惡毒繼投甘潤藥蠲餘熱而充津液日以向安月餘而起吳雨峰明府家囑兒科為其仲郎所出之兩孫種痘下苗二三日發熱咽痛醫以為痘之將形也投以升透之藥赤斑似錦咽爛如焚半月之間闔家傳染諸醫莫敢入其室孟英往診時見其三郎耕有四郎小峰尚未病亟曰已病者固當圖治未病者尤宜防患傳以青龍白虎湯代茶恣飲竟得無恙其令閫洪宜人及仲媳皆為之治愈此外如其長媳其令嬡其三孫其僕其探病之女戚殞於是病者七人焉時雨峰築岩兩喬梓父子咸官於外仲郎亦幕遊江右不料因種痘而釀此禍益信孟英勸人勿種痘之説為可訓也潘洪疇托兒醫為其仲郎所出之孫種痘下苗三日即咽痛發熱斑爛七朝而夭春波及其弟祥衍皆染其病春波之證顧聽泉治而愈矣祥衍之恙咽喉爛至於舌胸膈痞塞不通牙關緊澀小溲淋痛口流紫黑血塊人皆謂其臟腑爛焉孟英視之曰惡血毒涎正欲其出吹以錫類散用碗承其口流出涎血甚多咽喉牙環胸膈皆得漸舒投以犀角地黃湯加元參銀花童溺藕汁竺黃花粉貝母石菖蒲之類漸以向安繼與生津填補而痊陳書伯之二令妹亦患喉疹汛事適行四肢痠痛略難舉動氣塞於咽孟英診脈弦滑以犀角羚羊角旋復赭石竹茹貝母兜鈴牛蒡射干豆根花粉銀花海虴竹瀝絲瓜絡等出入為方兼吹錫類散而瘥陳書伯庶母同時患喉糜而頭偏左痛心悸欲嘔壯熱煩躁脈弦細數孟英曰此兼陰虧風動也初以犀角羚羊角元參菊花丹參梔子桑葉馬勃投之外吹錫類散咽愈熱退續用二至丸二冬生地石英蓯蓉龜板茯苓滋陰潛陽而瘳陳書伯庶堂令弟保和年未弱冠患失音咽痛孟英豫犀角羚羊角石膏元參豆根牛蒡射干等大劑清肅之藥音開而咽糜吹以錫類散糜愈而疹點滿布左目及耳後皆腫方中加以鮮菊葉二兩疹愈但痰嗽不已仍主前法服三十餘帖而痊此證脈滑且數口大渴初終未曾誤藥故能愈陰虛喉癬孫位申室人平昔陰虛肝滯痛脹少餐暮熱形消咽痛喉癬不孕育者九年矣往歲汛愆人皆謂將不起而孟英切其脈尚不細而肌猶卓澤許籌帶病延年之策果月事仍行而諸恙皆緩且能作勞唯飲食日不過合米今秋延孟英往診自云經自三月至今未轉一切舊恙彌見其增君術雖仁恐難再延其算矣及舉脈弦滑左甚遽曰豈僅可延其壽算哉有熊羆入夢矣其家聞之駭異逮季冬果得一子頗快而健鼻淵程秋霞之子患腦漏醫與辛夷蒼耳之藥漸有寒熱改用柴葛羌防數帖遂至寒熱日發數次神昏自汗勢甚可危孟英用竹葉石膏湯一劑寒熱退而神清進粥繼以甘涼清肅復投滋潤填陰旬日而愈舌瘡舌糜牙行王炳華妻患舌瘡痛礙飲食內治外敷皆不效孟英視其舌紅潤脈形空數曰此血虛火浮也以産後發熱例施之用熟地當歸酒炒白芍炙甘草茯苓炮薑投之其病如失一老人霍亂後目閉厄忒醫謂脫陷在即與挂附回陽之藥業已煎矣適孟英至詢知溺赤口乾診得脈形軟數而藥香撲鼻即曰此藥中有肉桂叟勿服也服之必死迫令將藥傾潑而豫肅肺清胃之劑果漸向安瞿氏婦患舌糜沈悅庭知其素稟陰虧虛火之上炎也豫清涼滋降之法及珠黃散等敷藥而不愈孟英視之舌心糜腐黃厚邊尖俱已無皮湯飲入口痛不可當此服藥所不能愈者令將錫類散糝摻之果即霍然或疑喉藥治舌何以敏捷如斯孟英曰此散擅生肌蝕腐之長不但喉舌之相近者可以借用苟能隅反其功未可言罄作完畢解貴用者之善悟耳且糜腐厚膩不僅陰虛要須識此自知其故
